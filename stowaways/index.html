  function resultSheet(fresh) {
    var n = st.order.length;
    var clean = n === 6 && st.hints === 0;
    var verdict, sub, seal, mark;
    if (!st.gave) {
      verdict = clean ? 'Clean sweep.' : 'All six aboard.';
      sub = clean
        ? 'Six stowaways, no hints, no help. Nobody is going to believe you.'
        : 'All six, on ' + st.hints + (st.hints === 1 ? ' hint.' : ' hints.');
      seal = clean ? 'k' : '';
      mark = clean ? 'anchor' : 'done_all';
    } else if (n === 5) {
      verdict = 'One got away.';
      sub = 'Five of six, and the last one was in a sentence you read nine times.';
      seal = 'm'; mark = 'sailing';   // it sailed. the mark from the masthead, escaping
    } else if (n === 0) {
      verdict = 'Nothing aboard.';
      sub = 'Every single one was in plain sight the whole time. Look again below.';
      seal = 'm'; mark = 'visibility_off';
    } else {
      verdict = 'Right there.';
      sub = 'You looked straight at ' + n + ' of the six and walked past the rest. Everyone does.';
      seal = 'm'; mark = 'find_in_page';
    }

    /* On a loss the sheet names exactly what escaped. A near miss is only a
       near miss if you are shown the thing you nearly had. */
    var away = targets.filter(function (t) { return !t.found; })
      .sort(function (a, b) { return a.s - b.s; });
    var awayHtml = away.length
      ? '<div class="gotaway"><span class="gl">' +
        (away.length === 1 ? 'The one that got away' : 'The ones that got away') +
        '</span>' + away.map(function (t) {
          return '<span class="gw' + (t.key ? ' k' : '') + '">' +
            (t.key ? Kit.icon('star', { size: 13 }) : '') + Kit.esc(t.w) + '</span>';
        }).join('') + '</div>'
      : '';

    var html =
      '<div class="stagger">' +
      '<div class="seal ' + seal + '" id="seal">' +
        Kit.icon(mark, { size: 29, fill: 1 }) + '</div>' +
      '<h2>' + verdict + '</h2>' +
      '<p class="sub">' + sub + '</p>' +
      awayHtml +
      /* From here down every game in the suite runs the same tail, in the same
         order: the stats, the share block, the share button, the way on to the
         next puzzle, and the way back to the board. */
      '<div class="statrow">' +
        '<div class="stat"><span class="n tick" id="nFound">0/6</span><span class="l">Found</span></div>' +
        '<div class="stat"><span class="n">' + st.hints + '</span><span class="l">Hints</span></div>' +
        '<div class="stat"><span class="n">' +
          Kit.icon('star', { size: 22, fill: keystone.found ? 1 : 0, cls: keystone.found ? '' : 'off' }) +
        '</span><span class="l">Keystone</span></div>' +
      '</div>' +
      '<div class="sharegrid" id="sg">' + Kit.esc(shareText()) + '</div>' +
      '<button class="btn primary wide" id="shareBtn" type="button">' +
        Kit.icon('share', { size: 19 }) + 'Share result</button>' +
      /* Never a locked gate. The day picked the passage you opened on; the
         result hands you the next one on the spot, won or lost. */
      '<div style="margin-top:14px">' + Kit.nextButton(NS, 'Next passage') + '</div>' +
      '<button class="btn ghost wide" data-close type="button" style="margin-top:8px">' +
        Kit.icon('visibility', { size: 19 }) + 'See where they were</button>' +
      '</div>';

    Kit.sheet(html, { onOpen: function (el, close) {
      el.setAttribute('aria-label', verdict);
      var b = el.querySelector('#shareBtn');
      /* The button is handed to Kit.share and says nothing on its own. It
         used to paint "Copied" on click, which was a guess: when the
         clipboard is blocked the kit falls back to a select-and-copy
         textarea, and the button would still have claimed a copy that had
         not happened. The kit now restores the label via innerHTML — so the
         symbol survives — and reports what actually occurred. */
      b.addEventListener('click', function () { Kit.haptic(8); Kit.share(shareText(), b); });

      // the number that carries the story counts itself up to the truth
      Kit.count(el.querySelector('#nFound'), n, {
        ms: 620, fmt: function (v) { return v + '/6'; }
      });

      /* Earned, not given: only a day where every stowaway came aboard under
         the player's own steam. Six-of-six with hints still gets it — that is
         a win — and a clean sweep gets a second, brass-heavy volley. */
      if (fresh && !st.gave && n === 6) {
        var s = el.querySelector('#seal');
        setTimeout(function () {
          var r = s.getBoundingClientRect();
          var x = r.left + r.width / 2, y = r.top + r.height / 2;
          Kit.burst({ x: x, y: y, n: clean ? 60 : 40, colors: burstInk() });
          if (clean) setTimeout(function () {
            Kit.burst({ x: x, y: y, n: 34, colors: burstBrass() });
          }, 260);
        }, 300);
        Kit.haptic(clean ? [22, 60, 22, 60, 52] : 18);
      }
      void close;
    } });
  }

  resBtn.addEventListener('click', function () { resultSheet(false); });

  /* ---------------------------------------------------------------
     Help — the sheet is now the long read, behind the ? button. The
     first-run teaching is the coach tour at the bottom of this file.
     Lead sentence first, diagram second, rules last.
     --------------------------------------------------------------- */
  function openHelp() {
    Kit.sheet(
      '<h2>Stowaways</h2>' +
      '<p class="sub">Six themed words are spelled straight through the passage — ' +
      'across the gaps between ordinary words, where your eye reads past them.</p>' +
      /* THE DEMO PHRASE — "past this landing", hiding ISLAND.
         It used to be "the sam<b>ba con</b>test", hiding BACON. Both the
         phrase and the answer are in puzzle #218: its passage opens "Uncle
         Ray's turn at the samba contest" and BACON is one of its six words,
         so the tutorial handed a first-timer a free find on the very board
         it opened. The replacement is checked against every shipped passage:
         neither "this" nor "landing" appears in any of them, the phrase does
         not appear in any of them, no substring of THISLANDING five letters
         or longer occurs in any letters-only passage string, and ISLAND is
         in no puzzle's words list and no puzzle's decoys list. Any future
         demo phrase has to clear the same four checks. */
      '<div class="demo">' +
        '<div class="demo-r pale">past this landing</div>' +
        '<div class="demo-r">past th<b>is land</b>ing</div>' +
        '<div class="demo-c">Island · spaces do not count</div>' +
      '</div>' +
      '<ul class="rules" style="padding-left:18px;margin:0">' +
        '<li><b>Tap a word’s first letter, then its last.</b> Or drag across it. ' +
          'Tap the same letter twice to cancel.</li>' +
        '<li><b>Wrong guesses cost nothing.</b> Guess constantly — this is a game ' +
          'about looking, not risking.</li>' +
        '<li>The starred berth on the manifest is the <b>keystone</b>: the longest ' +
          'word, and the one that names the theme. Finding it early is the flex.</li>' +
        '<li>Three hints. Each flashes the first letter of a word still hiding — ' +
          'and marks that find on your share.</li>' +
      '</ul>' +
      /* The four arrow glyphs used to be set as characters, and only two of
         them survive: the shipped mono subset carries U+2191 and U+2193 but
         NOT U+2190 or U+2192, so the row rendered half in Google Sans Code
         and half in whatever system mono the device fell back to — two of the
         four keys visibly wider and lighter than the others. Named keys, the
         way Chains, The Rule and Seed name theirs. */
      '<p class="keys"><kbd>Arrow keys</kbd> move · ' +
        '<kbd>Enter</kbd> set each end · <kbd>Esc</kbd> cancel · <kbd>H</kbd> hint</p>' +
      '<button class="btn primary wide" data-close type="button" style="margin-top:16px">Got it</button>',
      { onOpen: function (el) { el.setAttribute('aria-label', 'How to play'); } }
    );
  }
  document.getElementById('helpBtn').addEventListener('click', openHelp);

  /* ---------------------------------------------------------------
     Autofit — the passage owns `touch-action: none` so a drag never
     scrolls the page out from under you. That is only safe if the
     page never needs to scroll, so shrink the type until it fits.
     --------------------------------------------------------------- */
  var BASE_FS = null, MAX_FS = 24;   // a serif reads a size smaller than the sans did
  function autofit() {
    if (st.over) return;
    if (BASE_FS === null) { passEl.style.fontSize = ''; BASE_FS = parseFloat(getComputedStyle(passEl).fontSize); }
    var size = BASE_FS, guard = 0;
    passEl.style.fontSize = '';
    var doc = document.documentElement;
    var over = function () { return doc.scrollHeight > doc.clientHeight + 1; };
    if (over()) {
      while (over() && size > 15 && guard++ < 40) { size -= 0.5; passEl.style.fontSize = size + 'px'; }
    } else {
      // slack left over: the passage is the hero, so let it take the room
      // rather than leaving a dead gap under it
      while (!over() && size < MAX_FS && guard++ < 40) { size += 0.5; passEl.style.fontSize = size + 'px'; }
      if (over()) { size -= 0.5; passEl.style.fontSize = size + 'px'; }
    }
    // If it still will not fit (very short screen), stop trapping vertical
    // gestures — the page must stay scrollable. Tap-tap is unaffected.
    passEl.style.touchAction = doc.scrollHeight > doc.clientHeight + 1 ? 'pan-y' : 'none';
    rects = null;
  }
  /* Filling a chip with a long word (BREAKFAST, ORCHESTRA) can wrap the chip
     row and cost a line of height mid-game. Only ever shrink here — re-running
     the full autofit would snap the type back up and jolt the page. */
  function refit() {
    if (st.over) return;
    var doc = document.documentElement;
    if (doc.scrollHeight <= doc.clientHeight + 1) return;
    var size = parseFloat(getComputedStyle(passEl).fontSize), guard = 0;
    while (doc.scrollHeight > doc.clientHeight + 1 && size > 15 && guard++ < 30) {
      size -= 0.5;
      passEl.style.fontSize = size + 'px';
    }
    passEl.style.touchAction = doc.scrollHeight > doc.clientHeight + 1 ? 'pan-y' : 'none';
    rects = null;
  }

  var fitT;
  window.addEventListener('resize', function () {
    BASE_FS = null;
    clearTimeout(fitT);
    fitT = setTimeout(autofit, 120);
  });

  /* ---------------------------------------------------------------
     Boot
     --------------------------------------------------------------- */
  buildChips();
  targets.forEach(function (t) {
    if (t.found) paintFound(t, false);
    else if (t.hinted && !st.over) cells[letters[t.s].cell].el.classList.add('tip');
  });
  fillChips(null, false);
  syncHintBtn();
  relight();
  setReadout(-1);
  if (keystone.found) markKicker();

  if (st.over) {
    targets.forEach(function (t) { if (!t.found) paintMissed(t, null); });
    renderAfterwards();
    quitBtn.hidden = true; hintBtn.hidden = true; resBtn.hidden = false;
    logEl.hidden = true;
    passEl.style.cursor = 'default';
    passEl.style.touchAction = 'auto';
    /* A finished day reopens its result rather than restarting — and the
       afterword makes the page taller than the viewport, so the Result
       button is below the fold on arrival and is not something to rely on.
       The sheet is the way back to the share block and to the next passage. */
    setTimeout(function () { resultSheet(false); }, 280);
  } else {
    // the dispatch line opens on the empty hold, in the ship's-log voice, so
    // the well below the passage never reads as unresolved space
    if (st.order.length) {
      var lastW = st.order[st.order.length - 1];
      var lastT = byWord(lastW);
      if (lastT.key) log('star', 'Keystone aboard — ' + lastW, 'ks');
      else log('anchor', lastW + ' — aboard', 'good');
    } else {
      logIdle();
    }
    autofit();
  }

  /* ---------------------------------------------------------------
     First run: three coach marks, not a wall of rules. Each one points
     at the single thing to look at next, and the last one hands over
     the passage itself. The full rules stay behind the ? button.

     Then the empty state, before a single mark has been made: one slow
     pass of light down the column. It teaches nothing on its own — the
     readout above carries the instruction — but it answers the question
     a wall of static prose provokes, which is "am I meant to touch this?"
     --------------------------------------------------------------- */
  function inkPass() {
    if (st.over || calm() || st.order.length) return;
    passEl.classList.add('sheen');
    setTimeout(function () { passEl.classList.remove('sheen'); }, 2500);
  }

  function firstRun() {
    if (st.over) return;
    if (!Kit.once('stowaways:tour')) { inkPass(); return; }
    Kit.tour([
      { sel: '#kicker', place: 'below', pad: 4,
        text: 'Everything hiding today has <b>this</b> in common.' },
      { sel: '#manifest', place: 'below', pad: 6,
        text: 'Six berths to fill. The brass one is the <b>keystone</b> — the longest word, and it names the theme.' },
      // The gesture is SHOWN, not described — on the demo phrase from
      // openHelp() above, which is checked against every shipped passage so
      // the tutorial can never hand over an answer to the board behind it.
      // placed ABOVE on purpose: left to itself the bubble lands under the
      // passage and covers the bottom third of the thing it is pointing at
      { el: passEl, pad: 6, place: 'above',
        text: 'Words run straight through the passage, across the gaps between ' +
              'the real ones. Drag over one — or tap its first letter, then its last.' +
              '<span class="ex">past th<b>is land</b>ing</span>' }
    ], { doneLabel: 'Start looking', onDone: function () { setTimeout(inkPass, 240); } });
  }

  window.addEventListener('load', function () {
    rects = null;
    if (!st.over) autofit();
    setTimeout(firstRun, 260);
  });
})();
</script>
</body>
</html>
