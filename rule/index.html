<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rule — Superfun Daily</title>
<meta name="description" content="One hidden rule. Six clues. Six probes. Crack it in as few as you dare.">
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{
  --accent:#5b46c9;
  --accent-soft:#e2ddf7;
  --accent-ink:#fff;
}
/* Dark needs a lighter accent AND a dark ink on top of it, or every filled
   pill turns into white-on-lavender mush. Same for the good/bad semantics —
   the kit's light-mode green and rust go muddy on a near-black paper. */
@media (prefers-color-scheme: dark){
  :root{ --accent:#a596f2; --accent-soft:#2b2350; --accent-ink:#16112c;
         --good:#4cb782; --bad:#e2664e; }
}
:root[data-theme="dark"]{ --accent:#a596f2; --accent-soft:#2b2350; --accent-ink:#16112c;
                          --good:#4cb782; --bad:#e2664e; }
:root[data-theme="light"]{ --accent:#5b46c9; --accent-soft:#e2ddf7; --accent-ink:#fff;
                           --good:#2e7d4f; --bad:#b3402f; }

/* ---------- layout tweaks ---------- */
.app{ padding-bottom: calc(8px + var(--safe-b)); }
.stage{ justify-content:flex-start; gap:12px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.prompt{ padding:9px 13px; }
.prompt .v{ font-size:13.5px; }
.bar{ margin-bottom:10px; }
.bar h1{ font-weight:800; letter-spacing:.14em; }

/* micro-label: the one caps style used everywhere */
.mic{ font-size:9.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }

/* ---------- evidence board ---------- */
.board{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.col{
  background:var(--white); border:1px solid var(--line); border-radius:var(--r);
  padding:9px 11px 10px; box-shadow:var(--shadow-1);
  border-top:3px solid var(--good);
}
.col.no{ border-top-color:var(--bad); }
.col h3{
  margin:0 0 7px; font-size:9.5px; font-weight:800; letter-spacing:.13em;
  text-transform:uppercase; color:var(--good); display:flex; gap:5px; align-items:center;
}
.col.no h3{ color:var(--bad); }
.col h3 .gl{ font-size:11px; line-height:1; }
.col .w{
  font-family:var(--font-mono); font-size:13.5px; font-weight:500; letter-spacing:.04em;
  padding:2.5px 0; color:var(--ink); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}

/* ---------- lab notebook ---------- */
.nb-head{
  display:flex; align-items:center; gap:9px; margin-top:2px;
  font-size:9.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
}
.nb-head .rule-line{ flex:1; height:1px; background:var(--line); }
.nb-head .left{ font-family:var(--font-mono); font-weight:700; color:var(--ink-2); letter-spacing:.08em; }
.note{ display:flex; flex-direction:column; gap:5px; }
.entry{
  display:flex; align-items:center; gap:11px;
  background:var(--white); border:1px solid var(--line);
  border-left:3px solid var(--line-2);
  border-radius:10px; padding:7px 11px 7px 10px; min-height:38px;
  font-family:var(--font-mono); font-size:15px; font-weight:600; letter-spacing:.07em;
  animation:drop .22s cubic-bezier(.2,.9,.3,1);
  transition:border-color .25s, background .25s;
}
@keyframes drop{ from{ opacity:0; transform:translateY(-8px) } }
.entry .n{
  font-family:var(--font-mono); font-size:10px; color:var(--ink-3);
  letter-spacing:.02em; font-weight:700; min-width:15px;
}
.entry .w{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* the verdict chip — the ✅/❌ rhythm that runs down the log */
.entry .res{
  margin-left:auto; flex:0 0 auto; width:26px; height:26px; border-radius:8px;
  display:grid; place-items:center; font-family:var(--font-ui); font-size:14px;
  line-height:1; background:var(--paper-2); color:var(--ink-3);
}
.entry.yes{ border-left-color:var(--good); }
.entry.no{ border-left-color:var(--bad); }
.entry.yes .res{ background:var(--good-soft); animation:land .3s cubic-bezier(.2,1.6,.4,1); }
.entry.no  .res{ background:var(--bad-soft);  animation:land .3s cubic-bezier(.2,1.6,.4,1); }
@keyframes land{ 0%{ transform:scale(.4); opacity:0 } 60%{ transform:scale(1.18) } 100%{ transform:scale(1) } }
/* the beat of suspense */
.entry.pending{ border-left-color:var(--accent); background:var(--paper-2); }
.entry.pending .w{ color:var(--ink-2); }
.entry.pending .res{ background:transparent; display:flex; align-items:center; justify-content:center; }
.entry.pending .res span{
  display:inline-block; width:4px; height:4px; border-radius:50%; margin:0 1px;
  background:var(--accent); animation:think 1s infinite;
}
.entry.pending .res span:nth-child(2){ animation-delay:.16s }
.entry.pending .res span:nth-child(3){ animation-delay:.32s }
@keyframes think{ 0%,60%,100%{ opacity:.22; transform:translateY(0) } 30%{ opacity:1; transform:translateY(-2px) } }
/* unwritten lines of the log */
.entry.ghost{
  background:transparent; border-style:dashed; border-color:var(--line);
  border-left-width:3px; min-height:28px; padding-top:3px; padding-bottom:3px;
  animation:none; color:var(--ink-3);
}
.entry.ghost .dots{ flex:1; border-bottom:1px dotted var(--line-2); height:0; opacity:.7; }
.nb-empty{ font-size:12.5px; color:var(--ink-3); text-align:center; padding:2px 0 0; line-height:1.5; }
.nb-empty b{ color:var(--ink-2); font-family:var(--font-mono); font-weight:600; letter-spacing:.03em; }

/* ---------- tray ---------- */
.tray{
  display:flex; flex-direction:column; gap:9px; padding-top:10px;
  position:sticky; bottom:0; background:var(--paper); z-index:2;
}
.tray::before{
  content:''; position:absolute; left:0; right:0; top:-14px; height:14px;
  background:linear-gradient(to top, var(--paper), transparent); pointer-events:none;
}
@media (max-width:619px){ .tray{ margin-top:auto; } }
.slot{
  height:50px; border:2px dashed var(--line-2); border-radius:12px;
  display:flex; align-items:center; justify-content:center; background:transparent;
  font-family:var(--font-mono); font-size:20px; letter-spacing:.16em; font-weight:700;
  transition:border-color .15s, background .15s;
}
.slot.filled{ border-style:solid; border-color:var(--accent); background:var(--white); }
.slot .ph{ font-size:11px; letter-spacing:.13em; color:var(--ink-3); font-family:var(--font-ui); font-weight:700; text-transform:uppercase; text-align:center; }
.slot .car{ color:var(--accent); animation:blink 1s steps(2,start) infinite; font-weight:400; margin-left:-.08em; }
.key.wide{ font-size:9.5px; letter-spacing:.02em; font-weight:800; padding:0 2px; }
.deskhint{ display:none; }
@media (min-width:620px){ .deskhint{ display:block; text-align:center; font-size:12px; color:var(--ink-3); } }
@keyframes blink{ 50%{opacity:0} }
.trayrow{ display:flex; align-items:center; gap:10px; }
.pips{ display:flex; gap:5px; align-items:center; }
.pip{ width:9px; height:9px; border-radius:50%; background:var(--accent); transition:background .3s, transform .3s, box-shadow .3s; }
.pip.spent{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--line-2); transform:scale(.72); }
.plab{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:800; }
.plab b{ color:var(--ink-2); font-family:var(--font-mono); }
.callit{
  margin-left:auto; background:var(--white); color:var(--accent);
  border:1.5px solid var(--accent); font-weight:800; letter-spacing:.1em;
  padding:11px 17px; font-size:13px; text-transform:uppercase;
  box-shadow:0 0 0 0 var(--accent-soft);
}
.callit:active{ background:var(--accent); color:var(--accent-ink); }
.callit.urge{ animation:danger 1.6s ease-in-out infinite; }
@keyframes danger{ 50%{ box-shadow:0 0 0 6px var(--accent-soft) } }

/* ---------- call screen ---------- */
.callhead{ text-align:center; }
.callhead .t{ font-family:var(--font-display); font-size:26px; font-weight:800; letter-spacing:-.025em; margin:0; }
.callhead .s{ font-size:13px; color:var(--ink-2); margin:3px 0 0; }
.callbar{
  position:sticky; bottom:0; z-index:2; padding:10px 0 2px; background:var(--paper);
  display:flex; flex-direction:column; gap:7px;
}
.callbar::before{
  content:''; position:absolute; left:0; right:0; top:-16px; height:16px;
  background:linear-gradient(to top, var(--paper), transparent); pointer-events:none;
}
.cands{ display:flex; flex-direction:column; gap:7px; }
.cand{
  display:flex; align-items:center; gap:12px; width:100%;
  min-height:50px; padding:0 13px; text-align:left; cursor:pointer;
  background:var(--white); border:1.5px solid var(--line-2); border-radius:12px;
  font-family:var(--font-mono); font-weight:700; letter-spacing:.06em;
  font-size:clamp(13px,4vw,17px); color:var(--ink);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  transition:background .14s, border-color .14s, transform .1s;
}
.cand:active{ transform:scale(.99); }
.cand .box{
  width:23px; height:23px; flex:0 0 23px; border-radius:7px;
  border:2px solid var(--line-2); display:grid; place-items:center;
  font-size:13px; color:transparent; font-family:var(--font-ui);
}
.cand.sel{ border-color:var(--accent); background:var(--accent-soft); }
.cand.sel .box{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.cand .mk{ margin-left:auto; font-size:11px; letter-spacing:.08em; font-family:var(--font-ui); font-weight:800; text-transform:uppercase; }
.cand.right{ border-color:var(--good); background:var(--good-soft); }
.cand.right .box{ background:var(--good); border-color:var(--good); color:var(--paper); }
.cand.right .mk{ color:var(--good); }
.cand.wrong{ border-color:var(--bad); background:var(--bad-soft); }
.cand.wrong .box{ background:var(--bad); border-color:var(--bad); color:var(--paper); }
.cand.wrong .mk{ color:var(--bad); }
.cand.missed{ border-style:dashed; border-color:var(--good); }
.cand.missed .mk{ color:var(--good); }
.cand.dud{ opacity:.5; }
.counter{ text-align:center; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:800; }
.counter b{ color:var(--accent); font-size:15px; font-family:var(--font-mono); }

/* ---------- result ---------- */
.res-wrap{ display:flex; flex-direction:column; gap:12px; }
.verdict{
  margin:2px 0 0; font-size:clamp(34px,10.5vw,44px); font-weight:800;
  letter-spacing:-.035em; line-height:1;
}
.verdict.win{ color:var(--good); }
.verdict.lose{ color:var(--bad); }
.scoreline{ text-align:center; margin:0; font-size:14.5px; color:var(--ink-2); }
.scoreline b{ color:var(--ink); font-weight:700; }
.tier{
  display:inline-block; padding:4px 12px; border-radius:var(--r-pill);
  background:var(--accent); color:var(--accent-ink);
  font-size:10.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
}
.tier.lose{ background:var(--bad); color:var(--paper); }

/* the sting / the victory lap — one sentence, the thing you say out loud */
.sting{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 13px; font-size:13.5px; line-height:1.5; color:var(--ink-2); text-align:center;
}
.sting b{ font-family:var(--font-mono); font-weight:700; color:var(--ink); letter-spacing:.04em; }
.sting .hi{ color:var(--accent); }

/* ---------- THE REVEAL — the screenshot ---------- */
.reveal{
  background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:18px 16px 14px; box-shadow:var(--shadow-2); position:relative; overflow:hidden;
}
.reveal::before{
  content:''; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg,var(--accent),var(--good));
}
.reveal .kick{
  font-size:9.5px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
  color:var(--accent); display:flex; align-items:center; gap:8px;
}
.reveal .kick::after{ content:''; flex:1; height:1px; background:var(--accent-soft); }
.reveal .rule{
  font-family:var(--font-display); font-size:clamp(22px,6.3vw,27px); line-height:1.16;
  margin:8px 0 8px; font-weight:800; letter-spacing:-.028em; text-wrap:balance;
}
.reveal .detail{ font-size:13.5px; color:var(--ink-2); line-height:1.55; margin:0; }
.reveal .detail em{ font-style:normal; color:var(--ink); font-weight:700; }

.evgroup{ margin:16px -16px 0; padding:0 16px; }
.evgroup h4{
  margin:0 0 5px; font-size:9.5px; font-weight:800; letter-spacing:.13em;
  text-transform:uppercase; color:var(--good); display:flex; align-items:baseline; gap:6px;
}
.evgroup h4 .ct{ color:var(--ink-3); font-weight:700; letter-spacing:.08em; }
.evgroup h4 .why{ margin-left:auto; color:var(--ink-3); font-weight:700; letter-spacing:.06em; }
.evgroup.bad h4{ color:var(--bad); }
.evrow{ display:flex; align-items:center; gap:9px; padding:6px 0; border-top:1px solid var(--line); }
.evgroup.bad .evrow{ padding:4.5px 0; }
.evrow .word{
  font-family:var(--font-mono); font-size:14.5px; letter-spacing:.08em;
  font-weight:600; white-space:nowrap; color:var(--ink);
}
.evgroup.bad .evrow .word{ font-size:13.5px; font-weight:500; color:var(--ink-2); }
.evrow .word em{
  font-style:normal; color:var(--accent); font-weight:800;
  background:var(--accent-soft); border-radius:3px; padding:2px 1.5px; margin:0 -.5px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.evgroup.bad .evrow .word em{ color:var(--bad); background:var(--bad-soft); }
.evrow .tag{
  margin-left:auto; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); font-weight:800; text-align:right; white-space:nowrap;
}
.evgroup.bad .evrow .tag{ color:var(--ink-3); font-weight:700; letter-spacing:.07em; }
.evrow .src{
  font-size:8.5px; color:var(--ink-3); letter-spacing:.11em; text-transform:uppercase;
  font-weight:700; flex:0 0 auto; opacity:.75;
}
.evrow .src::before{ content:'· '; }
/* when every failing word fails for the same reason, say it once and go dense */
.evchips{ display:flex; flex-wrap:wrap; gap:5px; padding-top:6px; border-top:1px solid var(--line); }
.evchips span{
  font-family:var(--font-mono); font-size:12px; font-weight:500; letter-spacing:.05em;
  color:var(--ink-2); background:var(--paper-2); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:3px 9px;
}
.next{ text-align:center; font-size:12px; color:var(--ink-3); }
.next b{ font-family:var(--font-mono); color:var(--ink-2); letter-spacing:.06em; font-weight:700; }
.sharegrid{ font-size:15px; letter-spacing:.04em; text-align:left; margin:0; padding:13px 15px; }

/* ---------- sheets ---------- */
.rules code{
  font-family:var(--font-mono); background:var(--paper-2); padding:1px 5px;
  border-radius:5px; font-size:13px; letter-spacing:.04em;
}
.warn-box{
  background:var(--bad-soft); border:1px solid var(--bad); border-radius:var(--r);
  padding:11px 13px; font-size:13.5px; color:var(--ink); line-height:1.5; margin:14px 0 4px;
}
.sheet .btnrow{ display:flex; gap:9px; margin-top:16px; }
.sheet .btnrow .btn{ flex:1; }
.danger{ background:var(--bad); color:#fff; border-color:transparent; }

@media (min-width:620px){
  .stage{ overflow:visible; }
  .col .w{ font-size:15px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <button class="iconbtn" id="statsBtn" aria-label="Statistics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 20V10M12 20V4M19 20v-6"/>
      </svg>
    </button>
    <h1>The Rule</h1>
    <button class="iconbtn" id="helpBtn" aria-label="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.4 3.2v1.4"/><circle cx="12" cy="17.4" r=".9" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>

  <div class="prompt">
    <span class="k" id="caseNo">Case #1</span>
    <span class="v" id="objective">One hidden rule governs every word. Three obey it, three break it. Work out what it is.</span>
  </div>

  <div class="stage" id="stage"></div>
  <div id="kbd"></div>
</div>

<div class="sr" id="live" aria-live="polite"></div>

<script src="../shared/kit.js"></script>
<script src="puzzles.js"></script>
<script>
(function () {
  'use strict';

  var MAX_PROBES = 6;
  var DAY = Kit.dayNumber();
  var P = Kit.pick(PUZZLES);
  var PIDX = (DAY - 1) % PUZZLES.length;

  var stage = document.getElementById('stage');
  var kbdMount = document.getElementById('kbd');
  var live = document.getElementById('live');

  /* ---------------- state / persistence ---------------- */
  var db = Kit.store('rule');
  var seenDb = Kit.store('rule:seen');
  var statsDb = Kit.store('rule:stats');

  function loadAll() { return db.get() || {}; }
  function loadDay() {
    var all = loadAll();
    return all['d' + DAY] || { probes: [], picks: [], phase: 'probe', won: null };
  }
  function saveDay() {
    var all = loadAll();
    all['d' + DAY] = S;
    // keep the store small — last 12 days only
    var keys = Object.keys(all).sort(function (a, b) { return (+b.slice(1)) - (+a.slice(1)); });
    keys.slice(12).forEach(function (k) { delete all[k]; });
    db.set(all);
  }
  var S = loadDay();

  function stats() {
    return statsDb.get() || { played: 0, cracked: 0, best: null, probeSum: 0, streak: 0, lastDay: null };
  }
  function recordResult(won, used) {
    var st = stats();
    if (st.lastDay === DAY) return;          // never double-count a day
    st.played++;
    if (won) {
      st.cracked++;
      st.probeSum += used;
      if (st.best === null || used < st.best) st.best = used;
      st.streak = (st.lastDay === DAY - 1) ? st.streak + 1 : 1;
    } else {
      st.streak = 0;
    }
    st.lastDay = DAY;
    statsDb.set(st);
  }

  /* ---------------- deterministic candidate order ---------------- */
  function shuffled(list, seed) {
    var r = Kit.rng(seed), a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var CANDS = shuffled(P.call, (DAY * 7919) + PIDX * 131 + 17);

  /* ---------------- small helpers ---------------- */
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }
  function say(msg) { live.textContent = msg; }

  /* ---------------- input ---------------- */
  var cur = '';
  var busy = false;

  var kb = Kit.keyboard(kbdMount, onKey, { enterLabel: 'PROBE' });

  function onKey(k) {
    if (S.phase !== 'probe' || busy) return;
    if (k === 'ENTER') { submitProbe(); return; }
    if (k === 'BACK') { cur = cur.slice(0, -1); paintSlot(); return; }
    if (/^[A-Z]$/.test(k)) {
      if (cur.length >= 14) return;
      cur += k;
      paintSlot();
    }
  }

  function submitProbe() {
    var w = cur;
    if (w.length < 3) { Kit.toast('Three letters or more'); Kit.flash(slotEl, 'shake'); return; }
    if (S.probes.length >= MAX_PROBES) { Kit.toast('No probes left — call it'); return; }
    var dupe = S.probes.some(function (p) { return p.w === w; }) ||
               P.pass.indexOf(w) >= 0 || P.fail.indexOf(w) >= 0;
    if (dupe) { Kit.toast('Already on the board'); Kit.flash(slotEl, 'shake'); return; }

    busy = true;
    var rec = { w: w, ok: null };
    S.probes.push(rec);
    cur = '';
    paintSlot();
    renderNote();
    renderTray();          // the pip burns down the instant you commit
    Kit.haptic(6);
    say('Testing ' + w);

    setTimeout(function () {
      rec.ok = !!P.pred(w);
      busy = false;
      saveDay();
      renderNote();
      renderTray();
      Kit.haptic(rec.ok ? 14 : 26);
      say(w + (rec.ok ? ' passes' : ' fails'));
    }, 720);
  }

  /* ---------------- screens ---------------- */
  function render() {
    stage.innerHTML = '';
    kbdMount.style.display = (S.phase === 'probe') ? '' : 'none';
    if (S.phase === 'probe') renderProbe();
    else if (S.phase === 'call') renderCall();
    else renderResult();
  }

  /* ---- probe screen ---- */
  var slotEl, noteEl, pipsEl, callBtn, nbHead, nbLeft, nbHint;

  function renderProbe() {
    document.getElementById('caseNo').textContent = 'Case #' + DAY + ' · ' + Kit.dateLabel();

    var board = el('div', 'board');
    function col(cls, glyph, head, words) {
      var c = el('div', 'col ' + cls);
      var h = el('h3');
      h.appendChild(el('span', 'gl', glyph));
      h.appendChild(document.createTextNode(head));
      c.appendChild(h);
      words.forEach(function (w) { c.appendChild(el('div', 'w', w)); });
      return c;
    }
    board.appendChild(col('', '✅', 'Follows the rule', P.pass));
    board.appendChild(col('no', '❌', 'Breaks it', P.fail));
    stage.appendChild(board);

    nbHead = el('div', 'nb-head');
    nbHead.appendChild(el('span', null, 'Notebook'));
    nbHead.appendChild(el('span', 'rule-line'));
    nbLeft = el('span', 'left');
    nbHead.appendChild(nbLeft);
    stage.appendChild(nbHead);

    noteEl = el('div', 'note');
    stage.appendChild(noteEl);
    renderNote();

    nbHint = el('div', 'nb-empty');
    nbHint.innerHTML = 'Test any string you like — <b>CRATE</b>, <b>AAAA</b>, <b>ZZTOP</b>. ' +
                       'The lab answers anything.';
    stage.appendChild(nbHint);

    // tray
    var tray = el('div', 'tray');
    slotEl = el('div', 'slot');
    tray.appendChild(slotEl);

    var row = el('div', 'trayrow');
    var pw = el('div', 'trayrow');
    pw.style.gap = '7px';
    pw.appendChild(el('span', 'plab', 'Probes'));
    pipsEl = el('div', 'pips');
    pw.appendChild(pipsEl);
    row.appendChild(pw);

    callBtn = el('button', 'btn callit', 'Call it');
    callBtn.type = 'button';
    callBtn.addEventListener('click', confirmCall);
    row.appendChild(callBtn);
    tray.appendChild(row);
    tray.appendChild(el('div', 'deskhint', 'Type any letters, then press Enter to probe.'));
    stage.appendChild(tray);

    paintSlot();
    renderTray();
  }

  function paintSlot() {
    if (!slotEl) return;
    slotEl.innerHTML = '';
    if (!cur) {
      slotEl.classList.remove('filled');
      slotEl.appendChild(el('span', 'ph', 'TYPE ANYTHING — EVEN NONSENSE'));
    } else {
      slotEl.classList.add('filled');
      slotEl.appendChild(document.createTextNode(cur));
      slotEl.appendChild(el('span', 'car', '▌'));
    }
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* The bench log. Six numbered lines, ruled and waiting; each probe fills
     one in and the ✅/❌ chip lands after a beat. The unwritten lines stay
     visible so the cost of a probe is always on screen. */
  function renderNote() {
    if (!noteEl) return;
    noteEl.innerHTML = '';
    for (var i = 0; i < MAX_PROBES; i++) {
      var p = S.probes[i];
      if (!p) {
        var g = el('div', 'entry ghost');
        g.appendChild(el('span', 'n', pad2(i + 1)));
        g.appendChild(el('span', 'dots'));
        noteEl.appendChild(g);
        continue;
      }
      var row = el('div', 'entry ' + (p.ok === null ? 'pending' : (p.ok ? 'yes' : 'no')));
      row.appendChild(el('span', 'n', pad2(i + 1)));
      row.appendChild(el('span', 'w', p.w));
      var res = el('span', 'res');
      if (p.ok === null) { res.innerHTML = '<span></span><span></span><span></span>'; }
      else { res.textContent = p.ok ? '✅' : '❌'; }
      row.appendChild(res);
      noteEl.appendChild(row);
    }
    if (nbHint) nbHint.style.display = S.probes.length ? 'none' : '';
  }

  function renderTray() {
    if (!pipsEl) return;
    var used = S.probes.length, left = MAX_PROBES - used;
    pipsEl.innerHTML = '';
    // filled pips are what you have LEFT — the meter drains rightward
    for (var i = 0; i < MAX_PROBES; i++) {
      pipsEl.appendChild(el('div', 'pip' + (i >= left ? ' spent' : '')));
    }
    if (nbLeft) nbLeft.textContent = left + ' left';
    if (callBtn) callBtn.classList.toggle('urge', left === 0);
    if (left === 0 && slotEl) {
      slotEl.innerHTML = '';
      slotEl.classList.remove('filled');
      slotEl.appendChild(el('span', 'ph', 'Out of probes — time to call it'));
    }
  }

  /* ---- the call ---- */
  function confirmCall() {
    var used = S.probes.filter(function (p) { return p.ok !== null; }).length;
    Kit.sheet(
      '<h2>Call it?</h2>' +
      '<p class="sub">You think you know the rule.</p>' +
      '<div class="rules">You will be shown <b>8 fresh words</b>. Tap the <b>three</b> that follow the rule — exactly three, no more, no fewer.</div>' +
      '<div class="warn-box"><b>You get one call.</b> No second try, no hints. Miss a single word and you are busted for the day.</div>' +
      '<div class="rules" style="margin-top:12px;text-align:center">Your score locks in at <b>' + used +
      ' probe' + (used === 1 ? '' : 's') + '</b>.</div>' +
      '<div class="btnrow">' +
      '<button class="btn ghost" data-close type="button">Not yet</button>' +
      '<button class="btn danger" id="goCall" type="button">Call it</button>' +
      '</div>',
      { onOpen: function (sheetEl, close) {
          sheetEl.querySelector('#goCall').addEventListener('click', function () {
            close();
            S.phase = 'call';
            S.calledAt = used;
            saveDay();
            render();
            window.scrollTo(0, 0);
          });
        } }
    );
  }

  function caseFileHTML() {
    var yes = [], no = [];
    P.pass.forEach(function (w) { yes.push(w); });
    P.fail.forEach(function (w) { no.push(w); });
    S.probes.forEach(function (p) {
      if (p.ok === null) return;
      (p.ok ? yes : no).push(p.w + ' *');
    });
    function colHTML(list, cls, glyph, head) {
      return '<div class="col ' + cls + '"><h3><span class="gl">' + glyph + '</span>' + head + '</h3>' +
        list.map(function (w) { return '<div class="w">' + Kit.esc(w) + '</div>'; }).join('') + '</div>';
    }
    return '<h2>Case file</h2><p class="sub">Everything you know. * = your probe.</p>' +
      '<div class="board">' + colHTML(yes, '', '✅', 'Follows the rule') + colHTML(no, 'no', '❌', 'Breaks it') + '</div>' +
      '<button class="btn primary wide" data-close type="button" style="margin-top:16px">Back to the call</button>';
  }

  function renderCall() {
    document.getElementById('caseNo').textContent = 'Case #' + DAY + ' · the call';
    document.getElementById('objective').textContent =
      'Tap the three that follow the rule. One shot, no second try.';

    var head = el('div', 'callhead');
    head.appendChild(el('p', 't', 'Name the three.'));
    var sub = el('p', 's');
    sub.innerHTML = 'Eight new words. Exactly <b>three</b> follow the hidden rule.';
    head.appendChild(sub);
    var cf = el('button', 'btn ghost sm', 'Check the case file');
    cf.type = 'button';
    cf.style.marginTop = '8px';
    cf.addEventListener('click', function () { Kit.sheet(caseFileHTML()); });
    head.appendChild(cf);
    stage.appendChild(head);

    var list = el('div', 'cands');
    CANDS.forEach(function (w) {
      var b = el('button', 'cand');
      b.type = 'button';
      b.dataset.w = w;
      var box = el('span', 'box', '✓');
      b.appendChild(box);
      b.appendChild(document.createTextNode(w));
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { togglePick(w); });
      list.appendChild(b);
    });
    stage.appendChild(list);

    // the commit bar stays under your thumb no matter how far you scroll
    var bar = el('div', 'callbar');
    var counter = el('div', 'counter');
    bar.appendChild(counter);
    var lock = el('button', 'btn primary wide', 'Lock it in');
    lock.type = 'button';
    lock.addEventListener('click', lockIn);
    bar.appendChild(lock);
    stage.appendChild(bar);

    function paint() {
      list.querySelectorAll('.cand').forEach(function (b) {
        var on = S.picks.indexOf(b.dataset.w) >= 0;
        b.classList.toggle('sel', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      counter.innerHTML = '<b>' + S.picks.length + '</b> of 3 chosen';
      lock.disabled = S.picks.length !== 3;
      lock.textContent = S.picks.length === 3 ? 'Lock it in — no takebacks' : 'Pick ' + (3 - S.picks.length) + ' more';
    }
    window.__paintCall = paint;
    paint();
  }

  function togglePick(w) {
    var i = S.picks.indexOf(w);
    if (i >= 0) S.picks.splice(i, 1);
    else {
      if (S.picks.length >= 3) { Kit.toast('Three only — deselect one first'); return; }
      S.picks.push(w);
    }
    Kit.haptic(6);
    saveDay();
    window.__paintCall();
  }

  function lockIn() {
    if (S.picks.length !== 3) return;
    var right = S.picks.filter(function (w) { return P.pred(w); });
    S.won = right.length === 3;
    S.hits = right.length;
    S.phase = 'done';
    saveDay();
    recordResult(S.won, S.calledAt);

    // resolve the tiles in place before the verdict lands
    var tiles = Array.prototype.slice.call(stage.querySelectorAll('.cand'));
    stage.querySelectorAll('.btn').forEach(function (b) { b.disabled = true; });
    tiles.forEach(function (b, i) {
      setTimeout(function () {
        markTile(b);
        Kit.haptic(8);
      }, 90 * i);
    });
    setTimeout(function () { render(); window.scrollTo(0, 0); }, 90 * tiles.length + 620);
    say(S.won ? 'Cracked it' : 'Busted — ' + right.length + ' of 3');
  }

  function markTile(b) {
    var w = b.dataset.w, picked = S.picks.indexOf(w) >= 0, pass = P.pred(w);
    b.classList.remove('sel');
    if (picked && pass) { b.classList.add('right'); b.appendChild(el('span', 'mk', 'correct')); }
    else if (picked && !pass) { b.classList.add('wrong'); b.appendChild(el('span', 'mk', 'wrong')); }
    else if (!picked && pass) { b.classList.add('missed'); b.appendChild(el('span', 'mk', 'missed')); }
    else { b.classList.add('dud'); }
  }

  /* ---- result + reveal ---- */
  function tierFor(used, won) {
    if (!won) {
      if (used === 0) return 'Pure hubris';
      if (used <= 2) return 'Called it far too soon';
      if (used <= 5) return 'Not enough evidence';
      return 'All six probes. Still wrong.';
    }
    if (used === 0) return 'Legendary';
    if (used === 1) return 'Surgical';
    if (used <= 3) return 'Clean';
    if (used === 4) return 'Solid';
    if (used === 5) return 'Close one';
    return 'Squeaker';
  }

  function wordHTML(w, ev) {
    var hit = {}; (ev.hits || []).forEach(function (i) { hit[i] = 1; });
    var out = '', open = false;
    for (var i = 0; i < w.length; i++) {
      var h = !!hit[i];
      if (h && !open) { out += '<em>'; open = true; }
      if (!h && open) { out += '</em>'; open = false; }
      out += Kit.esc(w[i]);
    }
    if (open) out += '</em>';
    return out;
  }

  function evRow(w, src, showTag) {
    var ev = P.ev(w);
    var row = el('div', 'evrow');
    var word = el('span', 'word');
    word.innerHTML = wordHTML(w, ev);
    row.appendChild(word);
    if (src) row.appendChild(el('span', 'src', src));
    if (showTag !== false) row.appendChild(el('span', 'tag', ev.tag));
    return row;
  }

  /* The evidence, re-sorted so it becomes obvious in hindsight: words that
     failed (or passed) for the same reason sit next to each other. */
  function evGroup(cls, glyph, head, rows) {
    var g = el('div', 'evgroup ' + cls);
    var h = el('h4');
    h.appendChild(el('span', 'gl', glyph));
    h.appendChild(document.createTextNode(head));
    h.appendChild(el('span', 'ct', rows.length + (rows.length === 1 ? ' word' : ' words')));
    g.appendChild(h);

    var tags = rows.map(function (r) { return P.ev(r[0]).tag; });
    var sameTag = tags.every(function (t) { return t === tags[0]; });
    var noHits = rows.every(function (r) { return !P.ev(r[0]).hits.length; });

    if (sameTag && noHits && rows.length > 3) {
      // every one fails for the same reason and there is nothing to point at —
      // say it once in the header and let the words go dense.
      h.appendChild(el('span', 'why', tags[0]));
      var chips = el('div', 'evchips');
      rows.forEach(function (r) { chips.appendChild(el('span', null, r[0])); });
      g.appendChild(chips);
    } else {
      rows.sort(function (a, b) {
        var ta = P.ev(a[0]).tag, tb = P.ev(b[0]).tag;
        return ta === tb ? (a[0] < b[0] ? -1 : 1) : (ta < tb ? -1 : 1);
      });
      rows.forEach(function (r) { g.appendChild(evRow(r[0], r[1], true)); });
    }
    return g;
  }

  /* One sentence, in plain English, naming the exact word that decided it.
     On a bust this is the sting; on a win it is the victory lap. */
  function stingLine() {
    var d = el('div', 'sting');
    var tagOf = function (w) { return Kit.esc(P.ev(w).tag); };
    var mono = function (w) { return '<b>' + Kit.esc(w) + '</b>'; };
    var wrongs = S.picks.filter(function (w) { return !P.pred(w); });
    var missed = CANDS.filter(function (w) { return P.pred(w) && S.picks.indexOf(w) < 0; });

    if (!S.won) {
      var parts = [];
      parts.push(mono(wrongs[0]) + ' was never in it: ' + tagOf(wrongs[0]) + '.');
      if (wrongs.length > 1) parts.push('Nor was ' + mono(wrongs[1]) + '.');
      if (missed.length) {
        parts.push('You walked straight past ' + mono(missed[0]) +
                   ' — <span class="hi">' + tagOf(missed[0]) + '</span>.');
      }
      d.innerHTML = parts.join(' ');
      return d;
    }
    // a win: point at the sharpest thing they spotted
    var shown = S.picks.filter(function (w) { return P.ev(w).hits.length; })
                       .sort(function (a, b) { return P.ev(a).hits.length - P.ev(b).hits.length; });
    if (S.calledAt === 0) {
      d.innerHTML = 'Zero probes. You looked at six words and simply <span class="hi">knew</span>.';
    } else if (shown.length) {
      d.innerHTML = 'You saw <span class="hi">' + tagOf(shown[0]) + '</span> inside ' +
                    mono(shown[0]) + '. That is the whole game.';
    } else {
      d.innerHTML = 'Three for three off <b>' + S.calledAt + '</b> probe' +
                    (S.calledAt === 1 ? '' : 's') + '. No luck involved.';
    }
    return d;
  }

  function renderResult() {
    document.getElementById('caseNo').textContent = 'Case #' + DAY + ' · closed';
    document.getElementById('objective').textContent = S.won
      ? 'You called it and you were right. Here is what you were looking at all along.'
      : 'One call, and it got away. Here is what you were looking at all along.';

    var used = S.calledAt || 0;
    var wrap = el('div', 'res-wrap');

    var v = el('h2', 'verdict ' + (S.won ? 'win' : 'lose'), S.won ? 'CRACKED IT' : 'BUSTED');
    wrap.appendChild(v);

    var sl = el('p', 'scoreline');
    sl.innerHTML = S.won
      ? 'Called it on <b>' + used + ' probe' + (used === 1 ? '' : 's') + '</b>.' +
        (used === 0 ? ' Cold. No probes at all.' : '')
      : 'You got <b>' + S.hits + ' of 3</b>. Called on ' + used + ' probe' + (used === 1 ? '' : 's') + '.';
    wrap.appendChild(sl);

    var tw = el('div'); tw.style.textAlign = 'center';
    tw.appendChild(el('span', 'tier' + (S.won ? '' : ' lose'), tierFor(used, S.won)));
    wrap.appendChild(tw);

    // the call, resolved — the sting or the victory lap.
    // Only what you touched and what you should have: the other five
    // near-misses are laid out in full inside the reveal below.
    var head = el('div', 'nb-head');
    head.appendChild(el('span', null, S.won ? 'Your call — all three' : 'Your call'));
    head.appendChild(el('span', 'rule-line'));
    wrap.appendChild(head);

    var list = el('div', 'cands');
    CANDS.filter(function (w) { return S.picks.indexOf(w) >= 0 || P.pred(w); }).forEach(function (w) {
      var b = el('div', 'cand');
      b.dataset.w = w;
      b.appendChild(el('span', 'box', '✓'));
      b.appendChild(document.createTextNode(w));
      markTile(b);
      list.appendChild(b);
    });
    wrap.appendChild(list);

    // the sentence you say out loud — names the word that killed you
    wrap.appendChild(stingLine());

    // ---- THE REVEAL ----
    var rev = el('div', 'reveal');
    rev.appendChild(el('div', 'kick', 'Today’s rule was'));
    rev.appendChild(el('div', 'rule', P.rule));
    rev.appendChild(el('p', 'detail', P.detail));

    var seen = {};
    var yes = [], no = [];
    function add(w, src) {
      if (seen[w]) return;
      seen[w] = 1;
      (P.pred(w) ? yes : no).push([w, src]);
    }
    P.pass.forEach(function (w) { add(w, 'opener'); });
    P.fail.forEach(function (w) { add(w, 'opener'); });
    S.probes.forEach(function (p) { if (p.ok !== null) add(p.w, 'probe'); });
    CANDS.forEach(function (w) { add(w, 'call'); });

    rev.appendChild(evGroup('', '✅', 'Obeys it', yes));
    rev.appendChild(evGroup('bad', '❌', 'Breaks it', no));
    wrap.appendChild(rev);

    // what you will actually paste
    var sg = el('div', 'sharegrid');
    sg.textContent = shareText();
    wrap.appendChild(sg);

    var sh = el('button', 'btn primary wide', S.won ? 'Share the flex' : 'Share the damage');
    sh.type = 'button';
    sh.addEventListener('click', function () { Kit.share(shareText(), sh); });
    wrap.appendChild(sh);

    var nx = el('div', 'next');
    nx.innerHTML = 'Next rule in <b id="cd">--:--:--</b>';
    wrap.appendChild(nx);

    stage.appendChild(wrap);
    var cd = document.getElementById('cd');
    if (cdTimer) clearInterval(cdTimer);
    cdTimer = Kit.countdown(cd);
  }
  var cdTimer = null;

  /* ---------------- share ---------------- */
  function shareText() {
    var used = S.calledAt || 0;
    var lines = ['THE RULE #' + DAY];
    if (used > 0) {
      var story = S.probes.map(function (p) { return p.ok ? '✅' : '❌'; }).join('');
      lines.push('🔬 ' + story);
    }
    if (S.won) {
      lines.push(used === 0 ? '👑 CRACKED IT COLD · 0 probes'
                            : '🧠 CRACKED IT · ' + used + ' probe' + (used === 1 ? '' : 's'));
    } else {
      lines.push('💀 BUSTED · ' + S.hits + '/3 on ' + used + ' probe' + (used === 1 ? '' : 's'));
    }
    lines.push('sfun.games/rule');
    return lines.join('\n');
  }

  /* ---------------- sheets ---------------- */
  var HELP =
    '<ul style="padding-left:18px;margin:0">' +
    '<li>One <b>hidden rule</b> decides everything. Three words obey it, three break it. That is your whole opening evidence.</li>' +
    '<li><b>Probe it.</b> Type any string of letters — a real word, or deliberate nonsense — and get an instant ✅ or ❌. ' +
    'Testing <code>AAAA</code> to check for double letters is not cheating, it is good science.</li>' +
    '<li>You get <b>6 probes</b>.</li>' +
    '<li><b>Call it</b> whenever you like. You will see 8 fresh words and must tap the exactly 3 that follow the rule.</li>' +
    '<li>You get <b>one call</b>. Three right and you cracked it. Anything else and you are busted.</li>' +
    '<li>Your score is <b>how many probes you spent</b>. Calling on 0 is legendary. Calling on 6 is a squeaker.</li>' +
    '</ul>';

  document.getElementById('helpBtn').addEventListener('click', Kit.helpButton(HELP, 'How to play'));

  document.getElementById('statsBtn').addEventListener('click', function () {
    var st = stats();
    var avg = st.cracked ? (st.probeSum / st.cracked).toFixed(1) : '–';
    Kit.sheet(
      '<h2>Lab record</h2><p class="sub">Local to this device.</p>' +
      '<div class="statrow">' +
      '<div class="stat"><span class="n">' + st.played + '</span><span class="l">Cases</span></div>' +
      '<div class="stat"><span class="n">' + st.cracked + '</span><span class="l">Cracked</span></div>' +
      '<div class="stat"><span class="n">' + (st.best === null ? '–' : st.best) + '</span><span class="l">Fewest probes</span></div>' +
      '<div class="stat"><span class="n">' + avg + '</span><span class="l">Avg probes</span></div>' +
      '</div>' +
      '<button class="btn primary wide" data-close type="button" style="margin-top:14px">Close</button>'
    );
  });

  /* ---------------- boot ---------------- */
  render();
  if (!seenDb.get()) {
    seenDb.set(1);
    Kit.helpButton(HELP, 'How to play')();
  }
})();
</script>
</body>
</html>
