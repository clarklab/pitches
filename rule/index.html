         happened. The bench never reports a reading it did not take — least of
         all about itself. */
      Kit.share(shareText(), sh);
    });
    wrap.appendChild(sh);

    /* No lockout and no countdown: a closed case hands you the next one on
       the spot. Kit.nextButton is delegated at the document, so rendering it
       is all this screen has to do. */
    var nxHost = el('div');
    nxHost.innerHTML = Kit.nextButton('rule', 'Next case');
    wrap.appendChild(nxHost.firstChild);

    stage.appendChild(wrap);

    /* ---- the landing ----
       The number that matters counts up to itself; the stamp comes down on
       top of it. Confetti is only ever for a cracked case, and the haptic
       for a one-off near miss is deliberately not the haptic for a bust. */
    var big = document.getElementById('bignum');
    tally(big, S.won ? used : S.hits, 520);

    if (justFinished) {
      justFinished = false;
      setTimeout(function () { hap(S.won ? 'win' : (near ? 'near' : 'lose')); }, 330);
      if (S.won) {
        setTimeout(function () {
          var r = stamp.getBoundingClientRect();
          Kit.burst({
            x: r.left + r.width / 2,
            y: r.top + r.height / 2,
            n: used <= 3 ? 58 : 34,
            colors: ['#5b46c9', '#a596f2', '#c9bdf7', '#2e7d4f', '#efe9ff']
          });
        }, 340);
      }
    }
  }

  /* ---------------- share ----------------
     Four lines at most (three on a nought-probe call), and every one of them
     inside 30 monospace columns so it lands in a bubble without folding.
     The savings came from saying each thing once: line 2 already draws the
     probe count as ✅/❌, so the verdict line stops spelling "on 6 probes"
     out beside it, and "ONE OFF" already means 2/3 so it stops printing the
     fraction. Measured longest output: 29 characters. */
  function shareText() {
    var used = S.calledAt || 0;
    var lines = ['THE RULE #' + DAY];                        // 13–15
    if (used > 0) {
      var story = S.probes.map(function (p) { return p.ok ? '✅' : '❌'; }).join('');
      lines.push('🔬 ' + story);                             // ≤ 15 cols
    }
    var tier = shareTier(used, S.won);
    if (S.won) {
      // the 👑 line already says everything; anywhere else the tier word is
      // what tells a non-player whether the number was good
      lines.push(used === 0
        ? '👑 CRACKED IT COLD · 0 probes'                    // 29
        : '🧠 CRACKED IT IN ' + used + ' · ' + tier);        // ≤ 29
    } else if (S.hits === 2) {
      // the near miss is half the reason anyone posts this game; the artifact
      // has to carry it or the story dies on the way to the group chat.
      // "ONE OFF" is the 2/3, so the fraction does not get printed twice.
      lines.push('😩 ONE OFF · ' + tier);                    // ≤ 24
    } else {
      lines.push('💀 BUSTED · ' + S.hits + '/3 · ' + tier);  // ≤ 29
    }
    lines.push('sfun.games/rule');                            // 15
    return lines.join('\n');
  }

  /* ---------------- help ----------------
     Leads with the one sentence that makes it click, then shows the game
     happening rather than describing it. The example rule is deliberately
     one that never appears in the puzzle set. */
  function helpHTML() {
    return '<h2>How to play</h2>' +
      '<p class="lede">One hidden rule decides everything.<br>Work out what it is.</p>' +
      '<div class="demo">' +
        '<div class="dcol"><span class="dh good">' + ic('check_circle', { size: 13, fill: 1 }) +
          'Follows</span><b>PI<em>Z</em>ZA</b><b>DA<em>Z</em>ZLE</b></div>' +
        '<div class="dcol"><span class="dh bad">' + ic('cancel', { size: 13, fill: 1 }) +
          'Breaks it</span><b>PASTA</b><b>DINNER</b></div>' +
      '</div>' +
      '<p class="dwhy">' + ic('lightbulb', { size: 17, fill: 1 }) +
        '<span>The rule here: <em>there is a Z in it.</em></span></p>' +
      '<p class="dnote">The real ones are harder than that.</p>' +
      '<ol class="steps">' +
        '<li>' + ic('experiment', { size: 20, fill: 1 }) +
          '<div><b>Probe.</b> Type anything — <code>AAAA</code> counts — and the bench says pass or fail. Six of them.</div></li>' +
        '<li>' + ic('gavel', { size: 20, fill: 1 }) +
          '<div><b>Call it.</b> Eight fresh words. Tap the <b>three</b> that obey the rule.</div></li>' +
        '<li>' + ic('military_tech', { size: 20, fill: 1 }) +
          '<div><b>Score.</b> Probes spent. Six is a squeaker; zero is legendary.</div></li>' +
      '</ol>' +
      '<div class="warn-box">' + ic('warning', { size: 19, fill: 1 }) +
        '<span><b>One call only.</b> Three right and you cracked it. Anything else and you are busted for the day.</span></div>' +
      /* The lab record lives behind here rather than in the bar: four buttons
         will not leave a centred two-part wordmark clear air at 320px, and a
         cramped masthead is a worse trade than one extra tap for a number you
         look at between cases. */
      /* No symbol on the record button: icon + "Lab record" measures 144px and
         half of a 320px sheet is 135px, which put the label on a second line
         and gave the row a 69px chin. The word carries it. */
      '<div class="btnrow">' +
        '<button class="btn ghost" type="button" data-record>Lab record</button>' +
        '<button class="btn primary" data-close type="button">Got it</button>' +
      '</div>';
  }

  document.getElementById('helpBtn').addEventListener('click', function () {
    hap('key');
    Kit.sheet(helpHTML(), {
      onOpen: function (sheetEl, close) {
        sheetEl.setAttribute('aria-label', 'How to play');
        sheetEl.querySelector('[data-record]').addEventListener('click', function () {
          hap('key');
          close();
          // let the help sheet finish leaving before the record arrives, or
          // the two animate over each other
          setTimeout(openRecord, 220);
        });
      }
    });
  });

  function openRecord() {
    var st = stats();
    var avg = st.cracked ? (st.probeSum / st.cracked).toFixed(1) : '–';
    Kit.sheet(
      '<h2>Lab record</h2><p class="lede">Local to this device.</p>' +
      '<div class="statrow">' +
      '<div class="stat"><span class="n tick" data-to="' + st.played + '">0</span><span class="l">Cases</span></div>' +
      '<div class="stat"><span class="n tick" data-to="' + st.cracked + '">0</span><span class="l">Cracked</span></div>' +
      '<div class="stat"><span class="n">' + (st.best === null ? '–' : st.best) + '</span><span class="l">Fewest</span></div>' +
      '<div class="stat"><span class="n">' + avg + '</span><span class="l">Avg probes</span></div>' +
      '</div>' +
      (st.streak > 1
        ? '<div class="streakrow"><span class="kchip acc">' + ic('local_fire_department', { size: 14 }) +
          st.streak + '-day streak</span></div>'
        : '') +
      '<button class="btn primary wide" data-close type="button" style="margin-top:16px">Close</button>',
      { onOpen: function (sheetEl) {
          sheetEl.setAttribute('aria-label', 'Lab record');
          // the two counts that grow land rather than appear
          sheetEl.querySelectorAll('.n[data-to]').forEach(function (n) {
            tally(n, +n.dataset.to, 480);
          });
        } }
    );
  }

  Kit.themeToggle(document.getElementById('themeBtn'));

  /* ---------------- boot ---------------- */
  render();

  /* A first-timer plays without reading rules: three coach marks, one
     sentence each, each pointing at the next thing to touch. The full help
     sheet stays behind the ? for anyone who wants it. */
  if (S.phase === 'probe' && !S.probes.length && Kit.once('rule:tour')) {
    setTimeout(function () {
      Kit.tour([
        { sel: '.board', text: 'Three of these words obey one <b>hidden rule</b>. Three break it.', place: 'below' },
        { sel: '.slot', text: 'Test a theory: type <b>any</b> letters — even nonsense — and the bench answers pass or fail.', place: 'above' },
        { sel: '.callit', text: 'Six probes, then <b>one call</b>. Cash in the moment you think you have it.', place: 'above' }
      ], {
        doneLabel: 'Start',
        // the coach marks outlast the slot's own three-breath nudge, so hand
        // the board back with the affordance still asking
        onDone: function () { paintSlot(); }
      });
    }, 240);
  }
})();
</script>
</body>
</html>
