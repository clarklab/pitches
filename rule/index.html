<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rule — Superfun Daily</title>
<meta name="description" content="One hidden rule. Six words as evidence. Six probes. One call.">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/icons.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="font.css">
<style>
/* ============================================================
   THE RULE — the bench.
   Surface language: ruled lab stock, a violet margin rule, hairlines
   tinted with the accent so every card in the game looks like it came
   off the same pad. Display face is Space Grotesk, driven from the
   'wght' axis, and it appears only on the wordmark, the verdict, the
   printed rule and the one number that matters.
   ============================================================ */
:root{
  --accent:#5b46c9;
  --accent-soft:#e2ddf7;
  --accent-ink:#fff;
  /* the near miss gets its own semantic: not the rust of a bust, not the
     green of a crack — the amber of a reading that came in one off.
     Dark enough to clear 4.5:1 on --warn-soft: the 10px MISSED tag and the
     sting line are the two places a losing player reads most carefully. */
  --warn:#8f6100;

  --font-brand:'Space Grotesk', var(--font-display);

  /* ruled stock: a sheet a shade warmer than plain white, hairlines and a
     margin rule tinted with the accent rather than drawn in grey */
  --stock:#fffdf9;
  --hair:rgba(91,70,201,.13);
  --margin-rule:rgba(91,70,201,.30);

  /* MOTION SIGNATURE — INSTRUMENTATION.
     Nothing in this game overshoots. Every curve is decelerate-only, so a
     result lands and stays landed: a needle coming to rest, not a spring.
     --beat is the single measured pause the bench takes before it answers,
     and it is the same length everywhere it appears. */
  --ease-settle:cubic-bezier(.2,.86,.26,1);
  --beat:720ms;
}
/* Dark needs a lighter accent AND a dark ink on top of it, or every filled
   pill turns into white-on-lavender mush. Same for the good/bad semantics —
   the kit's light-mode green and rust go muddy on a near-black paper.
   Every dark branch restates --accent-soft: setting it on :root above
   out-cascades the kit's own dark value. */
@media (prefers-color-scheme: dark){
  :root{ --accent:#a596f2; --accent-soft:#2b2350; --accent-ink:#16112c;
         --good:#4cb782; --bad:#e97057; --warn:#e2ac3a; --warn-soft:#3a2f12;
         --stock:#211f2a; --hair:rgba(165,150,242,.16); --margin-rule:rgba(165,150,242,.34); }
}
:root[data-theme="dark"]{ --accent:#a596f2; --accent-soft:#2b2350; --accent-ink:#16112c;
                          --good:#4cb782; --bad:#e97057; --warn:#e2ac3a; --warn-soft:#3a2f12;
                          --stock:#211f2a; --hair:rgba(165,150,242,.16); --margin-rule:rgba(165,150,242,.34); }
:root[data-theme="light"]{ --accent:#5b46c9; --accent-soft:#e2ddf7; --accent-ink:#fff;
                           --good:#2e7d4f; --bad:#b3402f; --warn:#8f6100; --warn-soft:#f7ecd0;
                           --stock:#fffdf9; --hair:rgba(91,70,201,.13); --margin-rule:rgba(91,70,201,.30); }

/* ---------- shell ---------- */
.app{ padding-bottom: calc(8px + var(--safe-b)); }
/* On a phone the shell is exactly one screen and the board scrolls inside it,
   so the keyboard and CALL IT are never pushed below the fold. */
@media (max-width:619px){ .app{ height:100dvh; } }
/* min-height:0 is load-bearing: without it the flex item refuses to shrink
   below its content and the on-screen keyboard gets shoved off the phone. */
/* scrollbar-gutter reserves nothing where scrollbars overlay (every phone)
   and reserves the gutter where they do not, so a classic scrollbar never
   lands on top of the section rule's right-hand reading */
.stage{ justify-content:flex-start; gap:12px; min-height:0; overflow-y:auto;
        -webkit-overflow-scrolling:touch; scrollbar-gutter:stable; }
/* NOTHING IN THE STAGE ABSORBS THE SQUEEZE.
   Flex items default to `0 1 auto`, so on a 360x740 phone with all six probes
   spent the notebook was the thing that gave: clientHeight 150 against a
   scrollHeight of 216, overflow:hidden, and .stage reporting scrollHeight ===
   clientHeight — no overflow, no scrollbar, nothing to find. Rows 05 and 06
   laid out below the container's bottom edge and were simply never painted.
   The player spent all six probes, could read four, and was then asked to
   name three words from evidence that was not on the screen.
   The stage is the scroller and it always was; every child now keeps its
   intrinsic height so there is something for it to scroll. */
.stage > *{ flex:0 0 auto; }

/* ---------- app bar + wordmark lockup ----------
   BALANCED FLANKS. Both sides are pinned to the same width, so the wordmark
   sits on the bar's TRUE centre line rather than in the middle of whatever
   space the buttons happened to leave. 90px is two 44px thumb targets plus
   the 2px between them; the left flank pads out to match with empty space
   rather than a third button. Clear air either side of the lockup is then
   (barWidth - 180 - lockupWidth) / 2, which is a number you can check. */
.bar{ gap:14px; margin-bottom:10px; }
.bar .side{ flex:0 0 90px; display:flex; align-items:center; gap:2px; }
.bar .side.end{ justify-content:flex-end; }
.mark{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; }
.mark h1{
  flex:none; margin:0; display:flex; align-items:baseline; gap:.32em;
  font-family:var(--font-brand);
  /* the lockup gives a little back on a 320px phone so that clear air is
     real rather than nominal; 5.3vw reaches the full 19px by 359px and the
     clamp holds it there for every wider screen */
  font-size:clamp(16.5px, 5.3vw, 19px); line-height:1;
  text-transform:uppercase; white-space:nowrap;
  font-variation-settings:'wght' 700; font-weight:normal; letter-spacing:0;
}
/* em, not px, so THE keeps its proportion to RULE as the lockup scales.
   .553em is 10.5px at the full 19px — the size it has always been. The em
   alone went UNDER the suite's 10px type floor on the narrow phones, though:
   the lockup clamps down to 16.96px at 320px and .553 of that is 9.38px. The
   max() is the floor and nothing else — at 359px and up .553em is already
   over 10px, so every wider screen renders exactly what it always did. The
   320px lockup pays 1.63px for it (74.09 -> 75.72), which takes clear air
   either side from 16.95px to 16.14px: still comfortably over the 12px floor
   this bar is built to hold. */
.mark h1 .a{
  font-size:max(10px, .553em); letter-spacing:.26em; color:var(--ink-3);
  font-variation-settings:'wght' 400;
}
.mark h1 .b{ letter-spacing:.055em; }
/* 10px is the suite floor; the .13em tracking it used to carry at 9px is what
   pays for it, so the sub-line is 42.0px against the 80px lockup box at 320px
   rather than the 39.42px it was — the same margin, one size up. */
.mark .puzz-no{
  font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.10em;
  text-transform:uppercase; color:var(--ink-3); line-height:1;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ---------- section rule: the one header pattern ---------- */
.sect{ display:flex; align-items:center; gap:8px; }
/* line-height is pinned at 1.4 on both halves of this header: 10px x 1.4 is
   14px, which is exactly the height of the 14px symbol beside the label, so
   raising the type to the suite's floor buys back none of the row. The rule
   stays a 14px band and the hairline stays on the same centre line it was. */
.sect .lab{
  display:flex; align-items:center; gap:5px;
  font-size:10px; font-weight:800; letter-spacing:.13em; line-height:1.4;
  text-transform:uppercase; color:var(--ink-2);
}
.sect .lab .ms{ --ms-size:14px; --ms-wght:500; color:var(--ink-3); }
.sect .ln{ flex:1; height:1px; background:var(--line); }
/* the right-hand reading is where "3 PROBES LEFT" lives — the one number the
   whole game is played against, so it takes --ink-2 rather than the quieter
   --ink-3 the label beside it uses: a status reading has to be readable, not
   atmospheric. (--ink-3 has since been darkened in the kit to clear 4.5:1,
   which only widens the margin; the split still reads as a hierarchy.) */
.sect .meta{
  font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.10em;
  line-height:1.4;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap;
}

/* ---------- evidence: two specimen cards ---------- */
.board{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.col{
  background:var(--white); border:1px solid var(--line); border-radius:var(--r);
  padding:9px 11px 9px; box-shadow:var(--shadow-1);
  border-top:2px solid var(--good);
}
.col.no{ border-top-color:var(--bad); }
/* THE TIGHTEST LABEL IN THE FILE. "Follows the rule" is nowrap inside a
   grid track whose auto minimum IS this heading, so at 320px the heading is
   what decides how wide the left specimen card gets: at 9px/.12em it measured
   123.23px and the card came out 145.23 against the right card's 133.77.
   Going to the 10px floor without paying for it would have widened the
   heading to 135px and dragged another 12px out of the right-hand card.
   Tracking pays for it instead — .12em down to .07em, plus 1px off the
   symbol gap — which lands the heading at 126.05px: the card grows 2.8px,
   nothing wraps, nothing clips, and the board still totals 288px at 320.
   line-height:1.3 is 13px, the height of the symbol beside it, so the
   heading band does not grow either. */
.col h3{
  margin:0 0 5px; font-size:10px; font-weight:800; letter-spacing:.07em;
  line-height:1.3;
  text-transform:uppercase; color:var(--good);
  display:flex; gap:3px; align-items:center; white-space:nowrap;
}
.col.no h3{ color:var(--bad); }
.col h3 .ms{ --ms-size:13px; --ms-fill:1; --ms-wght:600; }
.col .w{
  font-family:var(--font-mono); font-size:13.5px; font-weight:500; letter-spacing:.04em;
  padding:4px 0; color:var(--ink); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.col .w + .w{ border-top:1px solid var(--hair); }

/* ---------- THE NOTEBOOK ----------
   Six numbered lines on ruled stock with a margin rule. Every line that has
   not been spent is still drawn — an empty stamp slot on a ruled line — so
   the price of a probe is on screen before you pay it. */
.nb{
  position:relative; background:var(--stock);
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow-1); overflow:hidden;
}
.nb::before{
  content:''; position:absolute; top:0; bottom:0; left:36px; width:1px;
  background:var(--margin-rule); pointer-events:none;
}
.line{
  position:relative;
  display:grid; grid-template-columns:36px minmax(0,1fr) auto;
  align-items:center; gap:0 12px;
  min-height:36px; padding-right:11px;
  border-bottom:1px solid var(--hair);
}
.line:last-child{ border-bottom:0; }
/* the row's own contents stay above the ink wash pseudo-element below */
.line > span{ position:relative; z-index:1; }
.line .n{
  font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.02em;
  color:var(--ink-3); text-align:right; padding-right:9px;
  transition:color var(--dur-2);
}
.line .w{
  font-family:var(--font-mono); font-size:15px; font-weight:600; letter-spacing:.07em;
  color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.line.yes .n{ color:var(--good); }
.line.no  .n{ color:var(--bad); }
.line.wait .n{ color:var(--accent); }
.line.wait .w{ color:var(--ink-2); }

/* the instrument reporting: a stamped readout, not an emoji */
.chip{
  /* the stamp is the third grid column of every notebook line and the word
     column is what pays for anything it takes, so the 10px floor is bought
     back on this rule: .12em down to .10em and a 1px trim off each side of
     the padding hold PASS/FAIL at 63.00px against the 64.38px it measured at
     9.5px. The word column gets 1.37px wider, not narrower. */
  min-width:62px; height:24px; padding:0 7px; border-radius:7px;
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.10em;
  border:1px solid transparent; background:var(--paper-2); color:var(--ink-3);
}
.chip .ms{ --ms-size:15px; --ms-fill:1; --ms-wght:600; }
.line.yes .chip{ background:var(--good-soft); color:var(--good); }
.line.no  .chip{ background:var(--bad-soft);  color:var(--bad); }
.line.wait .chip{ background:transparent; border-color:var(--accent); color:var(--accent); }
.line.wait .chip .ms{ --ms-fill:0; }
/* an unspent line */
.chip.empty{
  background:transparent; border:1px dashed var(--line-2); opacity:.55;
}
.line.ghost .n{ opacity:.5; }
.line.ghost .dot{ height:0; border-bottom:1px dotted var(--line-2); opacity:.6; }
.line.ghost .eg{
  font-family:var(--font-mono); font-size:11.5px; font-weight:500; letter-spacing:.04em;
  color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ---------- the bench taking a reading ----------
   Everything below is the motion signature made literal. A probe is WRITTEN
   onto the line, a traverse bar crosses the ruled line for exactly one --beat
   while the instrument thinks, then the stamp comes down and the ink soaks
   into the row. Pass settles clean; fail settles and then recoils once. */
@keyframes nb-write{ from{ opacity:0; transform:translateY(-5px) } }
.line.fresh .w{ animation:nb-write .3s var(--ease-settle) both; }

/* the traverse: a hairline crossing the line, left to right, for one beat */
.line.wait::after{
  content:''; position:absolute; left:36px; right:0; bottom:-1px; height:2px;
  background:var(--accent); opacity:.55; transform-origin:left;
  animation:traverse var(--beat) linear both;
  pointer-events:none;
}
@keyframes traverse{ from{ transform:scaleX(0) } to{ transform:scaleX(1) } }

/* the stamp coming down — decelerate only, no bounce back */
@keyframes stamp-down{
  0%  { opacity:0; transform:scale(1.5) }
  40% { opacity:1 }
  100%{ opacity:1; transform:scale(1) }
}
.line.landed .chip{ animation:stamp-down .26s var(--ease-settle) both; }
/* the ink soaking into the paper */
.line.landed::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--wash, transparent);
  animation:soak .75s var(--ease-out) both;
}
.line.landed.yes{ --wash:var(--good-soft); }
.line.landed.no { --wash:var(--bad-soft);  }
@keyframes soak{ from{ opacity:1 } to{ opacity:0 } }
/* the categorical difference: a FAIL recoils once, a PASS never moves */
@keyframes recoil{
  0%{ transform:translateX(0) } 22%{ transform:translateX(-3px) }
  55%{ transform:translateX(2px) } 80%{ transform:translateX(-1px) }
  100%{ transform:translateX(0) }
}
.line.landed.no .w{ animation:recoil .32s var(--ease-out) .2s both; }

/* ---------- the bench: input + commitment ---------- */
.tray{
  display:flex; flex-direction:column; gap:9px; padding-top:10px;
  position:sticky; bottom:0; background:var(--paper); z-index:2;
}
.tray::before{
  content:''; position:absolute; left:0; right:0; top:-20px; height:20px;
  background:linear-gradient(to top, var(--paper), transparent); pointer-events:none;
}
@media (max-width:619px){ .tray{ margin-top:auto; } }
.slot{
  height:52px; border:1.5px dashed var(--line-2); border-radius:12px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--white); padding:0 12px;
  font-family:var(--font-mono); font-size:20px; letter-spacing:.15em; font-weight:700;
  color:var(--ink); overflow:hidden;
  transition:border-color var(--dur-1), box-shadow var(--dur-2), background var(--dur-1);
}
/* gap:0 while filled — the letters are flex items now, and the slot's 8px
   gap (which spaces the placeholder glyph from its label) would otherwise be
   added on top of the tracking and push a 14-letter probe out of the box */
.slot.filled{
  border-style:solid; border-color:var(--accent); gap:0;
  box-shadow:0 0 0 3px var(--accent-soft);
}
/* each letter is set onto the slot rather than appearing in it */
.slot .ch{ display:inline-block; }
.slot .ch.new{ animation:key-set .17s var(--ease-settle) both; }
@keyframes key-set{ from{ opacity:0; transform:translateY(-6px) } }
/* before the first probe the bench asks for one — three breaths, then it
   stops asking. Text and dashed border carry it when motion is off. */
.slot.idle{ animation:bench-ask 2.4s var(--ease-in-out) 3; }
/* a rejected probe must still shake even while the bench is idling for one */
.slot.idle.shake{ animation:shake .4s; }
@keyframes bench-ask{
  0%,100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); border-color:var(--line-2) }
  45%    { box-shadow:0 0 0 4px var(--accent-soft); border-color:var(--accent) }
}
/* --ink-2, not the quieter --ink-3: the slot's label is not decoration, it is
   the instruction ("type anything", "out of probes — time to call it") */
.slot .ph{
  font-family:var(--font-ui); font-size:10.5px; font-weight:800; letter-spacing:.13em;
  color:var(--ink-2); text-transform:uppercase; text-align:center;
}
.slot .ms{ --ms-size:17px; --ms-wght:500; color:var(--ink-3); flex:0 0 auto; }
/* the cursor is drawn, not typed — a ▌ character renders differently in every
   font fallback, a 9px bar is the same instrument cursor everywhere */
.slot .car{
  flex:0 0 auto; width:9px; height:25px; border-radius:2px;
  background:var(--accent); margin-left:1px;
  animation:blink 1s steps(2,start) infinite;
}
@keyframes blink{ 50%{opacity:0} }
/* the kit zeroes every duration under reduced motion; an infinite blink at
   0.01ms can settle on the hidden half of its own keyframe, so pin it on */
@media (prefers-reduced-motion: reduce){ .slot .car{ animation:none; opacity:1; } }

.callit{
  width:100%; background:var(--white); color:var(--accent);
  border:1.5px solid var(--accent); border-radius:var(--r-pill);
  font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  padding:12px 16px; font-size:12.5px;
}
.callit .ms{ --ms-size:18px; --ms-fill:0; }
.callit:active{ background:var(--accent); color:var(--accent-ink); }
.callit:active .ms{ --ms-fill:1; }
/* out of probes: the button stops asking and starts telling */
.callit.urge{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.callit.urge .ms{ --ms-fill:1; }

/* ---------- the keyboard, rebuilt as bench keys ----------
   Mono caps on the same warm stock as the notebook, and every press tints
   accent instead of grey — the one large surface that was still pure kit. */
.kbd{ gap:6px; padding-top:12px; }
.kbd-row{ gap:5px; }
.key{
  font-family:var(--font-mono); font-weight:700; font-size:16px; letter-spacing:.01em;
  height:49px; border-radius:9px; background:var(--stock); color:var(--ink);
  transition:background .1s var(--ease-out), color .1s var(--ease-out),
             transform .08s var(--ease-out), box-shadow .1s;
}
.key:active{
  transform:scale(.93); background:var(--accent-soft); color:var(--accent);
  box-shadow:none;
}
.key.act{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.key.act:active{ background:var(--accent); color:var(--accent-ink); filter:brightness(.9); }
/* PROBE is set into a 27.64px key at 320px, so its label has always sat a
   little proud of the key face. Tracking is the whole payment here: .06em
   down to .02em puts the label at 35.0px against the 35.14px it measured at
   9.5px — fractionally narrower than before, at the floor. The 2px padding
   stays exactly where it was and that is deliberate: the kit gives this key
   `flex:1.6 1 0` on a border-box, so the padding is part of the key's flex
   base size. Trimming it to 1px made the KEY 1.37px narrower (27.64 -> 26.27)
   and the label proportionally prouder — the opposite of the trade. */
.key.wide{ font-size:10px; letter-spacing:.02em; font-weight:800; padding:0 2px; font-family:var(--font-ui); }
.deskhint{ display:none; }
/* Gated exactly like .kbd in shared/kit.css, and for the same reason. Width
   alone is the wrong question: a tablet is over 620px and has no hardware
   keyboard, so the bench keys stay on screen there — and a hint that says
   "type any letters" beside a keyboard the player is looking at is noise at
   best and a wild goose chase at worst. The hint appears only where the keys
   are actually gone, which is the same condition that removes them. */
@media (min-width:620px) and (hover:hover) and (pointer:fine){
  /* the only on-screen statement that a physical keyboard works here, and the
     on-screen one is hidden at this width — it has to be readable, not faint */
  .deskhint{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:12px; color:var(--ink-2);
  }
  .deskhint .ms{ --ms-size:15px; }
}

/* ---------- the call ---------- */
.callhead{ text-align:center; }
.callhead .t{
  font-family:var(--font-brand); font-size:27px; font-variation-settings:'wght' 700;
  font-weight:normal; letter-spacing:-.025em; margin:0;
}
.callhead .s{ font-size:13px; color:var(--ink-2); margin:3px 0 0; }
.callhead .s b{ color:var(--ink); }
/* the kit's .btn.sm lands at ~38px; the case file is a real thumb target */
.callhead .btn.sm{ min-height:44px; }
/* and so are the coach mark's, which are the first buttons a first-timer ever
   taps. Every game in the suite raises them here until shared/kit.css can. */
#tour-layer .bub .btn{ min-height:44px; }
.callbar{
  position:sticky; bottom:0; z-index:2; padding:10px 0 2px; background:var(--paper);
  display:flex; flex-direction:column; gap:7px;
}
.callbar::before{
  content:''; position:absolute; left:0; right:0; top:-16px; height:16px;
  background:linear-gradient(to top, var(--paper), transparent); pointer-events:none;
}
.cands{ display:flex; flex-direction:column; gap:7px; }
.cand{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:12px; width:100%;
  min-height:50px; padding:0 13px; text-align:left;
  background:var(--white); border:1.5px solid var(--line-2); border-radius:12px;
  font-family:var(--font-mono); font-weight:700; letter-spacing:.06em;
  font-size:clamp(13px,4vw,17px); color:var(--ink);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  transition:background var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out),
             transform .09s var(--ease-out);
}
button.cand{ cursor:pointer; }
button.cand:active{ transform:scale(.985); }
button.cand:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
/* Selection rides the FILL axis: the same mark drawn hollow, then drawn
   solid. One glyph interpolating beats two icons swapping. */
.cand .box{ width:26px; height:26px; flex:0 0 26px; display:grid; place-items:center; }
.cand .box .ms{
  --ms-size:25px; --ms-fill:0; --ms-wght:400; color:var(--line-2);
  transition:font-variation-settings .28s var(--ease-settle), color .2s var(--ease-out);
}
.cand.sel{ border-color:var(--accent); background:var(--accent-soft); }
.cand.sel .box .ms{ --ms-fill:1; color:var(--accent); }
.cand .mk{
  margin-left:auto; display:inline-flex; align-items:center; gap:4px;
  font-size:10px; letter-spacing:.09em; font-family:var(--font-ui); font-weight:800;
  text-transform:uppercase; white-space:nowrap;
}
.cand .mk .ms{ --ms-size:15px; --ms-fill:1; }
.cand.right{ border-color:var(--good); background:var(--good-soft); }
.cand.right .box .ms{ --ms-fill:1; color:var(--good); }
.cand.right .mk{ color:var(--good); }
.cand.wrong{ border-color:var(--bad); background:var(--bad-soft); }
.cand.wrong .box .ms{ --ms-fill:1; color:var(--bad); }
.cand.wrong .mk{ color:var(--bad); }
/* the one you walked past — amber, not green: this is the near miss */
.cand.missed{ border-style:dashed; border-color:var(--warn); background:var(--warn-soft); }
.cand.missed .box .ms{ --ms-fill:0; --ms-wght:600; color:var(--warn); }
.cand.missed .mk{ color:var(--warn); }
.cand.dud{ opacity:.45; }

/* ---------- THE SIGNATURE MOMENT ----------
   Eight specimens read one at a time: a traverse crosses the tile, then the
   tile resolves. `.live` scopes every one-shot to the resolve itself, so
   re-opening a finished day shows a marked-up board without replaying it. */
.cand.reading::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--accent-soft) 45%, transparent);
  animation:specimen-scan .34s linear both;
}
@keyframes specimen-scan{ from{ transform:translateX(-101%) } to{ transform:translateX(101%) } }
.cand.live .mk{ animation:mark-in .24s var(--ease-settle) both; }
@keyframes mark-in{ from{ opacity:0; transform:translateX(7px) } }
.cand.live.wrong{ animation:recoil .34s var(--ease-out) both; }
.cand.live.missed{ animation:missed-in .42s var(--ease-settle) both; }
@keyframes missed-in{ from{ opacity:.25 } to{ opacity:1 } }
.cand.live.dud{ animation:dud-out .42s var(--ease-out) both; }
@keyframes dud-out{ from{ opacity:1 } to{ opacity:.45 } }
/* on a 2-of-3 result the tile you walked past asks to be looked at twice */
.cand.aim::before{
  content:''; position:absolute; inset:1px; border-radius:10px;
  border:2px solid var(--warn); pointer-events:none;
  animation:aim 1.3s var(--ease-out) 2 both; animation-delay:.35s;
}
@keyframes aim{ 0%{ opacity:0 } 18%{ opacity:1 } 100%{ opacity:0 } }

/* the readout that replaces the lock button while the bench works */
.scanbar{ display:flex; flex-direction:column; gap:9px; padding:6px 0 4px; }
.scanbar .lbl{
  font-family:var(--font-mono); font-size:10.5px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); text-align:center;
}
.scanbar .trk{ height:3px; border-radius:2px; background:var(--accent-soft); overflow:hidden; }
.scanbar .trk i{
  display:block; height:100%; background:var(--accent);
  transform:scaleX(0); transform-origin:left; transition:transform .15s linear;
}
.counter{
  text-align:center; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2); font-weight:800;
}
.counter b{
  color:var(--accent); font-size:15px; font-family:var(--font-brand);
  font-variation-settings:'wght' 700; font-weight:normal;
  display:inline-block;
}
/* the kit's bump rides --ease-spring; nothing in this game springs */
.counter b.tick.bump{ animation:bump .26s var(--ease-settle); }
.tick.bump{ animation-timing-function:var(--ease-settle); }

/* ---------- result ---------- */
.res-wrap{ display:flex; flex-direction:column; gap:12px; }
.vhead{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
.verdict{
  margin:0; font-family:var(--font-brand); font-size:clamp(34px,10.5vw,46px);
  font-variation-settings:'wght' 700; font-weight:normal;
  letter-spacing:-.035em; line-height:1;
}
.verdict.win{ color:var(--good); }
.verdict.lose{ color:var(--bad); }
.verdict.near{ color:var(--warn); }
/* the stamped verdict — ink on paper, slightly off-square */
.stamp{
  position:relative; display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-brand); font-variation-settings:'wght' 700; font-weight:normal;
  font-size:12px; letter-spacing:.17em; text-transform:uppercase;
  padding:7px 15px; border:2px solid currentColor; border-radius:8px;
  transform:rotate(-2.2deg); color:var(--good);
}
.stamp::before{
  content:''; position:absolute; inset:3px; border:1px solid currentColor;
  border-radius:4px; opacity:.5;
}
.stamp.lose{ color:var(--bad); }
.stamp.near{ color:var(--warn); }
.stamp .ms{ --ms-size:16px; --ms-fill:1; }
/* the stamp is pressed onto the page a beat after the verdict word lands —
   straight down, no rebound. This is the moment the case closes. */
.stamp.press{ animation:stamp-press .32s var(--ease-settle) both .3s; }
@keyframes stamp-press{
  0%  { opacity:0; transform:rotate(-11deg) scale(2.05) }
  45% { opacity:1 }
  100%{ opacity:1; transform:rotate(-2.2deg) scale(1) }
}
.scoreline{ margin:0; font-size:14px; color:var(--ink-2); }
.scoreline .num{
  font-family:var(--font-brand); font-variation-settings:'wght' 700; font-weight:normal;
  font-size:21px; letter-spacing:-.02em; color:var(--ink); margin:0 1px;
  display:inline-block; font-variant-numeric:tabular-nums lining-nums;
}

/* the sting / the victory lap — one sentence, the thing you say out loud */
.sting{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 13px; font-size:13.5px; line-height:1.5; color:var(--ink-2); text-align:center;
}
.sting b{ font-family:var(--font-mono); font-weight:700; color:var(--ink); letter-spacing:.04em; }
.sting .hi{ color:var(--accent); font-weight:600; }
.sting.near{ background:var(--warn-soft); border-color:var(--warn); }
.sting.near .hi{ color:var(--warn); }

/* ---------- THE REVEAL — the screenshot ----------
   The rule finally printed on the pad, set like a journal headline. */
.reveal{
  background:var(--stock); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:17px 16px 14px; box-shadow:var(--shadow-2); position:relative; overflow:hidden;
}
/* the card rules itself off, then prints */
.reveal::before{
  content:''; position:absolute; inset:0 0 auto 0; height:3px; background:var(--accent);
  transform-origin:left; animation:rule-off .46s var(--ease-settle) both .22s;
}
@keyframes rule-off{ from{ transform:scaleX(0) } to{ transform:scaleX(1) } }
.reveal::after{
  content:''; position:absolute; inset:5px 0 auto 0; height:1px; background:var(--hair);
}
.reveal .kick{
  display:flex; align-items:center; gap:8px;
  font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent);
}
.reveal .kick .ms{ --ms-size:15px; --ms-fill:1; }
.reveal .kick .ln{ flex:1; height:1px; background:var(--accent-soft); }
.reveal .kick .who{ color:var(--ink-3); font-family:var(--font-mono); font-weight:600; letter-spacing:.11em; }
.reveal .headline{
  font-family:var(--font-brand); font-size:clamp(23px,6.6vw,29px); line-height:1.14;
  margin:9px 0 8px; font-variation-settings:'wght' 640; font-weight:normal;
  letter-spacing:-.03em; text-wrap:balance;
  animation:print .5s var(--ease-out) both .42s;
}
/* the rule is printed onto the card, left to right, once */
@keyframes print{ from{ clip-path:inset(0 100% -20% 0) } to{ clip-path:inset(0 -4% -20% 0) } }
/* a long rule steps down a size rather than eating the card */
.reveal .headline.long{ font-size:clamp(19px,5.3vw,23px); line-height:1.2; letter-spacing:-.022em; }
/* rules that name a letter set read better as a headline + a key strip */
.reveal .rulekeys{ display:flex; flex-wrap:wrap; gap:4px; margin:0 0 10px; }
.reveal .rulekeys span{
  font-family:var(--font-mono); font-size:12.5px; font-weight:700; letter-spacing:.06em;
  color:var(--accent); background:var(--accent-soft); border-radius:6px;
  min-width:22px; text-align:center; padding:3px 5px;
}
.reveal .rulekeys span.sep{ background:transparent; color:var(--ink-3); min-width:0; padding:3px 0; }
.reveal .detail{ font-size:13.5px; color:var(--ink-2); line-height:1.55; margin:0; }

.evgroup{ margin:16px -16px 0; padding:0 16px; }
/* line-height 1.4 is 14px, the height of the symbol beside the heading, so
   the extra half-pixel the 10px floor would have added to every evidence
   group header goes nowhere */
.evgroup h4{
  margin:0 0 4px; font-size:10px; font-weight:800; letter-spacing:.12em;
  line-height:1.4;
  text-transform:uppercase; color:var(--good); display:flex; align-items:center; gap:5px;
}
.evgroup h4 .ms{ --ms-size:14px; --ms-fill:1; }
.evgroup h4 .ct{ color:var(--ink-3); font-weight:700; letter-spacing:.08em; }
.evgroup h4 .why{ margin-left:auto; color:var(--ink-3); font-weight:700; letter-spacing:.06em; }
.evgroup.bad h4{ color:var(--bad); }
/* wrap rather than clip: a 14-letter probe with a long reason beside it is
   wider than a phone, and .reveal has overflow:hidden to hide the evidence */
.evrow{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:6px 0; border-top:1px solid var(--hair); }
.evgroup.bad .evrow{ padding:4.5px 0; }
.evrow .word{
  font-family:var(--font-mono); font-size:14.5px; letter-spacing:.08em;
  font-weight:600; white-space:nowrap; color:var(--ink);
}
.evgroup.bad .evrow .word{ font-size:13.5px; font-weight:500; color:var(--ink-2); }
.evrow .word em{
  font-style:normal; color:var(--accent); font-weight:800;
  background:var(--accent-soft); border-radius:3px; padding:2px 1.5px; margin:0 -.5px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}
.evgroup.bad .evrow .word em{ color:var(--bad); background:var(--bad-soft); }
.evrow .tag{
  margin-left:auto; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); font-weight:800; text-align:right; white-space:nowrap;
}
.evgroup.bad .evrow .tag{ color:var(--ink-3); font-weight:700; letter-spacing:.07em; }
/* no opacity on top of --ink-3: this is the quietest text in the game, and a
   .75 on top of the token took it under 2.5:1. The kit has since darkened
   --ink-3 to clear 4.5:1, which this line inherits for free — the provenance
   tag is meant to be recessive, not unreadable. It was also the smallest type
   in the file at 8.5px; the suite floor takes it to 10px and .11em down to
   .08em pays part of it back. The row is flex-wrap with 60px of slack at
   320px, so the longest tag ("opener", 46.09px -> 51.83px) still shares a
   line with its word rather than wrapping under it: every evidence row is
   34.02px tall before and after. */
.evrow .src{
  font-size:10px; color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase;
  font-weight:700; flex:0 0 auto;
}
.evrow .src::before{ content:'· '; }
/* when every failing word fails for the same reason, say it once and go dense */
.evchips{ display:flex; flex-wrap:wrap; gap:5px; padding-top:6px; border-top:1px solid var(--hair); }
.evchips span{
  font-family:var(--font-mono); font-size:12px; font-weight:500; letter-spacing:.05em;
  color:var(--ink-2); background:var(--paper-2); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:3px 9px;
}
/* The paste preview, and it has to be a preview: white-space:pre, so what is
   on screen is exactly what lands in the bubble, line for line. It used to be
   pre-wrap, which hid the real problem — the verdict line ran 50 characters
   and 415px against a 256px box at 320px wide, and the box quietly folded it
   onto a second line rather than admitting it. Every line is now capped at 29
   characters (240px here), so nothing wraps in the preview and nothing wraps
   in a message bubble either. */
.sharegrid{
  font-size:13.5px; letter-spacing:.02em; text-align:left; margin:0;
  padding:13px 15px; white-space:pre; overflow-x:auto;
  background:var(--stock); line-height:1.45;
}
/* Kit.share adds .done only on a clipboard write that really landed, so this
   green is a reading and not a reflex. A blocked clipboard falls back to the
   select-and-copy label instead, and the button stays accent. */
#shareBtn.done{ background:var(--good); border-color:transparent; }

/* ---------- sheets ---------- */
.sheet .lede{
  text-align:center; font-family:var(--font-brand); font-variation-settings:'wght' 500;
  font-weight:normal; font-size:17px; letter-spacing:-.015em; color:var(--ink-2);
  margin:0 0 16px; line-height:1.3;
}
.sheet h2{ font-family:var(--font-brand); font-variation-settings:'wght' 700; font-weight:normal; }
/* the diagram that replaces the paragraph */
.demo{
  display:grid; grid-template-columns:1fr 1fr; gap:9px;
  background:var(--stock); border:1px solid var(--line); border-radius:var(--r);
  padding:11px; box-shadow:var(--shadow-1);
}
.dcol{ display:flex; flex-direction:column; gap:4px; }
/* same trade as .col h3, which this diagram is a miniature of: the 10px floor
   is paid for with .12em -> .09em and 1px off the symbol gap, and pinned to a
   13px line so the two demo columns keep the height they had */
.dh{
  display:flex; align-items:center; gap:3px;
  font-size:10px; font-weight:800; letter-spacing:.09em; line-height:1.3;
  text-transform:uppercase;
}
.dh .ms{ --ms-size:13px; --ms-fill:1; }
.dh.good{ color:var(--good); } .dh.bad{ color:var(--bad); }
.dcol b{
  font-family:var(--font-mono); font-size:13.5px; font-weight:500; letter-spacing:.05em;
  color:var(--ink); padding:3px 0; border-top:1px solid var(--hair);
}
.dcol b em{
  font-style:normal; color:var(--accent); font-weight:800;
  background:var(--accent-soft); border-radius:3px; padding:1px 2px;
}
.dwhy{
  display:flex; align-items:center; justify-content:center; gap:7px;
  margin:11px 0 0; font-size:13.5px; color:var(--ink-2); text-align:center;
}
.dwhy .ms{ --ms-size:17px; --ms-fill:1; color:var(--accent); }
.dwhy em{ font-style:normal; color:var(--ink); font-weight:700; }
.dnote{ text-align:center; font-size:12px; color:var(--ink-3); margin:5px 0 0; }
.steps{ list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:12px; }
.steps li{ display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-2); line-height:1.45; }
.steps li b{ color:var(--ink); font-weight:700; }
.steps li > .ms{
  --ms-size:20px; --ms-fill:1; --ms-wght:500; color:var(--accent);
  flex:0 0 24px; margin-top:1px; text-align:center;
}
.steps code{
  font-family:var(--font-mono); background:var(--paper-2); padding:1px 5px;
  border-radius:5px; font-size:13px; letter-spacing:.04em; color:var(--ink);
}
.warn-box{
  display:flex; gap:9px; align-items:flex-start;
  background:var(--bad-soft); border:1px solid var(--bad); border-radius:var(--r);
  padding:11px 13px; font-size:13.5px; color:var(--ink); line-height:1.45; margin:16px 0 4px;
}
.warn-box .ms{ --ms-size:19px; --ms-fill:1; color:var(--bad); flex:0 0 auto; }
.warn-box b{ font-weight:700; }
.sheet .btnrow{ display:flex; gap:9px; margin-top:16px; }
.sheet .btnrow .btn{ flex:1; }
/* the same reasoning as --accent-ink above: a filled pill in dark mode needs
   dark ink on it. Hard-coded white on the dark-mode rust was 3.4:1 — on the
   one button in the game you cannot take back. --paper is 5.3:1 light,
   5.5:1 dark. */
.danger{ background:var(--bad); color:var(--paper); border-color:transparent; }
.danger .ms{ --ms-fill:1; }
/* the commitment has to feel irreversible: the button seals shut, holds for
   a beat, and only then does the board change under you */
.danger.sealed{ background:var(--ink); color:var(--paper); pointer-events:none; }
.danger.sealed .ms{ --ms-fill:1; }
.sheet .btnrow.sealing .btn.ghost{ opacity:.3; pointer-events:none; }
.lockline{
  text-align:center; font-size:13.5px; color:var(--ink-2); margin:13px 0 0;
}
.lockline .num{
  font-family:var(--font-brand); font-variation-settings:'wght' 700; font-weight:normal;
  font-size:19px; color:var(--ink); letter-spacing:-.02em;
}
.streakrow{ display:flex; justify-content:center; margin-top:12px; }
/* .res-wrap is a gap:12px flex column, so the kit's 14px statrow margin would
   stack on top of the gap and open a 26px hole in the middle of the tail */
.res-wrap .statrow{ margin:0; }
.stat .n{
  font-family:var(--font-brand); font-variation-settings:'wght' 700;
  font-weight:normal; letter-spacing:-.03em;
}
.stat .l{ white-space:nowrap; }

/* Short phones (SE, mini) AND the 360x740 / 320x740 Android band. The tier
   used to stop at 720px, which left a 740px phone paying full-height rows for
   a board that did not fit: 66px of overflow with all six probes spent, so
   the evidence columns had to scroll off the top before line 06 could come
   into view. At the compact rhythm the same board overflows by 10px — every
   notebook line and both evidence cards are on screen at once, with the keys
   still a 45px thumb target. */
@media (max-height:780px) and (max-width:619px){
  .line{ min-height:32px; }
  .col{ padding:8px 10px 8px; }
  .col .w{ padding:3px 0; }
  .slot{ height:48px; }
  .stage{ gap:10px; }
  .key{ height:45px; }
}
/* tall phones: the pad gets generous rather than stopping short above the
   bench, which is what the leftover space read as before */
@media (min-height:800px) and (max-width:619px){
  .line{ min-height:42px; }
  .col .w{ padding:5px 0; }
}

/* The kit zeroes every animation DURATION under reduced motion but leaves
   delays alone, so anything that starts life hidden and waits its turn would
   sit invisible for its whole delay and then snap in. Everything staged in
   this file therefore drops its delay too, and the specimen scan tightens up
   so the sequence still reads as a sequence without being a performance. */
@media (prefers-reduced-motion: reduce){
  .stamp.press, .reveal::before, .reveal .headline, .line.landed.no .w,
  .res-wrap.stagger > *, .cands.stagger > *, .slot.idle,
  /* the kit opens its coach bubble on a .1s delay its own reduce block leaves
     alone, so the bubble sits invisible for a tenth of a second and snaps in */
  #tour-layer .bub{ animation-delay:0s !important; }
  .cand.aim::before, .slot.idle{ animation:none !important; }
}

@media (min-width:620px){
  .stage{ overflow:visible; }
  /* auto margins centre the column when it fits and collapse to zero when it
     does not, so a long reveal never gets its top scrolled out of reach */
  .stage > *:first-child{ margin-top:auto; }
  .stage > *:last-child{ margin-bottom:auto; }
  /* nothing to stick to on desktop — the keyboard is hidden */
  .tray, .callbar{ position:static; }
  .tray::before, .callbar::before{ display:none; }
  .col .w{ font-size:15px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <div class="side">
      <a class="iconbtn" href="../" aria-label="All games" title="All games">
        <span class="ms" aria-hidden="true">arrow_back</span>
      </a>
    </div>
    <div class="mark">
      <h1><span class="a">The</span><span class="b">Rule</span></h1>
      <span class="puzz-no" id="caseNo">Case 1</span>
    </div>
    <!-- Two utilities, and they are the suite's two: theme, then help, in that
         order in all five games. The lab record used to sit here as a third
         and a four-button bar cannot leave a centred two-part wordmark 12px of
         air at 320px — so the record moved into the help sheet, where it is
         still reachable at any point in a case.
         Re-measured at 320px with the three that remain, and again after THE
         took the suite's 10px type floor (which widened the lockup by 1.63px):
         clearance from the wordmark lockup to the nearest button is 16.14px on
         the right and 62.14px on the left, and 14.00px on the right in the
         worst case (the sub-line running the full width of the 80px lockup
         box, "Case 8888 · the call" — that one is bounded by the bar's own
         14px gap, so the floor did not move it). Both sides clear the 12px
         floor. -->
    <div class="side end">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Toggle theme"></button>
      <button class="iconbtn" id="helpBtn" type="button" aria-label="How to play" title="How to play">
        <span class="ms" aria-hidden="true">help</span>
      </button>
    </div>
  </div>

  <div class="stage" id="stage"></div>
  <div id="kbd"></div>
</div>

<div class="sr" id="live" aria-live="polite"></div>

<script src="../shared/kit.js"></script>
<script src="puzzles.js"></script>
<script>
(function () {
  'use strict';

  var MAX_PROBES = 6;
  var BEAT_MS = 720;      // the measured pause; mirrors --beat in the CSS
  /* The day sets the case you OPEN on; closing one — cracked or busted —
     hands you the next straight away. Kit.puzzleNo is that number: the one
     on the masthead, in the save key and in the share line, and the only one
     that honours ?d=N for review. Kit.dayNumber() ignores the pin. */
  var DAY = Kit.puzzleNo('rule');
  var P = Kit.pick(PUZZLES, 'rule');
  var PIDX = (DAY - 1) % PUZZLES.length;

  var stage = document.getElementById('stage');
  var kbdMount = document.getElementById('kbd');
  var live = document.getElementById('live');
  var caseNoEl = document.getElementById('caseNo');

  var ic = Kit.icon;

  /* ---------------- state / persistence ---------------- */
  var db = Kit.store('rule');
  var statsDb = Kit.store('rule:stats');

  function loadAll() { return db.get() || {}; }
  function loadDay() {
    var all = loadAll();
    return all['d' + DAY] || { probes: [], picks: [], phase: 'probe', won: null };
  }
  function saveDay() {
    var all = loadAll();
    all['d' + DAY] = S;
    // keep the store small — last 12 days only
    var keys = Object.keys(all).sort(function (a, b) { return (+b.slice(1)) - (+a.slice(1)); });
    keys.slice(12).forEach(function (k) { delete all[k]; });
    db.set(all);
  }
  var S = loadDay();

  function stats() {
    return statsDb.get() || { played: 0, cracked: 0, best: null, probeSum: 0, streak: 0, lastDay: null };
  }
  function recordResult(won, used) {
    var st = stats();
    if (st.lastDay === DAY) return;          // never double-count a day
    st.played++;
    if (won) {
      st.cracked++;
      st.probeSum += used;
      if (st.best === null || used < st.best) st.best = used;
      st.streak = (st.lastDay === DAY - 1) ? st.streak + 1 : 1;
    } else {
      st.streak = 0;
    }
    st.lastDay = DAY;
    statsDb.set(st);
  }

  /* ---------------- deterministic candidate order ---------------- */
  function shuffled(list, seed) {
    var r = Kit.rng(seed), a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var CANDS = shuffled(P.call, (DAY * 7919) + PIDX * 131 + 17);

  /* ---------------- small helpers ---------------- */
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }
  function say(msg) { live.textContent = msg; }

  /* One header pattern for the whole game: label · hairline · reading. */
  function sect(iconName, label, meta) {
    var s = el('div', 'sect');
    var lab = el('span', 'lab');
    lab.innerHTML = ic(iconName, { size: 14 }) + Kit.esc(label);
    s.appendChild(lab);
    s.appendChild(el('i', 'ln'));
    var m = el('span', 'meta', meta || '');
    s.appendChild(m);
    s.metaEl = m;
    return s;
  }

  function setCase(suffix) {
    caseNoEl.textContent = 'Case ' + DAY + (suffix ? ' · ' + suffix : '');
  }

  function calm() {
    try { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  /* Kit.count drives a figure with requestAnimationFrame, which stops dead on
     a backgrounded or throttled tab — the reading is then left frozen on the
     count's starting zero, so a 2-of-3 near miss renders as "0 of 3 right".
     Reproduced on a hidden tab. Every count here lands on the truth whether
     or not anyone watched it arrive. */
  function tally(node, to, ms) {
    if (!node) return;
    Kit.count(node, to, { ms: ms });
    setTimeout(function () { node.textContent = String(to); }, ms + 350);
  }

  /* ---------------- haptics with intent ----------------
     Five different events must not feel like the same event. A keypress is
     a tick you barely register; a PASS is one clean confirm; a FAIL is two
     short knocks; a commitment is a single heavy thud. */
  function hap(kind) {
    switch (kind) {
      case 'key':    Kit.haptic(4); break;
      case 'submit': Kit.haptic(9); break;
      case 'pass':   Kit.haptic(17); break;
      case 'fail':   Kit.haptic(9); setTimeout(function () { Kit.haptic(9); }, 95); break;
      case 'pick':   Kit.haptic(7); break;
      case 'unpick': Kit.haptic(4); break;
      case 'commit': Kit.haptic(36); break;
      case 'win':    Kit.haptic(20); setTimeout(function () { Kit.haptic(48); }, 130); break;
      case 'near':   Kit.haptic(14); setTimeout(function () { Kit.haptic(28); }, 150); break;
      case 'lose':   Kit.haptic(13); setTimeout(function () { Kit.haptic(13); }, 105);
                     setTimeout(function () { Kit.haptic(13); }, 210); break;
      default:       Kit.haptic(6);
    }
  }

  /* ---------------- input ---------------- */
  var cur = '';
  var busy = false;

  var kb = Kit.keyboard(kbdMount, onKey, { enterLabel: 'PROBE' });
  // the kit ships a ⌫ character on the backspace key; every other mark in
  // this file is a Material Symbol, so this one is too
  (function () {
    var bk = kbdMount.querySelector('[data-key="BACK"]');
    if (bk) bk.innerHTML = ic('backspace', { size: 19 });
  })();

  /* The kit's global key handler calls preventDefault() on ENTER so a probe
     can be sent with nothing focused. preventDefault() on an ENTER keydown is
     also exactly what cancels a focused button's activation, so with the kit
     handler in place every button in the game — Lock it in, Case file, Share,
     Got it, Next case — is dead to the ENTER key on a physical keyboard.
     Kit.keyboard hands back destroy() for precisely this; the replacement is
     the kit's own mapping with one rule added: a focused control owns ENTER.
     Every render leaves focus on <body>, so type-then-ENTER is unchanged, and
     the bench keys are exempt because ENTER there still means "probe". */
  kb.destroy();
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    // a sheet or a coach mark owns the keyboard while it is up: letters must
    // not land in a slot nobody can see behind the scrim
    if (document.querySelector('.scrim, #tour-layer')) return;
    if (e.key === 'Enter') {
      // Kit.ownsKey uses :focus-visible, so a control the player TABBED to
      // keeps ENTER, while one merely left focused by a mouse click hands it
      // back to the board — otherwise, on desktop where the on-screen keys
      // are hidden and typing is the only input path, clicking this game's
      // one big button silently eats every ENTER that follows.
      if (t && t.closest && !t.closest('#kbd') && Kit.ownsKey(e)) return;
      onKey('ENTER'); e.preventDefault();
    } else if (e.key === 'Backspace') { onKey('BACK'); e.preventDefault(); }
    else if (/^[a-zA-Z]$/.test(e.key)) { onKey(e.key.toUpperCase()); e.preventDefault(); }
  });

  function onKey(k) {
    if (S.phase !== 'probe' || busy) return;
    // out of probes the slot is showing "time to call it" — typing into it
    // would put characters somewhere the player can no longer see them
    if (S.probes.length >= MAX_PROBES && k !== 'ENTER') return;
    if (k === 'ENTER') { submitProbe(); return; }
    if (k === 'BACK') {
      if (cur) { cur = cur.slice(0, -1); hap('key'); paintSlot(); }
      return;
    }
    if (/^[A-Z]$/.test(k)) {
      if (cur.length >= 14) return;
      cur += k;
      hap('key');
      paintSlot(true);
    }
  }

  function submitProbe() {
    var w = cur;
    // out of probes the slot is empty and unfillable, so the length check
    // would answer "three letters or more" to a question nobody asked
    if (S.probes.length >= MAX_PROBES) { Kit.toast('No probes left — call it'); return; }
    if (w.length < 3) { Kit.toast('Three letters or more'); Kit.flash(slotEl, 'shake'); return; }
    var dupe = S.probes.some(function (p) { return p.w === w; }) ||
               P.pass.indexOf(w) >= 0 || P.fail.indexOf(w) >= 0;
    if (dupe) { Kit.toast('Already on the board'); Kit.flash(slotEl, 'shake'); return; }

    busy = true;
    var rec = { w: w, ok: null };
    var at = S.probes.length;
    S.probes.push(rec);
    cur = '';
    paintSlot();
    renderNote({ fresh: at });      // the word is written onto the line…
    renderMeter();                  // …and the line burns down at once
    revealLine(at);                 // …and the line it was written on is on screen
    if (callBtn) callBtn.disabled = true;   // the bench is mid-reading
    hap('submit');
    say('Testing ' + w);

    // BEAT_MS matches --beat in the stylesheet: the traverse bar finishes
    // crossing the ruled line exactly as the stamp comes down.
    setTimeout(function () {
      rec.ok = !!P.pred(w);
      busy = false;
      saveDay();
      renderNote({ landed: at });
      renderMeter();
      revealLine(at);
      if (callBtn) callBtn.disabled = false;
      hap(rec.ok ? 'pass' : 'fail');
      say(w + (rec.ok ? ' passes' : ' fails'));
    }, BEAT_MS);
  }

  /* ---------------- screens ---------------- */
  function render() {
    stage.innerHTML = '';
    kbdMount.style.display = (S.phase === 'probe') ? '' : 'none';
    if (S.phase === 'probe') renderProbe();
    else if (S.phase === 'call') renderCall();
    else renderResult();
    // .stage is the scroller on a phone, so window.scrollTo would do nothing
    stage.scrollTop = 0;
    window.scrollTo(0, 0);
    // …except on a board that reopens mid-case: the last line the bench wrote
    // has to be on screen, not below the fold waiting to be found
    if (S.phase === 'probe' && S.probes.length) revealLine(S.probes.length - 1);
  }

  /* ---- probe screen ---- */
  var slotEl, noteEl, callBtn, nbSect, trayEl;

  /* The notebook is six fixed rows and the stage is the scroller, so on a
     740px phone the last rows can start life below the fold. A scroll you have
     to discover is the same bug as a row that never paints, one tap further
     away: nobody should have to go looking for evidence they already paid six
     probes for. Every line the bench writes is put on screen, clear of the
     sticky tray, whether it was just written or was already there when the
     board reopened. */
  function revealLine(i) {
    if (!noteEl) return;
    var row = noteEl.children[i];
    if (!row) return;
    function run() {
      var scrolls = getComputedStyle(stage).overflowY === 'auto' &&
                    stage.scrollHeight - stage.clientHeight > 1;
      var box = scrolls ? stage.getBoundingClientRect()
        : { top: 0, bottom: (window.innerHeight || document.documentElement.clientHeight) };
      /* The floor is the top edge of the tray, read off the tray itself rather
         than derived from the stage height — .stage carries 8px of vertical
         padding the sticky tray parks above, and subtracting a height instead
         of measuring an edge left the last row 2px behind the slot. The tray
         is sticky only while the stage is the scroller; on desktop it is
         static and covers nothing. */
      var floor = box.bottom;
      if (trayEl && getComputedStyle(trayEl).position === 'sticky') {
        floor = Math.min(floor, trayEl.getBoundingClientRect().top);
      }
      var r = row.getBoundingClientRect();
      var d = 0;
      if (r.bottom > floor - 6) d = r.bottom - (floor - 6);
      else if (r.top < box.top + 6) d = r.top - (box.top + 6);
      if (!d) return;
      if (scrolls) stage.scrollTop += d; else window.scrollBy(0, d);
    }
    run();
    // once more after layout has settled (web fonts, the stamp arriving)
    requestAnimationFrame(run);
  }

  function renderProbe() {
    setCase('');

    stage.appendChild(sect('find_in_page', 'Evidence', 'One hidden rule'));

    var board = el('div', 'board');
    function col(cls, iconName, head, words) {
      var c = el('div', 'col ' + cls);
      var h = el('h3');
      h.innerHTML = ic(iconName, { size: 13, fill: 1 }) + Kit.esc(head);
      c.appendChild(h);
      words.forEach(function (w) { c.appendChild(el('div', 'w', w)); });
      return c;
    }
    board.appendChild(col('', 'check_circle', 'Follows the rule', P.pass));
    board.appendChild(col('no', 'cancel', 'Breaks it', P.fail));
    stage.appendChild(board);

    nbSect = sect('menu_book', 'Notebook', '');
    stage.appendChild(nbSect);

    noteEl = el('div', 'nb');
    stage.appendChild(noteEl);
    renderNote();

    // the bench: one input, one commitment
    trayEl = el('div', 'tray');
    slotEl = el('div', 'slot');
    trayEl.appendChild(slotEl);

    callBtn = el('button', 'btn callit');
    callBtn.type = 'button';
    callBtn.innerHTML = ic('gavel', { size: 18 }) + 'Call it';
    callBtn.addEventListener('click', confirmCall);
    trayEl.appendChild(callBtn);

    var dh = el('div', 'deskhint');
    dh.innerHTML = 'Type any letters, then ' + ic('keyboard_return', { size: 15 }) + ' to probe.';
    trayEl.appendChild(dh);
    stage.appendChild(trayEl);

    paintSlot();
    renderMeter();
  }

  /* `landed` marks the character just typed so only that one animates in —
     rebuilding the whole string with an entrance would replay the word. */
  function paintSlot(landed) {
    if (!slotEl) return;
    slotEl.innerHTML = '';
    slotEl.classList.remove('idle');
    if (S.probes.length >= MAX_PROBES) {
      slotEl.classList.remove('filled');
      slotEl.innerHTML = ic('front_hand', { size: 17 }) +
        '<span class="ph">Out of probes — time to call it</span>';
      return;
    }
    if (!cur) {
      slotEl.classList.remove('filled');
      slotEl.innerHTML = ic('experiment', { size: 17 }) +
        '<span class="ph">Type anything — even nonsense</span>';
      // before the very first probe the bench asks, three times, then stops
      if (!S.probes.length) slotEl.classList.add('idle');
    } else {
      slotEl.classList.add('filled');
      for (var i = 0; i < cur.length; i++) {
        slotEl.appendChild(el('span', 'ch' + (landed && i === cur.length - 1 ? ' new' : ''), cur[i]));
      }
      slotEl.appendChild(el('span', 'car'));
    }
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* THE NOTEBOOK. Six numbered lines on ruled stock. Each probe writes one
     and the readout stamps after a beat; the lines you have not spent stay
     drawn, empty stamp slot and all, so the cost is always on screen. */
  /* opts.fresh  — index of a line just written (the word is set onto it)
     opts.landed — index of a line whose reading just came back (stamp down)
     Every other row is rebuilt inert, so no entrance ever replays across the
     whole log when a single line changes. */
  function renderNote(opts) {
    if (!noteEl) return;
    opts = opts || {};
    noteEl.innerHTML = '';
    for (var i = 0; i < MAX_PROBES; i++) {
      var p = S.probes[i];
      if (!p) {
        var g = el('div', 'line ghost');
        g.appendChild(el('span', 'n', pad2(i + 1)));
        // the first blank line doubles as the teaching prompt
        if (i === 0 && !S.probes.length) g.appendChild(el('span', 'eg', 'CRATE · AAAA · anything'));
        else g.appendChild(el('span', 'dot'));
        g.appendChild(el('span', 'chip empty'));
        noteEl.appendChild(g);
        continue;
      }
      var cls = 'line ' + (p.ok === null ? 'wait' : (p.ok ? 'yes' : 'no'));
      if (opts.fresh === i) cls += ' fresh';
      if (opts.landed === i) cls += ' landed';
      var row = el('div', cls);
      row.appendChild(el('span', 'n', pad2(i + 1)));
      row.appendChild(el('span', 'w', p.w));
      var res = el('span', 'chip');
      if (p.ok === null) res.innerHTML = ic('hourglass_top', { size: 15 });
      else res.innerHTML = ic(p.ok ? 'check_circle' : 'cancel', { size: 15, fill: 1 }) +
                           (p.ok ? 'PASS' : 'FAIL');
      row.appendChild(res);
      noteEl.appendChild(row);
    }
  }

  /* Probes left lives in exactly one place — the notebook's own header. */
  function renderMeter() {
    var left = MAX_PROBES - S.probes.length;
    if (nbSect) nbSect.metaEl.textContent = left + ' probe' + (left === 1 ? '' : 's') + ' left';
    if (callBtn) callBtn.classList.toggle('urge', left === 0);
    if (left === 0) paintSlot();
  }

  /* ---- the call ---- */
  function confirmCall() {
    if (busy) return;
    hap('submit');
    var used = S.probes.filter(function (p) { return p.ok !== null; }).length;
    Kit.sheet(
      '<h2>Call it?</h2>' +
      '<p class="lede">You think you know the rule.</p>' +
      '<div class="rules">You will be shown <b>8 fresh words</b>. Tap the <b>three</b> that follow the rule — exactly three, no more, no fewer.</div>' +
      '<div class="warn-box">' + ic('warning', { size: 19, fill: 1 }) +
      '<span><b>You get one call.</b> No second try, no hints. Miss a single word and you are busted for the day.</span></div>' +
      '<p class="lockline">Your score locks in at <span class="num">' + used + '</span> probe' +
      (used === 1 ? '' : 's') + '.</p>' +
      '<div class="btnrow">' +
      '<button class="btn ghost" data-close type="button">Not yet</button>' +
      '<button class="btn danger" id="goCall" type="button">' + ic('gavel', { size: 19 }) + 'Call it</button>' +
      '</div>',
      { onOpen: function (sheetEl, close) {
          /* Kit.sheet marks the dialog but cannot name it — a dialog with no
             accessible name is announced as a bare "dialog". Every sheet in
             this file names itself here, the way Chains does. */
          sheetEl.setAttribute('aria-label', 'Call it?');
          var go = sheetEl.querySelector('#goCall');
          go.addEventListener('click', function () {
            // the commitment is meant to be irreversible, so it is allowed to
            // take a beat: the button seals, holds, and only then does the
            // board change underneath you.
            if (go.classList.contains('sealed')) return;
            go.classList.add('sealed');
            go.parentNode.classList.add('sealing');
            go.innerHTML = ic('done_all', { size: 19, fill: 1 }) + 'Sealed';
            hap('commit');
            setTimeout(function () {
              close();
              S.phase = 'call';
              S.calledAt = used;
              saveDay();
              render();
            }, calm() ? 140 : 420);
          });
        } }
    );
  }

  function caseFileHTML() {
    var yes = [], no = [];
    P.pass.forEach(function (w) { yes.push(w); });
    P.fail.forEach(function (w) { no.push(w); });
    S.probes.forEach(function (p) {
      if (p.ok === null) return;
      (p.ok ? yes : no).push(p.w + ' *');
    });
    function colHTML(list, cls, iconName, head) {
      return '<div class="col ' + cls + '"><h3>' + ic(iconName, { size: 13, fill: 1 }) + head + '</h3>' +
        list.map(function (w) { return '<div class="w">' + Kit.esc(w) + '</div>'; }).join('') + '</div>';
    }
    return '<h2>Case file</h2><p class="lede">Everything you know. * marks your probes.</p>' +
      '<div class="board">' + colHTML(yes, '', 'check_circle', 'Follows the rule') +
      colHTML(no, 'no', 'cancel', 'Breaks it') + '</div>' +
      '<button class="btn primary wide" data-close type="button" style="margin-top:16px">Back to the call</button>';
  }

  function renderCall() {
    setCase('the call');

    var head = el('div', 'callhead');
    head.appendChild(el('p', 't', 'Name the three.'));
    var sub = el('p', 's');
    sub.innerHTML = 'Eight new words. Exactly <b>three</b> follow the hidden rule.';
    head.appendChild(sub);
    var cf = el('button', 'btn ghost sm');
    cf.type = 'button';
    cf.innerHTML = ic('find_in_page', { size: 17 }) + 'Case file';
    cf.style.marginTop = '10px';
    cf.addEventListener('click', function () {
      hap('key');
      Kit.sheet(caseFileHTML(),
        { onOpen: function (sheetEl) { sheetEl.setAttribute('aria-label', 'Case file'); } });
    });
    head.appendChild(cf);
    stage.appendChild(head);

    var list = el('div', 'cands stagger');
    CANDS.forEach(function (w) {
      var b = el('button', 'cand');
      b.type = 'button';
      b.dataset.w = w;
      var box = el('span', 'box');
      box.innerHTML = ic('check_circle', { size: 25 });
      b.appendChild(box);
      b.appendChild(document.createTextNode(w));
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { togglePick(w); });
      list.appendChild(b);
    });
    stage.appendChild(list);

    // the commit bar stays under your thumb no matter how far you scroll
    var bar = el('div', 'callbar');
    var counter = el('div', 'counter');
    counter.setAttribute('aria-live', 'polite');
    bar.appendChild(counter);
    var lock = el('button', 'btn primary wide');
    lock.type = 'button';
    lock.addEventListener('click', function () { lockIn(bar); });
    bar.appendChild(lock);
    stage.appendChild(bar);

    function paint() {
      list.querySelectorAll('.cand').forEach(function (b) {
        var on = S.picks.indexOf(b.dataset.w) >= 0;
        b.classList.toggle('sel', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      counter.innerHTML = '<b class="tick">' + S.picks.length + '</b> of 3 chosen';
      lock.disabled = S.picks.length !== 3;
      lock.innerHTML = S.picks.length === 3
        ? ic('gavel', { size: 19 }) + 'Lock it in — no takebacks'
        : 'Pick ' + (3 - S.picks.length) + ' more';
    }
    paintCall = paint;
    paint();
  }
  var paintCall = function () {};

  function togglePick(w) {
    if (S.phase !== 'call') return;   // never edit a call that has been read
    var i = S.picks.indexOf(w);
    if (i >= 0) { S.picks.splice(i, 1); hap('unpick'); }
    else {
      if (S.picks.length >= 3) { Kit.toast('Three only — deselect one first'); return; }
      S.picks.push(w);
      hap('pick');
    }
    saveDay();
    paintCall();
    var c = stage.querySelector('.counter b');
    if (c) Kit.flash(c, 'bump');
  }

  /* ---- THE SIGNATURE MOMENT ----
     Eight specimens go through the bench one at a time. Each gets a traverse,
     then resolves right / wrong / missed, and the readout counts them off.
     Only when the last one has settled does the verdict land. */
  var justFinished = false;

  function lockIn(bar) {
    if (S.picks.length !== 3) return;
    var right = S.picks.filter(function (w) { return P.pred(w); });
    S.won = right.length === 3;
    S.hits = right.length;
    S.phase = 'done';
    justFinished = true;
    saveDay();
    recordResult(S.won, S.calledAt);
    hap('commit');

    var tiles = Array.prototype.slice.call(stage.querySelectorAll('.cand'));
    stage.querySelectorAll('.btn').forEach(function (b) { b.disabled = true; });
    // the specimens are buttons, not .btn — without this they stay tappable
    // for the ~1.9s of the scan and a tap would edit S.picks after the
    // verdict has already been scored off it
    tiles.forEach(function (b) { b.disabled = true; });

    // the lock button becomes the instrument's readout
    var scan = el('div', 'scanbar');
    scan.innerHTML = '<div class="lbl">Reading specimen 1 / ' + tiles.length + '</div>' +
                     '<div class="trk"><i></i></div>';
    if (bar) { bar.innerHTML = ''; bar.appendChild(scan); }
    var lbl = scan.querySelector('.lbl'), fill = scan.querySelector('.trk i');

    // still a sequence when motion is reduced, just not a performance
    var STEP = calm() ? 60 : 150;
    tiles.forEach(function (b, i) {
      setTimeout(function () {
        b.classList.add('reading');
        if (lbl) lbl.textContent = 'Reading specimen ' + (i + 1) + ' / ' + tiles.length;
        if (fill) fill.style.transform = 'scaleX(' + ((i + 1) / tiles.length) + ')';
      }, STEP * i);
      setTimeout(function () {
        b.classList.remove('reading');
        b.classList.add('live');
        markTile(b);
        var w = b.dataset.w, picked = S.picks.indexOf(w) >= 0, pass = P.pred(w);
        if (picked && pass) Kit.haptic(16);
        else if (picked) { Kit.haptic(8); setTimeout(function () { Kit.haptic(8); }, 80); }
        else if (pass) Kit.haptic(11);
      }, STEP * i + 200);
    });

    var total = STEP * tiles.length + 200;
    setTimeout(function () {
      if (lbl) lbl.textContent = S.won ? 'Three for three' : S.hits + ' of 3 confirmed';
    }, total + 60);
    setTimeout(function () { render(); }, total + 640);
    // the spoken verdict has to be the verdict on screen, near miss included
    say(S.won ? 'Cracked it'
              : (right.length === 2 ? 'One off — 2 of 3' : 'Busted — ' + right.length + ' of 3'));
  }

  function mark(b, iconName, label) {
    var m = el('span', 'mk');
    m.innerHTML = ic(iconName, { size: 15, fill: 1 }) + label;
    b.appendChild(m);
  }

  function markTile(b) {
    var w = b.dataset.w, picked = S.picks.indexOf(w) >= 0, pass = P.pred(w);
    var box = b.querySelector('.box');
    b.classList.remove('sel');
    if (picked && pass) { b.classList.add('right'); mark(b, 'check_circle', 'correct'); }
    else if (picked && !pass) {
      b.classList.add('wrong');
      if (box) box.innerHTML = ic('cancel', { size: 25, fill: 1 });
      mark(b, 'cancel', 'wrong');
    } else if (!picked && pass) { b.classList.add('missed'); mark(b, 'visibility_off', 'missed'); }
    else { b.classList.add('dud'); }
  }

  /* ---- result + reveal ---- */
  /* A bare "3 probes" means nothing to someone who has not played. The tier
     word is what makes the number legible in a feed — and on a loss it is
     the joke.
     These ride in the share line, which has a hard budget: 30 monospace
     columns, so nothing wraps in a message bubble. 'ALL SIX, STILL WRONG'
     alone was 20 of them and pushed its line to 50 characters. The tier idea
     survives; the words got shorter. Longest line the block can now produce
     is 29 characters. */
  function shareTier(used, won) {
    if (!won) {
      if (used === 0) return 'PURE HUBRIS';   // 11
      if (used <= 2) return 'TOO SOON';       // 8
      if (used <= 5) return 'NOT ENOUGH';     // 10
      return 'SIX AND OUT';                   // 11 — spent the lot, still out
    }
    if (used === 0) return 'LEGENDARY';
    if (used === 1) return 'SURGICAL';
    if (used <= 3) return 'CLEAN';
    if (used === 4) return 'SOLID';
    if (used === 5) return 'CLUTCH';
    return 'SQUEAKER';
  }

  /* The stamp on the result screen. Same tiers, said in full — a screen has
     room a message bubble does not — but never a different verdict from the
     one the share line carries. */
  function tierFor(used, won) {
    if (!won) {
      if (used === 0) return 'Pure hubris';
      if (used <= 2) return 'Called far too soon';
      if (used <= 5) return 'Not enough evidence';
      return 'Six and out';
    }
    if (used === 0) return 'Legendary';
    if (used === 1) return 'Surgical';
    if (used <= 3) return 'Clean';
    if (used === 4) return 'Solid';
    if (used === 5) return 'Clutch';
    return 'Squeaker';
  }

  function wordHTML(w, ev) {
    var hit = {}; (ev.hits || []).forEach(function (i) { hit[i] = 1; });
    var out = '', open = false;
    for (var i = 0; i < w.length; i++) {
      var h = !!hit[i];
      if (h && !open) { out += '<em>'; open = true; }
      if (!h && open) { out += '</em>'; open = false; }
      out += Kit.esc(w[i]);
    }
    if (open) out += '</em>';
    return out;
  }

  function evRow(w, src, showTag) {
    var ev = P.ev(w);
    var row = el('div', 'evrow');
    var word = el('span', 'word');
    word.innerHTML = wordHTML(w, ev);
    row.appendChild(word);
    if (src) row.appendChild(el('span', 'src', src));
    if (showTag !== false) row.appendChild(el('span', 'tag', ev.tag));
    return row;
  }

  /* The evidence, re-sorted so it becomes obvious in hindsight: words that
     failed (or passed) for the same reason sit next to each other. */
  function evGroup(cls, iconName, head, rows) {
    var g = el('div', 'evgroup ' + cls);
    var h = el('h4');
    h.innerHTML = ic(iconName, { size: 14, fill: 1 }) + Kit.esc(head);
    h.appendChild(el('span', 'ct', rows.length + (rows.length === 1 ? ' word' : ' words')));
    g.appendChild(h);

    var tags = rows.map(function (r) { return P.ev(r[0]).tag; });
    var sameTag = tags.every(function (t) { return t === tags[0]; });
    var noHits = rows.every(function (r) { return !P.ev(r[0]).hits.length; });

    if (sameTag && noHits && rows.length > 3) {
      // every one fails for the same reason and there is nothing to point at —
      // say it once in the header and let the words go dense.
      h.appendChild(el('span', 'why', tags[0]));
      var chips = el('div', 'evchips');
      rows.forEach(function (r) { chips.appendChild(el('span', null, r[0])); });
      g.appendChild(chips);
    } else {
      rows.sort(function (a, b) {
        var ta = P.ev(a[0]).tag, tb = P.ev(b[0]).tag;
        return ta === tb ? (a[0] < b[0] ? -1 : 1) : (ta < tb ? -1 : 1);
      });
      rows.forEach(function (r) { g.appendChild(evRow(r[0], r[1], true)); });
    }
    return g;
  }

  /* One sentence, in plain English, naming the exact word that decided it.
     On a bust this is the sting; on a win it is the victory lap. */
  function stingLine(near) {
    var d = el('div', 'sting' + (near ? ' near' : ''));
    var tagOf = function (w) { return Kit.esc(P.ev(w).tag); };
    var mono = function (w) { return '<b>' + Kit.esc(w) + '</b>'; };
    var wrongs = S.picks.filter(function (w) { return !P.pred(w); });
    var missed = CANDS.filter(function (w) { return P.pred(w) && S.picks.indexOf(w) < 0; });

    // one word between you and the case — say exactly that, and nothing else
    if (near && missed.length) {
      d.innerHTML = 'One word in it. ' + mono(missed[0]) + ' was <span class="hi">' +
                    tagOf(missed[0]) + '</span> — and you had ' + mono(wrongs[0]) + ' instead.';
      return d;
    }

    if (!S.won) {
      var parts = [];
      parts.push(mono(wrongs[0]) + ' was never in it: ' + tagOf(wrongs[0]) + '.');
      if (wrongs.length > 1) parts.push('Nor was ' + mono(wrongs[1]) + '.');
      if (missed.length) {
        parts.push('You walked straight past ' + mono(missed[0]) +
                   ' — <span class="hi">' + tagOf(missed[0]) + '</span>.');
      }
      d.innerHTML = parts.join(' ');
      return d;
    }
    // a win: point at the sharpest thing they spotted
    var shown = S.picks.filter(function (w) { return P.ev(w).hits.length; })
                       .sort(function (a, b) { return P.ev(a).hits.length - P.ev(b).hits.length; });
    if (S.calledAt === 0) {
      d.innerHTML = 'Zero probes. You looked at six words and simply <span class="hi">knew</span>.';
    } else if (shown.length) {
      d.innerHTML = 'You saw <span class="hi">' + tagOf(shown[0]) + '</span> inside ' +
                    mono(shown[0]) + '. That is the whole game.';
    } else {
      d.innerHTML = 'You had it: <span class="hi">' + tagOf(S.picks[0]) +
                    '</span>. Three for three, no luck involved.';
    }
    return d;
  }

  function renderResult() {
    setCase('closed');

    var used = S.calledAt || 0;
    var near = !S.won && S.hits === 2;      // the "I was SO close" case
    var tone = S.won ? 'win' : (near ? 'near' : 'lose');
    var wrap = el('div', 'res-wrap stagger');

    var vhead = el('div', 'vhead');
    vhead.appendChild(el('h2', 'verdict ' + tone,
      S.won ? 'CRACKED IT' : (near ? 'ONE OFF' : 'BUSTED')));

    var stamp = el('div', 'stamp press' + (S.won ? '' : (near ? ' near' : ' lose')));
    stamp.innerHTML = ic(S.won ? 'verified' : 'gavel', { size: 16, fill: 1 }) +
                      Kit.esc(tierFor(used, S.won));
    vhead.appendChild(stamp);

    var sl = el('p', 'scoreline');
    sl.innerHTML = S.won
      ? 'Called it on <span class="num tick" id="bignum">' + used + '</span> probe' +
        (used === 1 ? '' : 's') + '.'
      : '<span class="num tick" id="bignum">' + S.hits + '</span> of 3 right, on <span class="num">' +
        used + '</span> probe' + (used === 1 ? '' : 's') + '.';
    vhead.appendChild(sl);
    wrap.appendChild(vhead);

    // the call, resolved. Only what you touched and what you should have:
    // the other near-misses are laid out in full inside the reveal below.
    wrap.appendChild(sect('gavel', 'Your call', S.won ? 'Three for three' : 'Marked up'));

    var list = el('div', 'cands');
    CANDS.filter(function (w) { return S.picks.indexOf(w) >= 0 || P.pred(w); }).forEach(function (w) {
      var b = el('div', 'cand');
      b.dataset.w = w;
      var box = el('span', 'box');
      box.innerHTML = ic('check_circle', { size: 25 });
      b.appendChild(box);
      b.appendChild(document.createTextNode(w));
      markTile(b);
      // one word between you and the case: point at it, twice, then stop
      if (near && b.classList.contains('missed')) b.classList.add('aim');
      list.appendChild(b);
    });
    wrap.appendChild(list);

    // the sentence you say out loud — names the word that decided it
    wrap.appendChild(stingLine(near));

    // ---- THE REVEAL ----
    var rev = el('div', 'reveal');
    var kick = el('div', 'kick');
    kick.innerHTML = ic('fingerprint', { size: 15, fill: 1 }) + 'The rule' +
                     '<i class="ln"></i><span class="who">Case ' + DAY + '</span>';
    rev.appendChild(kick);

    // "…: Q W E R T / A S D F G" reads far better as a headline plus a key strip
    var m = /^(.*?):\s*([A-Z][A-Z\s/]*)\.?$/.exec(P.rule);
    var headText = m ? m[1] + '.' : P.rule;
    // a long rule steps down a size instead of eating the whole card
    rev.appendChild(el('div', 'headline' + (headText.length > 52 ? ' long' : ''), headText));
    if (m) {
      var keys = el('div', 'rulekeys');
      m[2].trim().split(/\s+/).forEach(function (k) {
        keys.appendChild(el('span', k === '/' ? 'sep' : null, k));
      });
      rev.appendChild(keys);
    }
    rev.appendChild(el('p', 'detail', P.detail));

    var seen = {};
    var yes = [], no = [];
    function add(w, src) {
      if (seen[w]) return;
      seen[w] = 1;
      (P.pred(w) ? yes : no).push([w, src]);
    }
    P.pass.forEach(function (w) { add(w, 'opener'); });
    P.fail.forEach(function (w) { add(w, 'opener'); });
    S.probes.forEach(function (p) { if (p.ok !== null) add(p.w, 'probe'); });
    CANDS.forEach(function (w) { add(w, 'call'); });

    rev.appendChild(evGroup('', 'check_circle', 'Obeys it', yes));
    rev.appendChild(evGroup('bad', 'cancel', 'Breaks it', no));
    wrap.appendChild(rev);

    /* From here down this screen runs the suite's tail, in the suite's order:
       the stats, the share block, the share button, the way on to the next
       puzzle. The Rule is the one game whose result is the page rather than a
       bottom sheet — the case does not leave the bench, it closes on it — so
       there is no "back to the board" at the end of it; everything the board
       held is already printed above. The numbers themselves are the lab
       record's, so the reading here and the reading behind the bar button can
       never disagree. */
    var rec = stats();
    var srow = el('div', 'statrow');
    var hits = (S.hits == null) ? (S.won ? 3 : 0) : S.hits;
    srow.innerHTML =
      '<div class="stat"><span class="n">' + used + '</span><span class="l">Probes</span></div>' +
      '<div class="stat"><span class="n">' + hits + '/3</span><span class="l">Correct</span></div>' +
      '<div class="stat"><span class="n">' + (rec.best === null ? '–' : rec.best) +
        '</span><span class="l">Fewest</span></div>';
    wrap.appendChild(srow);

    // what you will actually paste
    var sg = el('div', 'sharegrid');
    sg.textContent = shareText();
    wrap.appendChild(sg);

    var sh = el('button', 'btn primary wide');
    sh.type = 'button';
    sh.id = 'shareBtn';
    sh.innerHTML = ic('share', { size: 19 }) +
      (S.won ? 'Share the flex' : (near ? 'Share the near miss' : 'Share the damage'));
    sh.addEventListener('click', function () {
      hap('pick');
      /* The button is handed over: Kit.share restores the label with innerHTML
         so the symbol survives, and paints the confirmation from what actually
