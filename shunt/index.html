      el.querySelector('#rsY').addEventListener('click',()=>{
        const spent=S.moves, resets=(S.resets||0)+1, hist=S.hist, trail=S.trail;
        S=freshState(); S.puz=puz.start;
        /* A reset spends no move, so it leaves no square: the trail carries
           over untouched or trail.length-1 would drift past S.moves. */
        S.moves=spent; S.resets=resets; S.hist=hist.concat([puz.start]); S.trail=trail;
        save(); kbMode=false; board.classList.remove('kb'); prevMask=null; render();
        /* the tray is re-loaded: the same sixteen beads dropped back in.
           prevMask was cleared above so no row reads this as "you broke it" —
           the lamps still go out one by one, which is the honest signal. */
        replay(board,'boot');
        setTimeout(()=>board.classList.remove('boot'), 1000);
        Kit.haptic(HAP.reset);
        close(); Kit.toast('Letters reset · '+(CAP-S.moves)+' moves left');
        paintTray(); say('Letters reset. '+statusTail());
        checkEnd();
      });
    }});
});
document.getElementById('showres').addEventListener('click', endScreen);

/* The line under the tray is a coach, not a readout: the cluster owns the
   numbers, so this stays quiet until it has something to say. */
const hintEl=document.getElementById('hint');
let lastHint=null;
/* render() runs every frame of a drag; rewriting this line every frame was a
   DOM mutation per frame for identical text. Only real changes touch the DOM,
   and when they do the new line rises in rather than swapping. */
function setHint(html){
  if(html===lastHint) return;
  lastHint=html;
  hintEl.innerHTML = html ? `<span class="hw">${html}</span>` : '';
}
function updateHint(){
  /* No wall and no clock: the result card is one tap away and it hands you the
     next tray, so this line points at it rather than at midnight. */
  if(S.done){ setHint(S.done.win? 'Solved. <b>Result</b> has the next puzzle.'
                                : 'Out of moves. <b>Result</b> has the next puzzle.'); return; }
  const left=CAP-S.moves;
  const n=popcount(litMask(S.grid));
  if(left<=3) setHint(`<b>${left} move${left===1?'':'s'} left.</b>`);
  else if(n===3) setHint(`<b>Three rows lit.</b> Now don't break them.`);
  else if(S.moves===0) setHint(cueOn ? CUE : 'Push any row or column — letters wrap');
  else if(left<=5) setHint(`${left} moves left`);
  else setHint('');
}
const _render=render;
render=function(){ _render(); updateHint(); };

/* ---- first-move cue: a self-explanatory game still needs one nudge ---- */
const CUE = '<span class="swipehint">'+Kit.icon('swipe',{size:14,fill:1,wght:600})+'push a row</span>';
let cueOn=false;
function showCue(){ if(S.moves>0||S.done) return; cueOn=true; updateHint(); }
function killCue(){ if(cueOn){ cueOn=false; updateHint(); } }

/* ---- onboarding: three coach marks, one sentence each ---- */
function startTour(){
  Kit.tour([
    { el:board, text:'Drag any <b>row</b> sideways, or any <b>column</b> up and down. Letters wrap: what leaves one edge arrives at the other.' },
    { sel:'.cluster .gauge.right', place:'below', pad:8, round:11,
      text:'A row that spells a word <b>lights its lamp</b>. Get all four lit at once.' },
    { sel:'.cluster .railwrap', place:'below', pad:9, round:11,
      text:'Every push spends a move. The notch is <b>par</b> — the fewest that can possibly work. The far end is where the tray jams.' }
  ], { doneLabel:'Play', onDone(){ showCue(); } });
}

/* boot */
document.getElementById('pno').textContent = 'No. '+DAY;
document.getElementById('pPar').textContent = puz.par;
const PARPCT = (puz.par/CAP*100).toFixed(2)+'%';
document.getElementById('railPar').style.left  = PARPCT;
document.getElementById('scalePar').style.left = PARPCT;
document.getElementById('railFill').style.width = PARPCT;   // scaled, never resized
document.getElementById('railOver').style.left = PARPCT;
document.getElementById('railOver').style.width = (100-puz.par/CAP*100).toFixed(2)+'%';
document.querySelector('.rail').style.setProperty('--dz', ((CAP-3)/CAP*100).toFixed(2)+'%');
new ResizeObserver(measure).observe(board);
measure();
paintTray();                                 // the tray is readable from move 0
/* sixteen beads dropped into the recess on a diagonal — the tray asserting
   that it is full of loose parts before a word of instruction */
board.classList.add('boot');
setTimeout(()=>board.classList.remove('boot'), 1200);
if(S.done){
  if(!S.done.win && (S.done.best===null||S.done.best===undefined)){ S.done.best=closestApproach(); save(); }
  if(S.done.win) setClosed(false); else setJam(false);
  document.getElementById('showres').style.display='';
  document.getElementById('restart').style.display='none';
  setTimeout(endScreen, 620);           // a finished day reopens its card
} else if(Kit.once('shunt:tour')){
  setTimeout(startTour, 780);
} else {
  setTimeout(showCue, 1000);
}
board.addEventListener('pointerdown', killCue, {once:true});
window.addEventListener('load', measure);
})();
</script>
</body>
</html>
