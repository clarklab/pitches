<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SHUNT — Superfun Daily</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
:root{
  --accent:#c2410c; --accent-soft:#fbe4d5; --accent-ink:#fff;
  --accent-2:#9a3412;
  --rail:rgba(23,22,26,.055);
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#f0762f; --accent-soft:#3a1c0d; --accent-ink:#1a0d05; --accent-2:#ffa15e;
         --rail:rgba(255,255,255,.05); }
}
:root[data-theme="dark"]{ --accent:#f0762f; --accent-soft:#3a1c0d; --accent-ink:#1a0d05; --accent-2:#ffa15e; --rail:rgba(255,255,255,.05); }
:root[data-theme="light"]{ --accent:#c2410c; --accent-soft:#fbe4d5; --accent-ink:#fff; --accent-2:#9a3412; --rail:rgba(23,22,26,.055); }

body{ overscroll-behavior:none; }
.app{ touch-action:manipulation; }

/* ---------- type re-tune for Google Sans Flex ---------- */
.bar h1{
  font-weight:800; letter-spacing:.20em; font-size:19px;
  text-indent:.20em;                       /* optically re-centre the tracking */
  line-height:1.1;
}
.bar .puzz-no{ display:block; margin-top:1px; font-weight:500; }
.sheet h2, .verdict{ font-weight:800; letter-spacing:-.028em; }
.prompt .k{ font-weight:800; letter-spacing:.14em; }
.prompt .v{ font-size:14px; line-height:1.5; }
.stat .n{ font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }

/* ---------- status strip ---------- */
.status{ display:flex; align-items:stretch; gap:8px; }
.pip{
  flex:1; background:var(--white); border:1px solid var(--line); border-radius:var(--r-sm);
  padding:8px 4px 7px; text-align:center; min-width:0;
  box-shadow:var(--shadow-1);
  transition:border-color .2s, box-shadow .2s;
}
.pip .n{
  font-family:var(--font-display); font-size:21px; font-weight:800;
  display:block; line-height:1.05; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  transition:color .2s;
}
.pip .n .sub{ font-size:13px; font-weight:600; color:var(--ink-3); letter-spacing:0; }
.pip .l{ font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); white-space:nowrap; }
.pip.hot{ border-color:var(--accent); }
.pip.hot .n{ color:var(--accent); }
.pip.danger{ border-color:var(--bad); }
.pip.danger .n{ color:var(--bad); }

/* ---------- grid + edge arrows ---------- */
.gridwrap{
  --arr: 30px;
  width:100%; max-width:392px; margin:0 auto;
  display:grid;
  grid-template-columns:var(--arr) minmax(0,1fr) var(--arr);
  grid-template-rows:var(--arr) auto var(--arr);
  align-items:center; justify-items:center;
  user-select:none; -webkit-user-select:none;
}
@media (min-width:620px){ .gridwrap{ --arr:38px; max-width:440px; } }

.strip{ display:grid; gap:var(--gap,6px); width:100%; height:100%; }
.strip.h{ grid-template-columns:repeat(4,1fr); padding:0 calc(var(--gap,6px)/2); }
.strip.v{ grid-template-rows:repeat(4,1fr); padding:calc(var(--gap,6px)/2) 0; }

.arr{
  appearance:none; border:0; background:transparent; padding:0; margin:0;
  display:grid; place-items:center; cursor:pointer; color:var(--ink-3);
  border-radius:var(--r-pill); position:relative; width:100%; height:100%;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:color .15s, background .15s, transform .12s cubic-bezier(.22,1,.36,1);
}
.arr::after{ content:""; position:absolute; inset:-8px; } /* enlarge hit area to >=44px */
.arr svg{ width:15px; height:15px; display:block; }
@media (hover:hover){ .arr:hover{ color:var(--accent); background:var(--accent-soft); } }
.arr:active{ transform:scale(.82); color:var(--accent); }
.arr.armed{ color:var(--accent); }
.arr.armed::before{
  content:""; position:absolute; inset:20%; border-radius:var(--r-pill);
  background:var(--accent); opacity:.14;
}

/* ---------- the board: a shallow tray the beads slide inside ---------- */
.board{
  position:relative; width:100%; aspect-ratio:1/1;
  background:
    linear-gradient(var(--rail) 1.5px, transparent 1.5px) 0 var(--half,50%) / 100% var(--step,25%),
    linear-gradient(90deg, var(--rail) 1.5px, transparent 1.5px) var(--half,50%) 0 / var(--step,25%) 100%,
    var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--r);
  overflow:hidden;
  box-shadow:
    inset 0 0 0 1px rgba(23,22,26,.035),
    inset 0 2px 6px rgba(23,22,26,.07),
    inset 0 -2px 6px rgba(23,22,26,.045);
  touch-action:none;
  cursor:grab;
  transition:box-shadow .2s;
}
:root[data-theme="dark"] .board{ box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), inset 0 2px 8px rgba(0,0,0,.5), inset 0 -2px 8px rgba(0,0,0,.35); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .board{ box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), inset 0 2px 8px rgba(0,0,0,.5), inset 0 -2px 8px rgba(0,0,0,.35); } }
.board.dragging{ cursor:grabbing; }

/* the wrap gutters: the two edges of the lane you are currently sliding.
   They light up together so the tile leaving one is visibly the one arriving
   at the other. */
.gut{
  position:absolute; pointer-events:none; opacity:0; z-index:4;
  transition:opacity .14s;
}
.gut.on{ opacity:1; }
.gut.l{ left:0; top:0; bottom:0; width:16px; background:linear-gradient(90deg, var(--accent) , transparent); }
.gut.r{ right:0; top:0; bottom:0; width:16px; background:linear-gradient(270deg, var(--accent), transparent); }
.gut.t{ top:0; left:0; right:0; height:16px; background:linear-gradient(180deg, var(--accent), transparent); }
.gut.b{ bottom:0; left:0; right:0; height:16px; background:linear-gradient(0deg, var(--accent), transparent); }
.gut{ mix-blend-mode:normal; }
.gut.on{ opacity:.20; }

/* row highlight band */
.band{
  position:absolute; left:2px; right:2px; border-radius:10px;
  border:1.5px solid transparent; pointer-events:none;
  transition:background .2s ease, border-color .2s ease, box-shadow .25s ease;
}
.band.on{
  background:var(--accent-soft);
  border-color:color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow:0 0 0 1px var(--accent-soft), 0 0 18px -3px var(--accent);
}
.band.armed{ background:color-mix(in srgb, var(--ink) 5%, transparent); }
@keyframes litpulse{ 0%{ box-shadow:0 0 0 1px var(--accent-soft), 0 0 0 0 var(--accent) } 55%{ box-shadow:0 0 0 2px var(--accent-soft), 0 0 26px 2px var(--accent) } 100%{ box-shadow:0 0 0 1px var(--accent-soft), 0 0 18px -3px var(--accent) } }
.band.on.justlit{ animation:litpulse .5s ease-out; }

/* column arm highlight */
.carm{ position:absolute; top:2px; bottom:2px; border-radius:10px; pointer-events:none;
  background:color-mix(in srgb, var(--ink) 5%, transparent); opacity:0; transition:opacity .15s; }
.carm.on{ opacity:1; }

/* ---------- the beads ---------- */
.tl{
  position:absolute; top:0; left:0; display:grid; place-items:center;
  background:var(--white); border:1px solid var(--line-2);
  border-radius:9px; font-family:var(--font-tile); font-weight:800;
  letter-spacing:-.01em; text-transform:uppercase; color:var(--ink);
  will-change:transform; pointer-events:none; z-index:2;
  box-shadow:var(--shadow-1), inset 0 0 0 1px rgba(255,255,255,.7);
  transition:background .2s, border-color .2s, color .2s, box-shadow .2s;
}
:root[data-theme="dark"] .tl{ box-shadow:var(--shadow-1), inset 0 0 0 1px rgba(255,255,255,.05); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tl{ box-shadow:var(--shadow-1), inset 0 0 0 1px rgba(255,255,255,.05); } }
.tl.on{
  border-color:color-mix(in srgb, var(--accent) 65%, transparent);
  color:var(--accent); background:var(--accent-soft);
}
/* the lane under your finger is lifted off the tray */
.tl.live{ box-shadow:var(--shadow-2), inset 0 0 0 1px rgba(255,255,255,.7); z-index:3; }
:root[data-theme="dark"] .tl.live{ box-shadow:var(--shadow-2), inset 0 0 0 1px rgba(255,255,255,.07); }
/* the bead currently straddling the wrap seam */
.tl.wrapping{ border-color:var(--accent); border-style:dashed; }
.tl.cursor{ box-shadow:var(--shadow-1), 0 0 0 3px var(--accent); z-index:4; }
.tl.snapping{ transition:transform .17s cubic-bezier(.22,1,.36,1), background .2s, border-color .2s, color .2s, box-shadow .2s; }

.board.kb{ box-shadow:
    inset 0 0 0 1px rgba(23,22,26,.035),
    inset 0 2px 6px rgba(23,22,26,.07),
    0 0 0 3px var(--accent-soft); }

/* first-run swipe cue */
.swipehint{
  position:absolute; z-index:5; pointer-events:none;
  display:flex; align-items:center; gap:5px;
  padding:4px 11px 4px 8px; border-radius:var(--r-pill);
  background:var(--accent); color:var(--accent-ink);
  font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  box-shadow:var(--shadow-2);
  animation:sw 2.4s cubic-bezier(.5,0,.5,1) infinite;
}
.swipehint svg{ width:13px; height:13px; }
@keyframes sw{ 0%,100%{transform:translateX(-16px);opacity:.35} 45%,55%{transform:translateX(18px);opacity:1} }

/* ---------- footer ---------- */
.hintline{ text-align:center; font-size:12.5px; color:var(--ink-3); min-height:19px; }
.hintline b{ color:var(--accent); font-weight:700; }
.actions{ display:flex; gap:8px; }

.wordlist{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0 2px; }
.wordlist span{
  font-family:var(--font-mono); font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  background:var(--accent-soft); color:var(--accent); border-radius:var(--r-pill);
  padding:5px 12px; font-weight:700;
  animation:pop .3s ease-out backwards;
}
.wordlist span:nth-child(2){ animation-delay:.06s }
.wordlist span:nth-child(3){ animation-delay:.12s }
.wordlist span:nth-child(4){ animation-delay:.18s }

.solrow{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); margin:5px 0; }
.solrow .bar-{ flex:1; height:8px; background:var(--paper-2); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
.solrow .bar- i{ display:block; height:100%; background:var(--line-2); border-radius:99px; }
.solrow.you .bar- i{ background:var(--accent); }
.solrow.you{ color:var(--ink); font-weight:700; }
.solrow .pct{ font-family:var(--font-mono); font-size:11.5px; width:42px; text-align:right; color:var(--ink-3); }
.solrow .nm{ width:74px; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; }
.seclbl{ margin:16px 0 6px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:800; }

.demo{ font-family:var(--font-mono); font-size:12.5px; line-height:1.55; background:var(--paper-2);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 13px; white-space:pre; overflow-x:auto; }
.demo b{ color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="iconbtn" id="theme" aria-label="Toggle theme" title="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div style="flex:1;min-width:0;text-align:center">
      <h1>Shunt</h1>
      <span class="puzz-no" id="pno"></span>
    </div>
    <button class="iconbtn" id="help" aria-label="How to play" title="How to play">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.4"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="prompt">
    <span class="k">Objective</span>
    <span class="v" id="obj">Slide rows and columns until <b>all four rows</b> spell words. Everything wraps.</span>
  </div>

  <div class="stage">
    <div class="status">
      <div class="pip"><span class="n" id="pMoves">0</span><span class="l">Moves</span></div>
      <div class="pip"><span class="n" id="pPar">6</span><span class="l">Par</span></div>
      <div class="pip" id="pLitWrap"><span class="n" id="pLit">0<span style="font-size:13px;color:var(--ink-3)">/4</span></span><span class="l">Rows lit</span></div>
    </div>

    <div class="gridwrap" id="gw">
      <div></div>
      <div class="strip h" id="sUp"></div>
      <div></div>
      <div class="strip v" id="sLeft"></div>
      <div class="board" id="board" tabindex="0" role="application"
           aria-label="4 by 4 letter grid. Click a tile then use arrow keys to slide its row or column."></div>
      <div class="strip v" id="sRight"></div>
      <div></div>
      <div class="strip h" id="sDown"></div>
      <div></div>
    </div>

    <div class="hintline" id="hint"></div>
    <div class="actions">
      <button class="btn ghost sm" id="restart" style="flex:1">Reset the letters</button>
      <button class="btn sm" id="showres" style="flex:1;display:none">Result</button>
    </div>
    <p class="sr" id="live" role="status" aria-live="polite"></p>
  </div>

  <div id="kbd"></div>
</div>

<script src="../shared/lex4.js"></script>
<script src="../shared/kit.js"></script>
<script src="puzzles.js"></script>
<script>
(function(){
'use strict';
const LEX = window.LEX4;
const P = window.SHUNT_PUZZLES;

/* ======================================================================
   board model — 16 chars, row major. moves 0..15:
   0..7  rows  : r*2 + (0 = left, 1 = right)
   8..15 cols  : c*2 + (0 = up,   1 = down)
   ====================================================================== */
const PERM = (function(){
  const out=[];
  for(let m=0;m<16;m++){
    const p=new Array(16);
    const isRow=m<8, idx=(m>>1)&3, back=(m&1)===1;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      let sr=r, sc=c;
      if(isRow && r===idx) sc=(c + (back?3:1))%4;
      if(!isRow && c===idx) sr=(r + (back?3:1))%4;
      p[r*4+c]=sr*4+sc;
    }
    out.push(p);
  }
  return out;
})();
function applyMove(b,m){ const p=PERM[m],o=new Array(16); for(let i=0;i<16;i++)o[i]=b[p[i]]; return o; }
function shiftLane(b,isRow,idx,k){ // k = signed steps, +1 = right/down
  let o=b.slice(); k=((k%4)+4)%4;
  for(let t=0;t<k;t++) o=applyMove(o, isRow ? idx*2+1 : 8+idx*2+1);
  return o;
}
const key=b=>b.join('');
const rowStr=(b,r)=>b.slice(r*4,r*4+4).join('');
const isWord=w=>LEX.has(w);
function litMask(b){ let m=0; for(let r=0;r<4;r++) if(isWord(rowStr(b,r))) m|=1<<r; return m; }
const popcount=m=>((m>>0&1)+(m>>1&1)+(m>>2&1)+(m>>3&1));
const solved=b=>litMask(b)===15;

/* How close did the player EVER get? One multi-source BFS out of every board
   they visited at once — the first depth at which any of those frontiers
   touches an all-words board is, by definition, their closest approach.
   Doing it as a single shared search instead of one BFS per board keeps it
   under ~100ms instead of freezing the phone for two seconds. */
function closestApproachOf(boards,cap){
  let seen=new Set(), front=[];
  for(const b of boards){
    const k=key(b); if(seen.has(k)) continue; seen.add(k);
    if(solved(b)) return 0;
    front.push(b);
  }
  for(let d=1;d<=cap;d++){
    const nf=[];
    for(const s of front) for(let m=0;m<16;m++){
      const n=applyMove(s,m), k=key(n);
      if(seen.has(k)) continue; seen.add(k);
      if(solved(n)) return d;
      nf.push(n);
    }
    front=nf;
  }
  return cap+1;
}

/* ======================================================================
   puzzle selection + persistence
   ====================================================================== */
const puz = Kit.pick(P);
const DAY = Kit.dayNumber();
const CAP = puz.par + 8;                       // hard move limit -> lose state
const store = Kit.store('shunt');
const seenStore = Kit.store('shunt:seen');

let S = null; // session state

function freshState(){
  return { day:DAY, grid:puz.start.split(''), moves:0, resets:0,
           trail:[litMask(puz.start.split(''))], hist:[puz.start], done:null };
}
/* closest the player ever got, measured once at the end */
function closestApproach(){
  return closestApproachOf(S.hist.map(h=>h.split('')), 4);
}
(function load(){
  const s = store.get();
  if(s && s.day===DAY && s.puz===puz.start){ S = s; }
  else { S = freshState(); S.puz = puz.start; }
})();
function save(){ store.set(S); }

/* ======================================================================
   layout
   ====================================================================== */
const board = document.getElementById('board');
const gw = document.getElementById('gw');
const live_ = document.getElementById('live');
let STEP=0, TILE=0, GAP=6;

const bands=[], carms=[], guts={};
for(let r=0;r<4;r++){
  const b=document.createElement('div'); b.className='band'; board.appendChild(b); bands.push(b);
}
for(let c=0;c<4;c++){
  const a=document.createElement('div'); a.className='carm'; board.appendChild(a); carms.push(a);
}
['l','r','t','b'].forEach(k=>{
  const g=document.createElement('div'); g.className='gut '+k; board.appendChild(g); guts[k]=g;
});
/* Each letter gets THREE bodies: the real one and a copy one board-width to
   either side. Whichever copy is on screen IS the letter — that is what makes
   a bead leaving the right edge legibly the same bead arriving on the left,
   and it means a snap never has to teleport across a modulo seam. */
const CELLS=[];
for(let i=0;i<16;i++){
  const trio=[];
  for(let k=0;k<3;k++){ const t=document.createElement('div'); t.className='tl'; board.appendChild(t); trio.push(t); }
  CELLS.push(trio);
}

function measure(){
  const w = board.clientWidth;
  if(!w) return;
  GAP = Math.max(4, Math.round(w*0.024));
  STEP = w/4;
  TILE = STEP - GAP;
  gw.style.setProperty('--gap', GAP+'px');
  board.style.setProperty('--step', STEP+'px');
  board.style.setProperty('--half', (STEP/2)+'px');
  const fs = Math.round(TILE*0.52);
  for(const trio of CELLS) for(const t of trio){
    t.style.width=TILE+'px'; t.style.height=TILE+'px'; t.style.fontSize=fs+'px';
  }
  bands.forEach((b,r)=>{ b.style.height=(TILE+5)+'px'; b.style.top=(r*STEP+GAP/2-2.5)+'px'; });
  carms.forEach((a,c)=>{ a.style.width=(TILE+5)+'px'; a.style.left=(c*STEP+GAP/2-2.5)+'px'; });
  render();
}
const slotX=c=>c*STEP+GAP/2, slotY=r=>r*STEP+GAP/2;

/* ======================================================================
   render
   ====================================================================== */
let drag=null;      // {isRow, idx, off, preview, steps}
let cursor={r:0,c:0}, kbMode=false;
let prevMask=null;

function render(){
  const base = S.grid;
  const view = drag ? drag.preview : base;
  const mask = litMask(view);
  const P4 = 4*STEP;
  const live = drag && !drag.settled;

  for(let i=0;i<16;i++){
    const r=i>>2, c=i&3;
    const letter = base[i];
    let x=slotX(c), y=slotY(r), inLane=false, litRow=r;

    if(drag){
      if(drag.isRow && r===drag.idx){ x = slotX(c) + drag.off; inLane=true; }
      else if(!drag.isRow && c===drag.idx){
        y = slotY(r) + drag.off; inLane=true;
        litRow = (((r + drag.steps)%4)+4)%4;   // where this bead lands on snap
      }
    }
    const on = (mask>>litRow & 1)===1;
    const trio = CELLS[i];
    /* copy 0 is the letter itself; 1 and 2 are its wrap-around twins. Only a
       lane that is actually moving needs its twins drawn. */
    for(let k=0;k<3;k++){
      const t=trio[k];
      if(k>0 && !inLane){ if(t.style.display!=='none') t.style.display='none'; continue; }
      const off = k===0 ? 0 : (k===1 ? -P4 : P4);
      const tx = drag && drag.isRow && inLane ? x+off : x;
      const ty = drag && !drag.isRow && inLane ? y+off : y;
      if(k>0){
        const outside = drag.isRow ? (tx+TILE < -2 || tx > P4+2) : (ty+TILE < -2 || ty > P4+2);
        if(outside){ if(t.style.display!=='none') t.style.display='none'; continue; }
        if(t.style.display==='none') t.style.display='';
      }
      if(t.textContent!==letter) t.textContent=letter;
      t.classList.toggle('on', on);
      t.classList.toggle('live', !!live && inLane);
      t.classList.toggle('cursor', k===0 && kbMode && cursor.r===r && cursor.c===c && !drag);
      t.style.transform = `translate(${tx}px,${ty}px)`;
    }
    /* the bead straddling the seam: one of its bodies is on the board and
       another is visible too — mark them so the eye pairs them up */
    const seam = inLane && trio[1].style.display==='' || inLane && trio[2].style.display==='';
    for(let k=0;k<3;k++) trio[k].classList.toggle('wrapping', !!seam);
  }

  bands.forEach((b,r)=>{
    const on=(mask>>r&1)===1;
    if(on && prevMask!==null && !((prevMask>>r)&1)) { b.classList.remove('justlit'); void b.offsetWidth; b.classList.add('justlit'); }
    b.classList.toggle('on', on);
    b.classList.toggle('armed', kbMode && !drag && cursor.r===r);
  });
  prevMask = mask;
  carms.forEach((a,c)=> a.classList.toggle('on', kbMode && !drag && cursor.c===c));

  const gOn = live && drag.off!==0;
  guts.l.classList.toggle('on', !!gOn && drag.isRow);
  guts.r.classList.toggle('on', !!gOn && drag.isRow);
  guts.t.classList.toggle('on', !!gOn && !drag.isRow);
  guts.b.classList.toggle('on', !!gOn && !drag.isRow);

  document.getElementById('pMoves').textContent = S.moves;
  const n = popcount(mask);
  document.getElementById('pLit').innerHTML = n+'<span class="sub">/4</span>';
  document.getElementById('pLitWrap').classList.toggle('hot', n>=3);
  const left = CAP - S.moves;
  const mp = document.querySelector('.status .pip');
  mp.classList.toggle('danger', !S.done && left<=3);
  live_.textContent = S.done ? '' : `${n} of 4 rows spell words. ${left} moves left.`;

  document.querySelectorAll('.arr').forEach(a=>{
    a.classList.toggle('armed', kbMode && !drag && (
      (a.dataset.kind==='row' && +a.dataset.idx===cursor.r) ||
      (a.dataset.kind==='col' && +a.dataset.idx===cursor.c)));
  });
}

/* ======================================================================
   committing a move
   ====================================================================== */
let busy=false;
function doSlide(isRow, idx, k){
  if(busy || S.done) return;
  k = ((k%4)+4)%4; if(k===0) return;
  const cost = Math.min(k, 4-k);            // 3 steps one way == 1 the other
  const signed = k<=2 ? k : k-4;
  const before = litMask(S.grid);
  const after  = shiftLane(S.grid, isRow, idx, signed);
  /* Snap from wherever the beads currently are to the committed slot. Because
     the lane is drawn with its wrap-twins rather than a modulo, this is always
     a short continuous glide — never a jump back across the board. */
  const lane = tilesInLane(isRow, idx);
  lane.forEach(t=>t.classList.add('snapping'));
  drag = { isRow, idx, off:signed*STEP, steps:signed, preview:after, settled:true };
  render();
  busy=true;
  setTimeout(()=>{
    lane.forEach(t=>t.classList.remove('snapping'));
    drag=null;
    S.grid = after; S.moves += cost;
    const m = litMask(after);
    S.trail.push(m); S.hist.push(key(after));
    render();
    busy=false;
    Kit.haptic(8);
    if(popcount(m)>popcount(before)) Kit.haptic(18);
    save();
    checkEnd();
  }, 175);
}
function tilesInLane(isRow, idx){
  const out=[];
  for(let i=0;i<16;i++){ const r=i>>2,c=i&3; if(isRow? r===idx : c===idx) out.push(...CELLS[i]); }
  return out;
}

function checkEnd(){
  if(S.done) return;
  if(solved(S.grid)){ S.done={win:true, moves:S.moves, best:0}; save(); setTimeout(()=>endScreen(),420); return; }
  if(S.moves>=CAP){ S.done={win:false, moves:S.moves, best:closestApproach()}; save(); setTimeout(()=>endScreen(),420); }
}

/* ======================================================================
   pointer drag
   ====================================================================== */
let pd=null, rafId=0;
board.addEventListener('pointerdown', e=>{
  if(busy || S.done) return;
  const rect=board.getBoundingClientRect();
  const px=e.clientX-rect.left, py=e.clientY-rect.top;
  const c=Math.max(0,Math.min(3,Math.floor(px/STEP))), r=Math.max(0,Math.min(3,Math.floor(py/STEP)));
  pd={ x:e.clientX, y:e.clientY, r, c, axis:null, id:e.pointerId, moved:false };
  cursor={r,c};
  try{ board.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
board.addEventListener('pointermove', e=>{
  if(!pd || e.pointerId!==pd.id) return;
  const dx=e.clientX-pd.x, dy=e.clientY-pd.y;
  if(!pd.axis){
    if(Math.abs(dx)<5 && Math.abs(dy)<5) return;
    pd.axis = Math.abs(dx)>Math.abs(dy) ? 'h' : 'v';
    board.classList.add('dragging');
    if(kbMode){ kbMode=false; board.classList.remove('kb'); }
  }
  pd.moved=true;
  const isRow = pd.axis==='h';
  const P4 = 4*STEP;
  /* Reduce the raw finger travel into (-2, +2] cells. A drag of 3 cells one
     way IS a drag of 1 cell the other; showing it that way keeps the beads
     under the thumb and keeps the snap short. */
  let off = isRow ? dx : dy;
  off = off - Math.round(off/P4)*P4;
  const steps = Math.round(off/STEP);
  const idx = isRow ? pd.r : pd.c;
  const prev = drag ? drag.mask : -1;
  const preview = shiftLane(S.grid, isRow, idx, steps);
  drag = { isRow, idx, off, steps, preview, mask:litMask(preview) };
  if(prev>=0 && drag.mask!==prev && popcount(drag.mask)>popcount(prev)) Kit.haptic(14);
  if(!rafId) rafId = requestAnimationFrame(()=>{ rafId=0; if(drag) render(); });
});
function endDrag(e){
  if(!pd || (e && e.pointerId!==pd.id)) return;
  board.classList.remove('dragging');
  if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
  const d=drag; pd=null;
  if(!d){ // tap: park the lane cursor here, ready for the arrow keys
    kbMode=true; board.classList.add('kb');
    try{ board.focus({preventScroll:true}); }catch(err){}
    render(); return;
  }
  drag=null;
  const k=d.steps;
  if(k===0){
    /* released short of a cell — glide the beads home rather than cut */
    const lane=tilesInLane(d.isRow,d.idx);
    lane.forEach(t=>t.classList.add('snapping'));
    drag={ isRow:d.isRow, idx:d.idx, off:0, steps:0, preview:S.grid, settled:true };
    render();
    busy=true;
    setTimeout(()=>{ lane.forEach(t=>t.classList.remove('snapping')); drag=null; busy=false; render(); },190);
    return;
  }
  doSlide(d.isRow, d.idx, k);
}
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', endDrag);

/* ======================================================================
   edge arrow buttons
   ====================================================================== */
const SVG={
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};
function mkArrows(mount, dirName, kind){
  for(let i=0;i<4;i++){
    const b=document.createElement('button');
    b.className='arr'; b.type='button'; b.innerHTML=SVG[dirName];
    b.dataset.kind=kind; b.dataset.idx=i;
    const label = kind==='row' ? `Slide row ${i+1} ${dirName}` : `Slide column ${i+1} ${dirName}`;
    b.setAttribute('aria-label', label);
    b.addEventListener('click', ()=>{
      if(kind==='row'){ cursor.r=i; doSlide(true,i, dirName==='right'?1:-1); }
      else { cursor.c=i; doSlide(false,i, dirName==='down'?1:-1); }
    });
    mount.appendChild(b);
  }
}
mkArrows(document.getElementById('sUp'),'up','col');
mkArrows(document.getElementById('sDown'),'down','col');
mkArrows(document.getElementById('sLeft'),'left','row');
mkArrows(document.getElementById('sRight'),'right','row');

/* ======================================================================
   keyboard
   ====================================================================== */
document.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(document.querySelector('.scrim')) return;
  const k=e.key;
  const tag = e.target && e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(!/^Arrow/.test(k)) return;
  /* Tab is left alone on purpose — it has to keep reaching the help, theme and
     restart buttons. WASD is the second lane cursor for people who want it. */
  e.preventDefault();
  if(!kbMode){ kbMode=true; board.classList.add('kb'); render(); }
  if(e.shiftKey){
    if(k==='ArrowLeft') cursor.c=(cursor.c+3)%4;
    if(k==='ArrowRight') cursor.c=(cursor.c+1)%4;
    if(k==='ArrowUp') cursor.r=(cursor.r+3)%4;
    if(k==='ArrowDown') cursor.r=(cursor.r+1)%4;
    render(); return;
  }
  if(k==='ArrowLeft') doSlide(true,cursor.r,-1);
  if(k==='ArrowRight') doSlide(true,cursor.r,1);
  if(k==='ArrowUp') doSlide(false,cursor.c,-1);
  if(k==='ArrowDown') doSlide(false,cursor.c,1);
});
board.addEventListener('focus', ()=>{ kbMode=true; board.classList.add('kb'); render(); });
board.addEventListener('blur', ()=>{ kbMode=false; board.classList.remove('kb'); render(); });

/* ======================================================================
   end screen + share
   ====================================================================== */
/* One square per move: how many of the four rows were spelling words after it.
   0 ⬜  1 🟨  2 🟧  3 🟥 (the agonising one)  4 🟩.
   A │ is dropped in where par ran out, so "went long" is visible at a glance
   without ever naming a letter. */
const SQ=['⬜','🟨','🟧','🟥','🟩'];
function trailArt(){
  const sq = S.trail.slice(1).map(m=>SQ[popcount(m)]);
  if(sq.length>puz.par) sq.splice(puz.par,0,'│');
  let art = sq.join('');
  if(sq.length>16){                     // keep it inside one tweet line
    art = sq.slice(0,7).join('')+'…'+sq.slice(-8).join('');
  }
  return art;
}
function whichSolution(){ return puz.sols.findIndex(s=>s.b===key(S.grid)); }
const PCTS = puz.sols.map(s=>s.pct);
const RAREST = PCTS.filter(p=>p===Math.min(...PCTS)).length===1 ? Math.min(...PCTS) : -1;
const COMMONEST = PCTS.filter(p=>p===Math.max(...PCTS)).length===1 ? Math.max(...PCTS) : -1;
const isRarest = i => i>=0 && puz.sols.length>1 && puz.sols[i].pct===RAREST;
function awayText(n){ return n>4 ? '5+ moves' : (n===1 ? '1 move' : n+' moves'); }

function shareText(){
  const win = S.done && S.done.win;
  const head = `SHUNT #${DAY} · ${win? S.moves+' move'+(S.moves===1?'':'s') : 'out of moves'} (par ${puz.par})`;
  const art = trailArt();
  let line3;
  if(win){
    const i=whichSolution();
    if(i<0) line3 = `Found a way home the ${puz.sols.length}-solution map doesn't have`;
    else if(puz.sols.length===1) line3 = `The only solution · found it in ${S.moves}`;
    else {
      const s=puz.sols[i];
      const tag = isRarest(i) ? ' · the rare one'
                : (s.pct===COMMONEST ? ' · the popular one' : '');
      line3 = `Solution ${i+1} of ${puz.sols.length} · ${s.pct}% of par routes${tag}`;
    }
  } else {
    line3 = `Closest approach ${awayText(S.done.best)} · ${puz.sols.length} solution${puz.sols.length===1?'':'s'} were there`;
  }
  return `${head}\n${art}\n${line3}\nsfun.games/shunt`;
}

function endScreen(){
  const win = S.done.win;
  const i = win ? whichSolution() : -1;
  const rows=[0,1,2,3].map(r=>rowStr(S.grid,r).toUpperCase());
  let body='';
  if(win){
    body += `<div class="wordlist">${rows.map(w=>`<span>${w}</span>`).join('')}</div>`;
  }
  const stats = `<div class="statrow">
    <div class="stat"><span class="n">${S.moves}</span><span class="l">Moves</span></div>
    <div class="stat"><span class="n">${puz.par}</span><span class="l">Par</span></div>
    <div class="stat"><span class="n">${puz.sols.length}</span><span class="l">Solution${puz.sols.length===1?'':'s'}</span></div>
  </div>`;

  let solTable='';
  if(puz.sols.length>1){
    solTable = `<div class="seclbl">Every par-${puz.par} solution</div>` +
      puz.sols.map((s,n)=>`<div class="solrow ${n===i?'you':''}">
        <span class="nm">${n===i?'YOURS':'#'+(n+1)}</span>
        <span class="bar-"><i style="width:${Math.max(4,s.pct)}%"></i></span>
        <span class="pct">${s.pct}%</span></div>`).join('');
    solTable += `<div class="hint" style="margin-top:8px;text-align:left">Share of every shortest route that ends on each solution. ${
      isRarest(i) ? '<b style="color:var(--accent)">You found the rarest one.</b>'
      : (win ? 'Letters hidden — the others are still out there.' : 'None of them were letters you ever saw at once.')}</div>`;
  }

  let verdict, sub;
  if(win){
    const d=S.moves-puz.par;
    verdict = d<=0?'Par.':(d===1?'Bogey.':(d<=3?'Solved.':'Scrambled home.'));
    sub = d<=0? `${S.moves} moves — nobody could have done it in fewer.`
              : `${S.moves} moves · ${d} over par.`;
    if(i<0) sub += ' And you found a way home that par never touches.';
    if(S.resets) sub += ` (${S.resets} reset${S.resets>1?'s':''}.)`;
  } else {
    verdict='Out of moves.';
    const b=S.done.best;
    sub = b<=1 ? 'At your closest you were <b>one slide</b> from finishing.'
        : (b<=4 ? `Your closest approach was <b>${b} slides</b> from a solution.`
                : 'The board never came close to lining up.');
  }

  Kit.sheet(`
    <h2 class="verdict">${verdict}</h2>
    <p class="sub">${sub}</p>
    ${body}${stats}${solTable}
    <div class="sharegrid" id="sg">${Kit.esc(shareText())}</div>
    <button class="btn primary wide" id="shareBtn">Share result</button>
    <div class="hint" style="margin-top:12px">Next puzzle in <span id="cd" style="font-family:var(--font-mono)">--:--:--</span></div>
    <button class="btn ghost wide" data-close style="margin-top:10px">Close</button>
  `, { onOpen(el){
      const t=Kit.countdown(el.querySelector('#cd'));
      el.querySelector('#shareBtn').addEventListener('click', ev=> Kit.share(shareText(), ev.currentTarget));
      /* stop the clock when the sheet goes away (DOMNodeRemoved is dead) */
      const scrim=el.parentNode;
      const mo=new MutationObserver(()=>{ if(!scrim.isConnected){ clearInterval(t); mo.disconnect(); } });
      mo.observe(document.body,{childList:true});
  }});
  document.getElementById('showres').style.display='';
  document.getElementById('restart').style.display='none';
  updateHint();
}

/* ======================================================================
   help
   ====================================================================== */
const HELP = `
<ul style="padding-left:18px;margin:0 0 14px">
  <li><b>Every row must spell a 4-letter word.</b> All four at once.</li>
  <li><b>Push a row</b> sideways or <b>a column</b> up and down. Letters wrap round the edge — what leaves the right comes back on the left.</li>
  <li>A row that spells a word <b>lights up</b> — live, while your thumb is still moving.</li>
  <li>The catch: fixing row 3 with a column push will break row 1.</li>
  <li><b>No undo.</b> Pushing back is just another move. That is the whole cost.</li>
  <li>Score is <b>moves used against par</b>. Par is the true minimum — proven by exhaustive search, not a guess.</li>
  <li>There is usually <b>more than one solution</b>. The endgame tells you which one you found and how rare it is.</li>
</ul>
<div class="demo">push row 2 right →

 P L U M          P L U M
 A T E D    →    <b>D A T E</b>  ✓ lit
 R I C E          R I C E  ✓ lit
 N O S E          N O S E  ✓ lit</div>
<div class="hint" style="margin-top:10px;text-align:left">Desktop: drag with the mouse, or tap a tile and use the arrow keys. The chevrons round the grid work too. Shift+arrows moves the lane cursor without spending a move.</div>`;
document.getElementById('help').addEventListener('click', Kit.helpButton(HELP,'How to play'));

/* ======================================================================
   chrome
   ====================================================================== */
const themeBtn=document.getElementById('theme');
const tstore=Kit.store('theme');
if(tstore.get()) document.documentElement.dataset.theme=tstore.get();
themeBtn.addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme ||
    (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next; tstore.set(next);
});
document.getElementById('restart').addEventListener('click',()=>{
  if(S.done) return;
  S=freshState(); S.puz=puz.start; save(); kbMode=false; render(); updateHint();
  Kit.toast('Board reset');
});
document.getElementById('showres').addEventListener('click', endScreen);

function updateHint(){
  const h=document.getElementById('hint');
  if(S.done){ h.innerHTML = S.done.win? 'Solved. Come back tomorrow.' : 'Out of moves. Come back tomorrow.'; return; }
  const left=CAP-S.moves;
  const n=popcount(litMask(S.grid));
  if(n===3) h.innerHTML = `<b>Three rows lit.</b> ${left} moves left.`;
  else if(left<=3) h.innerHTML = `<b>${left} moves left.</b>`;
  else h.innerHTML = `${left} moves left · swipe a row or column`;
}
const _render=render;
render=function(){ _render(); updateHint(); };

/* first-visit help */
if(!seenStore.get()){ seenStore.set(1); setTimeout(()=>Kit.helpButton(HELP,'How to play')(),260); }

/* boot */
document.querySelector('.bar h1').insertAdjacentHTML('afterend','');
new ResizeObserver(measure).observe(board);
measure();
if(S.done) { document.getElementById('showres').style.display=''; document.getElementById('restart').style.display='none'; }
window.addEventListener('load', measure);
})();
</script>
</body>
