<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHAINS — compound-word golf</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../favicon.svg">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/icons.css">
<link rel="stylesheet" href="../shared/kit.css">
<link rel="stylesheet" href="font.css">
<style>
  /* ==================================================================
     CHAINS — the surface language is a golf club that has been there a
     hundred years: card stock, printed rules, engraved plates, a pencil
     score in the +/- column. Bottle green on warm cream.

     NB: any custom property set on :root here out-cascades the kit's own
     dark-mode block (both land on :root, ours is later), which is how the
     pin once lit up like mint paint on a black page. Every token below is
     therefore restated in ALL FOUR branches.
     ================================================================== */
  :root {
    --accent:#1c705a; --accent-soft:#d9ece5; --accent-ink:#fff;
    --accent-hi:#1c705a;
    --card:#fffefb; --card-2:#f4efe4;
    --rule:#e5ddcc; --rule-2:#c9c0ab;
    --plate:#ffffff; --plate-hi:rgba(255,255,255,.95); --plate-lo:rgba(23,22,26,.06);
    --good-hi:#2a7449; --warn-hi:#8a6208; --bad-hi:#b3402f;
    /* --warn-hi is the brass the pips, the card column and the glove are
       painted in, and it is tuned to sit on paper. The one place brass has to
       sit on BRASS is the tension line inside the warn row, where --warn-hi on
       --warn-soft is 3.56:1 — under AA for an 11.5px label. This is that one
       label's ink, dark enough to clear AA on the wash without dragging the
       rest of the brass down with it. Dark mode already clears (6.71:1), so
       there it is simply --warn-hi. */
    --warn-ink:#7f5600;

    --font-brand:'Fraunces', Georgia, 'Times New Roman', serif;
    --r-card:11px; --r-plate:8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent-soft:#17342c; --accent-hi:#6cc4a8;
      --card:#201f27; --card-2:#282730;
      --rule:#35323e; --rule-2:#4b4756;
      --plate:#26252e; --plate-hi:rgba(255,255,255,.05); --plate-lo:rgba(0,0,0,.28);
      --good-hi:#63c98a; --warn-hi:#e2b24a; --bad-hi:#ea7c68;
      --warn-ink:#e2b24a;
    }
  }
  :root[data-theme="dark"] {
    --accent-soft:#17342c; --accent-hi:#6cc4a8;
    --card:#201f27; --card-2:#282730;
    --rule:#35323e; --rule-2:#4b4756;
    --plate:#26252e; --plate-hi:rgba(255,255,255,.05); --plate-lo:rgba(0,0,0,.28);
    --good-hi:#63c98a; --warn-hi:#e2b24a; --bad-hi:#ea7c68;
    --warn-ink:#e2b24a;
  }
  :root[data-theme="light"] {
    --accent-soft:#d9ece5; --accent-hi:#1c705a;
    --card:#fffefb; --card-2:#f4efe4;
    --rule:#e5ddcc; --rule-2:#c9c0ab;
    --plate:#ffffff; --plate-hi:rgba(255,255,255,.95); --plate-lo:rgba(23,22,26,.06);
    --good-hi:#2a7449; --warn-hi:#8a6208; --bad-hi:#b3402f;
    --warn-ink:#7f5600;
  }

  /* Three voices, and they never swap jobs.
     Fraunces  — the words and the numbers that carry feeling.
     Sans      — labels, buttons, anything you read rather than feel.
     Mono      — what is printed: the spine, the card figures, the share.
     Fraunces is driven by 'opsz' throughout, not by size alone: high optical
     sizes for the wordmark and the verdict figures (thin hairlines, editorial
     contrast), low ones for the word plates and card figures (thicker, and
     legible at 12px). */

  /* ---------- the masthead ----------
     ONE control on each side, both exactly 44px, both with the same 8px gap:
     the flanks are balanced, so the flex centre of the lockup IS the centre of
     the bar rather than the centre of whatever space was left over. That is
     the whole reason there is only one utility here. A third button makes the
     right flank 96px against the left's 44, and at a 320px viewport the
     wordmark then has to shrink to about 15px to keep 12px clear of it —
     a cramped bar. The rules moved into the card and the result sheets
     instead; the tour still teaches the board on a first visit. */
  .bar {
    padding: 9px 0 8px; margin-bottom: 15px; gap: 8px;
    border-bottom: 1px solid var(--rule-2);
    box-shadow: 0 3px 0 -2px var(--rule);      /* the second, printed rule */
  }
  .lockup { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .lockup h1 {
    flex:0 0 auto; margin:0;
    font-family: var(--font-brand);
    font-variation-settings:'opsz' 144,'wght' 650;
    font-size: 21px; line-height: 1; letter-spacing:.17em; text-indent:.17em;
    text-transform: uppercase;
  }
  .lockup .pno {
    display:flex; align-items:center; gap:7px;
    font-family: var(--font-mono); font-size:10px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); line-height:1;
  }
  .lockup .pno::before, .lockup .pno::after {
    content:''; width:15px; height:1px; background:var(--rule-2);
  }

  /* ---------- layout ----------
     .app must be BOUNDED, not just min-height: an unbounded flex column grows
     past the viewport and pushes the keyboard's bottom row off a 390×844
     phone. Bounded, the scrolling course absorbs the overflow instead. */
  .app { height: 100dvh; padding-bottom: calc(10px + var(--safe-b)); }
  /* The board is one composition — chain, the run to the pin, the pin — and it
     is centred in whatever the card and the keyboard leave. It used to be
     top-anchored, which meant every pixel of slack on the screen was handed to
     the dashed run and nothing else: 261px of empty dashes on the opening
     board of a 390×844 phone. Centred, the run is capped (below) and the slack
     it no longer takes becomes air above and below the board. */
  .stage { justify-content: center; gap: 12px; min-height: 0; }

  /* ==================================================================
     THE CARD — one surface, two ruled rows. Top row is the round (tap it
     for the full card); bottom row is the lie you are standing on.
     ================================================================== */
  .scard {
    background: var(--card);
    border: 1px solid var(--rule-2);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-1);
    overflow: hidden;
    transition: border-color .25s;
  }
  .scard:has(.lie.alarm) { border-color: var(--bad-hi); }
  /* the card takes the news once, when it becomes true — a single press down
     rather than a pulse that nags for the rest of the hole */
  .scard.jolt { animation: jolt .46s var(--ease-out); }
  @keyframes jolt {
    0%, 100% { transform: none; }
    28%  { transform: translateY(2.5px) scaleY(.992); }
    64%  { transform: translateY(-1px); }
  }

  .scard-top {
    display:flex; align-items:center; gap:9px; width:100%;
    min-height:46px; padding:5px 7px 5px 14px;
    background: var(--card-2); border:0; border-bottom:1px solid var(--rule-2);
    text-align:left; cursor:pointer; appearance:none;
    font: inherit; color: inherit;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    transition: background var(--dur-1);
  }
  /* a header band, not a button-shaped thing: the hover lightens the stock
     and walks the chevron out a couple of pixels rather than washing the
     whole row in tan */
  .scard-top:hover { background: var(--card); }
  .scard-top:hover .chev { transform: translateX(2px); color: var(--ink-2); }
  .scard-top:active { background: var(--rule); }
  .scard-top:active .chev { transform: translateX(4px); }
  .scard-top:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent-hi); }
  .scard-top .rname {
    flex:1 1 auto; min-width:0;
    font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
    color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pips { display:flex; gap:4px; flex:0 0 auto; }
  .pip {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:31px; padding:2px 4px 3px;
    background: var(--card); border:1px solid var(--rule); border-radius:6px;
  }
  .pip i {
    font-family:var(--font-mono); font-style:normal; font-size:10px; font-weight:600;
    letter-spacing:.06em; color:var(--ink-3); line-height:1;
  }
  .pip b {
    font-family:var(--font-brand); font-variation-settings:'opsz' 20,'wght' 700;
    font-size:12.5px; line-height:1.2; color:var(--ink-3);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .pip.now { border-color:var(--accent-hi); background:var(--accent-soft); }
  .pip.now i, .pip.now b { color:var(--accent-hi); }
  .pip.under b { color:var(--good-hi); }
  .pip.even  b { color:var(--ink); }
  .pip.over  b { color:var(--warn-hi); }
  .pip.blown b { color:var(--bad-hi); }

  .topar {
    flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end;
    padding-left:10px; border-left:1px solid var(--rule); line-height:1;
  }
  .topar .cap {
    font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:3px;
  }
  .topar .fig {
    font-family:var(--font-brand); font-variation-settings:'opsz' 40,'wght' 700;
    font-size:18px; letter-spacing:-.01em; line-height:1;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .topar.under .fig { color:var(--good-hi); }
  .topar.over  .fig { color:var(--warn-hi); }
  .topar.blown .fig { color:var(--bad-hi); }
  .scard-top .chev {
    --ms-size:18px; --ms-wght:500; color:var(--ink-3); flex:0 0 auto;
    transition: transform var(--dur-2) var(--ease-out), color var(--dur-1);
  }
  /* a hole is scored: the figure is pencilled onto the pip rather than
     appearing there. Short, weighted, one beat — a mark being pressed in. */
  .pip.stamp { animation: stamp-pip .46s var(--ease-out) both; }
  @keyframes stamp-pip {
    0%   { transform: scale(1.34); opacity: 0; }
    46%  { transform: scale(.965); opacity: 1; }
    72%  { transform: scale(1.012); }
    100% { transform: none; }
  }

  /* ---------- the lie ---------- */
  .lie {
    display:flex; align-items:center; gap:11px;
    padding:6px 6px 6px 15px; min-height:56px;
    transition: background .25s;
  }
  .tally { flex:1; display:flex; align-items:center; gap:11px; min-width:0; }
  .tally .n {
    font-family: var(--font-brand); font-variation-settings:'opsz' 120,'wght' 700;
    font-size:31px; line-height:1; letter-spacing:-.025em;
    font-variant-numeric: tabular-nums lining-nums;
    transition: color .2s; transform-origin: 50% 90%;
  }
  /* the count doesn't swap, it drops onto the card */
  .tally .n.struck { animation: struck .38s var(--ease-out) both; }
  @keyframes struck {
    0%   { transform: translateY(-8px) scale(1.1); opacity: .25; }
    52%  { transform: translateY(0) scale(.955); opacity: 1; }
    76%  { transform: translateY(0) scale(1.02); }
    100% { transform: none; }
  }
  .tally .meta { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .tally .lbl {
    font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); white-space:nowrap;
  }
  /* --warn-ink, not --warn-hi: this line only ever appears on the brass wash
     (the alarm row re-inks it red below), and brass on brass is 3.56:1 —
     under AA at 11.5px. --warn-ink is the same brass taken dark enough to
     clear it, and only here, so the pips and the card column keep their tone. */
  .tally .warnl {
    font-size:11.5px; font-weight:700; color:var(--warn-ink);
    white-space:nowrap; line-height:1.15;
  }
  .tally .warnl:empty { display:none; }
  /* the tension line arrives — it is the one piece of copy that changes
     mid-hole, and it should be noticed once, not blink on every render */
  .tally .warnl.said { animation: rise-in .34s var(--ease-out) both; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(5px); } }
  .lie.warn  { background: var(--warn-soft); }
  .lie.warn  .n { color: var(--warn-hi); }
  /* --ink-3 is tuned against paper; on the brass wash it drops to 2.8:1 in
     both themes. The alarm row already re-inks its label — the warn row has
     to as well, or the one line that says what you are looking at goes
     illegible exactly when the row starts shouting. */
  .lie.warn  .lbl { color: var(--ink-2); }
  .lie.alarm { background: var(--bad-soft); }
  .lie.alarm .n, .lie.alarm .warnl, .lie.alarm .lbl { color: var(--bad-hi); }

  .caddie {
    display:flex; align-items:center; gap:7px;
    height:44px; padding:0 15px; min-width:44px;
    background:var(--plate); border:1px solid var(--rule-2); color:var(--ink);
    border-radius: var(--r-pill); box-shadow: var(--shadow-1);
    font-size:10.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
    cursor:pointer; white-space:nowrap;
    transition: transform .1s, background .15s, border-color .15s, box-shadow .15s;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .caddie .ms { --ms-size:19px; --ms-wght:500; color:var(--ink-2); }
  .caddie:hover { border-color: var(--ink-3); }
  .caddie:hover .ms { --ms-fill:1; }
  .caddie:active { transform: scale(.955); box-shadow:none; }
  .caddie:focus-visible { outline:none; border-color: var(--accent-hi); box-shadow: 0 0 0 3px var(--accent-soft); }
  .caddie[disabled] { opacity:.42; cursor:default; box-shadow:none; }
  .caddie.spent .ms { --ms-fill:1; color:var(--warn-hi); }
  .caddie.signed .ms { --ms-fill:1; color:var(--accent-hi); }
  /* the caddie and the flag share a flank: two ways out of trouble, side by
     side, so "stuck" always has somewhere to tap */
  .helpers { display:flex; align-items:center; gap:7px; flex:0 0 auto; }
  .caddie.iconly { padding:0; width:44px; justify-content:center; gap:0; }
  /* display:flex on .caddie out-specifies the UA's [hidden] rule — restate it,
     or the flag stays on screen after the round is signed */
  .caddie[hidden] { display:none; }
  /* at 320px the tally, a labelled caddie and the flag cannot all fit; the
     caddie folds to its glyph before anything starts clipping */
  @media (max-width: 374px) {
    #caddieBtn { padding:0; min-width:44px; justify-content:center; gap:0; }
    #caddieBtn #caddieLbl { display:none; }
  }

  /* ==================================================================
     THE COURSE — one spine runs the whole way down, solid where you have
     played and dashed ahead of you, with the compound each link made
     printed on it. This is the thing to screenshot.
     ================================================================== */
  /* The course takes only the height its chain needs and gives the rest to
     the fairway below it; once the chain outgrows the space it shrinks and
     scrolls instead, holding the newest link in view. */
  .course {
    flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    /* the bottom padding keeps the fade off the entry plate: the course is
       always scrolled to its end, so without it the newest link would sit
       permanently inside the mask */
    display:flex; flex-direction:column; padding:0 0 13px; scrollbar-width:thin;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 12px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 12px), transparent 100%);
  }
  .chain { position:relative; display:flex; flex-direction:column; align-items:center; }

  .rung {
    position:relative; width:100%; height:30px; flex:0 0 30px;
    display:flex; align-items:center; justify-content:center;
  }
  .rung::before {                       /* the spine itself */
    content:''; position:absolute; left:50%; top:-1px; bottom:-1px;
    width:2px; margin-left:-1px; background: var(--rule-2); border-radius:1px;
  }
  .rung.pending::before {
    width:0; background:none; border-left:2px dashed var(--rule-2);
  }
  .made {
    position:relative; background: var(--paper);
    font-family: var(--font-mono); font-size:10px; font-weight:600;
    letter-spacing:.15em; text-transform:uppercase; color: var(--ink-2);
    border:1px solid transparent; border-radius: var(--r-pill);
    padding:2.5px 10px; white-space:nowrap; line-height:1.25;
  }
  /* the joint. It inherits its colour so it survives the flash back to rest —
     an em with a fixed colour here goes white-on-cream the moment the
     animation hands the chip back to the resting palette. */
  .made em { font-style:normal; color: currentColor; opacity:.45; font-weight:800; }
  .made.ghost { color: var(--ink-3); }

  /* ---------- the stitch ----------
     A stroke is played and the spine grows the gap it just earned: the rule
     draws downward from the plate above, then the compound is stamped onto
     it. The green cools back to printed grey a beat later, so the newest
     link is briefly the only lit thing on the course. */
  .rung.fresh::before {
    background: var(--accent-hi); transform-origin: 50% 0;
    animation: stitch .26s cubic-bezier(.45,.02,.7,.5) both,
               spine-cool 1.3s ease-out .62s forwards;
  }
  @keyframes stitch { from { transform: scaleY(0); } }
  @keyframes spine-cool { to { background: var(--rule-2); } }
  .rung.fresh .made {
    color: var(--accent-ink); background: var(--accent); border-color:transparent;
    animation: stamp .3s var(--ease-out) .2s both,
               made-cool 1.1s ease-out .74s forwards;
  }
  @keyframes stamp {
    0%   { transform: scale(1.22); opacity: 0; }
    55%  { transform: scale(.97); opacity: 1; }
    78%  { transform: scale(1.01); }
    100% { transform: none; }
  }
  @keyframes made-cool {
    to { color: var(--ink-2); background: var(--paper); border-color: transparent; }
  }

  /* ---------- the plates ---------- */
  .node {
    position:relative; width:100%; max-width:292px;
    display:flex; align-items:center; justify-content:center;
    background: var(--plate); border:1px solid var(--rule-2);
    border-radius: var(--r-plate);
    box-shadow: var(--shadow-1), inset 0 1px 0 var(--plate-hi);
    padding: 11px 46px; min-height:52px; user-select:none;
  }
  .node .w {
    font-family: var(--font-brand); font-variation-settings:'opsz' 32,'wght' 600;
    font-size:21px; line-height:1.05; letter-spacing:.045em; text-transform:uppercase;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* The tee word is the one piece of context you must never lose. On a long
     hole the chain outgrows the course and scrolls it away, so it pins to the
     top of the scroller and the rest of the line runs underneath it. */
  .node.tee {
    position: sticky; top:0; z-index:2; margin-bottom:1px;
    background: var(--paper); border:1px dashed var(--rule-2);
    box-shadow:none; color: var(--ink-2);
    min-height:42px; padding:8px 46px;
  }
  .node.tee .w { font-variation-settings:'opsz' 28,'wght' 500; font-size:18px; }
  .node.tee::after {          /* scrolled links pass behind the pinned tee */
    content:''; position:absolute; left:-20px; right:-20px; top:100%; height:11px;
    background: linear-gradient(var(--paper), rgba(0,0,0,0)); pointer-events:none;
  }
  .node .tag {
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-family:var(--font-ui); font-size:10px; font-weight:800; letter-spacing:.14em;
    color:var(--ink-3); text-transform:uppercase; line-height:1;
    border:1px solid var(--rule); border-radius:var(--r-pill);
    padding:3px 6px 3px 7px; background:var(--card-2);
  }
  .node .glove {
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color: var(--warn-hi);
  }
  .node.caddied { border-color: var(--warn-hi); background: var(--warn-soft); }

  /* ---------- MOTION SIGNATURE: WEIGHT ----------
     The plate you just filled does not pop. It comes down under gravity —
     accelerating in, compressing on the ground, and settling once — the way
     a struck ball lands. Nothing here overshoots upward and nothing wobbles
     more than a single time. */
  .node.snap {
    transform-origin: 50% 100%;
    animation: settle .44s both, plate-set .5s var(--ease-out) both;
  }
  @keyframes settle {
    0%   { transform: translateY(-13px) scale(1.015); opacity: .35;
           animation-timing-function: cubic-bezier(.5,.02,.82,.42); }
    20%  { opacity: 1; }
    50%  { transform: translateY(0) scale(1);
           animation-timing-function: cubic-bezier(.3,0,.25,1); }
    66%  { transform: translateY(0) scaleY(.905) scaleX(1.03); }
    84%  { transform: translateY(0) scaleY(1.022) scaleX(.992); }
    100% { transform: none; }
  }
  /* the plate hardens out of the dashed entry it used to be */
  @keyframes plate-set {
    0%  { border-color: var(--accent-hi); background: var(--accent-soft); }
    45% { border-color: var(--accent-hi); }
  }

  /* ---------- a swing that came to nothing ----------
     A rejection is a duffed shot, not a punishment: heavy, low-frequency,
     over in a third of a second, and it leaves the word where you typed it. */
  .node.duff { animation: duff .34s cubic-bezier(.3,0,.3,1) both, duff-ink .6s ease-out both; }
  @keyframes duff {
    0%, 100% { transform: none; }
    16%  { transform: translateX(-7px); }
    40%  { transform: translateX(6px); }
    62%  { transform: translateX(-3px); }
    82%  { transform: translateX(1.5px); }
  }
  @keyframes duff-ink {
    0%, 55% { border-color: var(--bad-hi); background: var(--bad-soft); }
  }
  /* ---------- the right pair, the wrong way round ----------
     BOAT·HOUSE typed as HOUSE·BOAT is the most legible near-miss the game
     has, so it gets its own feel: the ball rocks on the lip instead of
     being duffed, and the plate goes brass rather than red. */
  .node.lip { animation: lip .46s var(--ease-out) both, lip-ink .8s ease-out both; }
  @keyframes lip {
    0%, 100% { transform: none; }
    22%  { transform: rotate(-1.7deg) translateY(1px); }
    52%  { transform: rotate(1.3deg); }
    78%  { transform: rotate(-.5deg); }
  }
  @keyframes lip-ink {
    0%, 62% { border-color: var(--warn-hi); background: var(--warn-soft); }
  }

  /* ---------- the word being typed ---------- */
  .node.entry {
    border:1.5px dashed var(--accent-hi); background: var(--accent-soft);
    box-shadow:none; color: var(--ink);
  }
  .node.entry .w { color: var(--ink); }
  /* --ink-2, not --ink-3, for the same reason as .pin .lbl below: this sits on
     the mint plate rather than on paper, where --ink-3 measures 4.43:1 light
     and 4.37:1 dark — a hair under AA at 10.5px. */
  .node.entry.empty .w {
    font-family: var(--font-ui); font-size:10.5px; font-weight:800;
    letter-spacing:.18em; color: var(--ink-2);
  }
  /* the join and the plate you type into are one object — the next lie. It
     arrives a beat after the last shot has settled, so the board reads as one
     movement rather than three things changing at once. */
  .teeup { width:100%; display:flex; flex-direction:column; align-items:center; }
  .teeup.arrive { animation: lie-in .38s var(--ease-out) .3s both; }
  @keyframes lie-in { from { opacity: 0; transform: translateY(-7px); } }
  /* the hole is over and there is nothing left to type into. It fades rather
     than being pulled out of the flow, so the fairway below it does not
     lengthen by 90px at the exact moment the ball starts rolling down it. */
  .teeup.leaving { animation: lie-out .22s var(--ease-out) forwards; pointer-events:none; }
  @keyframes lie-out { to { opacity: 0; transform: translateY(5px); } }
  /* each letter is placed, not typed into a field */
  .node.entry .w i { font-style:normal; display:inline-block; animation: letter-in .17s var(--ease-out); }
  @keyframes letter-in { from { opacity: 0; transform: translateY(-5px); } }
  /* a word the caddie handed you, until you touch it */
  .node.entry.given { border-color: var(--warn-hi); background: var(--warn-soft); }
  .node.entry.given .caret { background: var(--warn-hi); }
  .node.handed { transform-origin: 50% 100%; animation: settle .44s both; }
  .caret {
    display:inline-block; width:2px; height:20px; background:var(--accent-hi);
    margin-left:4px; vertical-align:-4px; border-radius:1px;
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity:0 } }

  /* ---------- the pin ----------
     The dashed run is not decoration and not a fixed gap: it takes the height
     the course doesn't need, so it reads as the distance still to walk — and
     it shortens, visibly, with every word you play.
     It is BOUNDED, though. Left to grow it swallowed every spare pixel on the
     screen: 261px of empty dashes on the opening board at 390×844, 381px on a
     desktop window, a third of the viewport spent on nothing before the player
     had done anything. The cap keeps the run at a stretch of fairway rather
     than an unfinished screen; the slack above the cap goes to the stage,
     which is centred, so it reads as air rather than as a dead element. */
  .tothepin {
    position:relative;
    display:flex; justify-content:center; align-items:stretch;
    flex:1 1 auto; min-height:18px; max-height:min(96px, 11.5dvh);
    margin:-17px 0 -4px;
  }
  .tothepin::before { content:''; width:0; border-left:2px dashed var(--rule-2); }
  /* holed out: the dashed run to the pin closes up into a solid line */
  .tothepin.holed::before { border-left-style:solid; border-left-color:var(--good-hi); }
  /* …and it closes by being drawn, downhill, at the speed of the ball. This
     is its own element rather than the fairway's rule because the run the
     ball takes starts above the fairway — at the last plate you filled. */
  .closeline {
    position:absolute; width:2px; margin-left:-1px; border-radius:1px;
    background: var(--good-hi); transform-origin: 50% 0; pointer-events:none;
    animation: close-line var(--close, .5s) cubic-bezier(.42,.02,.72,.55) both;
  }
  @keyframes close-line { from { transform: scaleY(0); } }

  /* THE BALL. It exists for two-thirds of a second, once a hole, and it is the
     thing the whole surface has been drawing a line toward. It lives on the
     stage rather than on the fairway, because by the time you hole out the
     fairway has done its job and shrunk to nothing — the run it needs is from
     the last plate you filled all the way into the cup. */
  .stage { position: relative; }
  .ball {
    position:absolute; width:13px; height:13px; border-radius:50%;
    will-change: transform, opacity; pointer-events:none;
    background: radial-gradient(circle at 34% 28%, #fff 0 22%, #f0ece2 55%, #c8c1b1 100%);
    box-shadow: 0 2px 5px rgba(23,22,26,.34);
    animation: roll var(--roll, .62s) cubic-bezier(.42,.02,.72,.55) both;
  }
  /* straight down the spine, then it breaks left at the last moment and drops */
  @keyframes roll {
    0%   { transform: translate(-50%, -50%) scale(.68); opacity: 0; }
    11%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    68%  { transform: translate(-50%, calc(-50% + var(--y1, 40px))) scale(1); opacity: 1; }
    91%  { transform: translate(calc(-50% + var(--x2, 0px)), calc(-50% + var(--y2, 60px))) scale(.86); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x2, 0px)), calc(-50% + var(--y2, 60px))) scale(.2); opacity: 0; }
  }

  /* Signed card, clubhouse. The keyboard has nothing left to do, so the
     course takes its room and shows the finished line instead. */
  .app.done #kbd, .app.done .deskhint { display:none; }
  .app.done .tothepin { flex:0 0 auto; }

  .pin {
    display:flex; align-items:center; gap:13px;
    border:1.5px solid var(--accent-hi); background: var(--accent-soft);
    border-radius: var(--r-card); padding:10px 15px; position:relative;
    box-shadow: var(--shadow-1);
    transition: background .3s, border-color .3s;
  }
  .pin .cup {
    position:relative;
    flex:0 0 40px; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center;
    background: var(--card); border:1px solid var(--rule);
    border-color: color-mix(in srgb, var(--accent-hi) 32%, transparent);
    box-shadow: inset 0 2px 4px var(--plate-lo);
    transition: border-color .35s var(--ease-out);
  }
  .pin .cup .ms {
    --ms-size:24px; --ms-wght:500; color: var(--accent-hi);
    transition: font-variation-settings .45s var(--ease-out), color .35s var(--ease-out);
  }
  .pin .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  /* --ink-2, not --ink-3: this label sits on the mint plate, not on paper,
     and --ink-3 there is 2.7:1 light / 2.9:1 dark. --ink-2 clears 5:1 in
     both and still reads as the quiet line above the word. */
  .pin .lbl {
    font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-2); line-height:1;
    transition: color .35s var(--ease-out);
  }
  /* the rangefinder reading changed — noticed once, not blinked on repaints */
  .pin .lbl.said { animation: rise-in .34s var(--ease-out) both; }
  .pin .word {
    font-family:var(--font-brand); font-variation-settings:'opsz' 44,'wght' 700;
    font-size:23px; line-height:1.05; letter-spacing:.02em; text-transform:uppercase;
    color:var(--accent-hi); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    /* the word converts from accent to good as the ball drops — it is already
       on the plate, so it changes rather than arrives */
    transition: color .35s var(--ease-out);
  }
  /* ---------- HOLING OUT ----------
     The flag fills — the FILL axis is the payoff an SVG can't give — the cup
     throws one ring, the flagstick is planted back in, and the whole plate
     takes the weight of the ball before it rises. Four things, one beat. */
  .pin.done { background: var(--good-soft); border-color: var(--good-hi); }
  .pin.done .cup { border-color: color-mix(in srgb, var(--good-hi) 34%, transparent); }
  .pin.done .cup .ms { color: var(--good-hi); --ms-fill:1; --ms-wght:600; }
  .pin.done .word { color: var(--good-hi); }
  .pin.done .lbl { color: var(--good-hi); }

  .pin.holed { animation: take-it .62s var(--ease-out) both; }
  @keyframes take-it {
    0%   { transform: none; }
    22%  { transform: translateY(3px) scaleY(.985); }
    58%  { transform: translateY(-2px) scaleY(1.012); }
    100% { transform: none; }
  }
  .pin.holed .cup::after {
    content:''; position:absolute; inset:-3px; border-radius:50%;
    border:2px solid var(--good-hi); pointer-events:none;
    animation: cup-ring .72s var(--ease-out) both;
  }
  @keyframes cup-ring {
    0%   { opacity: .9; transform: scale(.86); }
    100% { opacity: 0;  transform: scale(1.9); }
  }
  .pin.holed .cup .ms { animation: plant .58s var(--ease-spring) .04s both; }
  @keyframes plant {
    0%   { transform: translateY(-5px) rotate(-11deg); }
    50%  { transform: translateY(0) rotate(5deg); }
    76%  { transform: rotate(-2deg); }
    100% { transform: none; }
  }
  /* Nothing inside the plate fades in. Both the label and the word are already
     on screen and only change; an entrance animation on either leaves a frame
     of empty plate under a filled flag, which reads as a glitch. */

  /* Gated exactly like the kit's .kbd, and it has to be: width alone put this
     hint on every tablet, where the on-screen keys are now (correctly) still
     shown — so a tablet player got the pad AND a line telling them to use a
     hardware keyboard they do not have. hover+fine is the actual question. */
  .deskhint { display:none; }
  @media (min-width:620px) and (hover:hover) and (pointer:fine) {
    .deskhint {
      display:block; text-align:center; padding-top:14px; margin:auto 0 0;
      font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
      color:var(--ink-3);
    }
    .deskhint b { color: var(--ink-2); }
  }

  /* ==================================================================
     THE SCORECARD — ruled card stock with an inner keyline, tabular
     figures, and the +/- column ruled off doing the emotional work.
     ================================================================== */
  .cardwrap {
    position:relative; background: var(--card);
    border:1px solid var(--rule-2); border-radius: var(--r-card);
    box-shadow: var(--shadow-1);
    padding: 13px 14px 11px; margin: 14px 0 2px;
  }
  .cardwrap::after {
    content:''; position:absolute; inset:4px; pointer-events:none;
    border:1px solid var(--rule); border-radius:7px;
  }
  .card {
    width:100%; border-collapse:collapse; font-size:14px;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .card th {
    font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
    font-weight:800; text-align:left; padding:0 5px 8px;
    border-bottom:1.5px solid var(--rule-2);
  }
  .card th.num, .card td.num { text-align:right; }
  .card td { padding:9px 6px; border-bottom:1px solid var(--rule); }
  .card td.hole { font-family:var(--font-mono); font-size:11px; color:var(--ink-3); width:14px; }
  .card td.leg { font-weight:600; letter-spacing:-.005em; white-space:nowrap; }
  .card td.leg .ms { --ms-size:13px; --ms-wght:500; color:var(--ink-3); vertical-align:-2px; margin:0 2px; }
  .card td.leg .glove { --ms-size:13px; --ms-fill:1; color:var(--warn-hi); vertical-align:-2px; margin-left:5px; }
  .card th.res, .card td.res { border-left:1px solid var(--rule); padding-left:11px; }
  .card td.res {
    font-family:var(--font-brand); font-variation-settings:'opsz' 24,'wght' 700;
    font-size:15px; letter-spacing:-.01em;
  }
  .card tr.pending td { color: var(--ink-3); }
  .card tr.tot td {
    border-bottom:none; border-top:2px solid var(--rule-2);
    font-weight:800; padding-top:11px; font-size:15px;
  }
  .card tr.tot td.res { font-size:17px; }
  .res.under { color: var(--good-hi); }
  .res.even  { color: var(--ink); }
  .res.over  { color: var(--warn-hi); }
  .res.blown { color: var(--bad-hi); }

  /* ---------- the number that matters ---------- */
  .bigscore { text-align:center; margin:16px 0 4px; }
  /* opsz 40, not 96. This figure is a SIGNED number, and Fraunces at a display
     optical size draws the arms of − and + as true hairlines: at 64px the
     minus in "−1" came out about a pixel tall and the sign — the half of the
     figure that carries whether the round was good — read as a printing fault.
     Kit.count writes this element through textContent, so the sign cannot be
     wrapped and styled on its own; the fix has to be the cut. opsz 40 at
     wght 800 keeps the modelled serif but puts real weight in the horizontals,
     so −1, +2, +5, E and X all read at 64px and at the 46px hole size. */
  .bigscore .fig {
    display:block; font-family:var(--font-brand);
    font-variation-settings:'opsz' 40,'wght' 800;
    font-size:64px; line-height:.92; letter-spacing:-.035em;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .bigscore .cap {
    display:block; margin-top:8px; font-size:10px; font-weight:800;
    letter-spacing:.17em; text-transform:uppercase; color:var(--ink-3);
  }
  .bigscore.sm .fig { font-size:46px; }
  .bigscore.under .fig { color:var(--good-hi); }
  .bigscore.even  .fig { color:var(--accent-hi); }
  .bigscore.over  .fig { color:var(--warn-hi); }
  .bigscore.blown .fig { color:var(--bad-hi); }

  /* ---------- the line you played, and the one you missed ---------- */
  .lineout {
    background: var(--card-2); border:1px solid var(--rule);
    border-radius: var(--r-card); padding:12px 14px; margin:16px 0 2px; text-align:center;
  }
  .lineout .cap {
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:10px; font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-3); margin-bottom:8px;
  }
  .lineout .cap .ms { --ms-size:14px; --ms-fill:1; }
  .lineout b {
    font-family:var(--font-mono); font-size:12.5px; line-height:1.75; letter-spacing:.1em;
    color:var(--ink); font-weight:600;
  }
  /* a long line wraps between words, never through one — TOWER split as
     TO / WER is the sort of thing a reader reads as a bug */
  .lineout b i { white-space:nowrap; }
  .lineout.missed {
    margin-top:9px; background: var(--accent-soft);
    border-color: var(--accent-hi);
    border-color: color-mix(in srgb, var(--accent-hi) 45%, transparent);
  }
  .lineout.missed .cap { color: var(--accent-hi); }
  /* THE NEAR MISS, MADE LEGIBLE.
     The line you missed is printed against the line you played: the words you
     also found go quiet, and the first word where you turned off is the only
     lit one. "I was so close" stops being a feeling and becomes a place. */
  .lineout b i { font-style:normal; opacity:1; }
  .lineout.missed b i.same { opacity:.42; }
  .lineout.missed b i.turn {
    color: var(--accent-hi); font-weight:800;
    box-shadow: 0 2px 0 -1px var(--accent-hi);
  }
  .lineout b em { font-style:normal; opacity:.35; padding:0 1px; }
  /* one stroke off the tightest line is the whole pitch in one sentence */
  .nearline {
    text-align:center; margin:12px 0 0; padding:0 6px;
    font-size:13px; line-height:1.5; color: var(--ink-2);
  }
  .nearline .ms {
    --ms-size:17px; --ms-fill:1; color:var(--accent-hi);
    vertical-align:-4px; margin-right:6px;
  }
  .nearline b { color: var(--ink); font-weight:700; }
  .nearline.good .ms { color: var(--good-hi); }

  /* The next tee. There is no closing time here — a signed card hands you the
     next round, so this is the last thing on the sheet and it is a way on. */
  .teebox {
    display:flex; flex-direction:column; gap:8px;
    margin-top:16px; padding-top:15px; border-top:1px solid var(--rule);
  }
  /* Kit.nextButton is `btn tonal wide` now — outlined in the accent, so the
     share button stays the one filled CTA on the sheet. Nothing here assumed
     .primary, but .btn.tonal is painted in --accent, and --accent is the one
     token this game does NOT restate per theme: bottle green #1c705a on the
     dark page is 3.48:1, under AA for a 15px label. --accent-hi is the same
     green taken light for dark mode (8.76:1) and is #1c705a again in light
     (4.88:1), which is exactly what this button needs. */
  .btn.tonal { color: var(--accent-hi); border-color: var(--accent-hi); }
  .btn.tonal:hover, .btn.tonal:active { background: var(--accent-soft); }

  /* the two quiet ways off this sheet share a line, so the way ON stays the
     only full-width thing under the rule */
  .teerow { display:flex; gap:8px; }
  .teerow .btn { flex:1 1 0; min-width:0; padding:12px 8px; }

  /* the share block has to fit a 390px phone without sideways scrolling —
     the kit default is tuned for short emoji grids, not a scorecard line */
  .sharegrid {
    font-size:13px; letter-spacing:.02em; padding:13px 10px;
    background: var(--card); border-color: var(--rule-2);
  }
  /* The copy button confirms itself — but only when there is something to
     confirm. Kit.share owns this now and adds .done ONLY on a real clipboard
     write; a blocked clipboard falls through to select-and-copy and the button
     says so instead of going green over a lie. */
  #shareBtn { transition: transform .1s, box-shadow .15s, background .25s var(--ease-out); }
  /* --good-hi is a DARK green in light mode and a LIGHT green in dark, so the
     ink has to flip with it: --accent-ink is white in both and would leave
     this at 1.9:1 on the dark page. --paper is always the opposite of it. */
  #shareBtn.done { background: var(--good-hi); color: var(--paper); }
  #shareBtn.done .ms { animation: stamp-pip .4s var(--ease-out) both; }

  /* ---------- sheets ---------- */
  .sheet { padding-top:20px; }
  .sheet h2 {
    font-family: var(--font-brand); font-variation-settings:'opsz' 144,'wght' 700;
    font-size:30px; line-height:1.08; letter-spacing:-.025em; margin:0 0 5px;
  }
  /* The kit parks its close button in the top-right of every dismissable
     sheet. A centred 30px title has to be kept out from under it — at 360px
     "Rough day on the course" runs its last letters straight through the X.
     Padded on BOTH sides so the title stays optically centred; the sticky
     sheets, which have no close button, keep the full width. */
  .sheet:has(.sheet-x) h2 { padding: 0 30px; }
  .sheet .sub { font-size:13.5px; }
  .sheet .sub.caps {
    font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .sheet .rules { font-size:14px; line-height:1.55; }
  .sheet .rules li { margin-bottom:6px; }
  .statrow .stat { background: var(--card); border-color: var(--rule); }
  .statrow .stat .n {
    font-family: var(--font-brand); font-variation-settings:'opsz' 36,'wght' 700;
    font-size:21px; letter-spacing:-.02em;
    font-variant-numeric: tabular-nums lining-nums;
  }

  /* ---------- help: the diagram is the rule ---------- */
  .demo {
    position:relative; display:flex; flex-direction:column; align-items:center;
    background: var(--card-2); border:1px solid var(--rule);
    border-radius: var(--r-card); padding:12px; margin:14px 0 0;
  }
  .demo::before {
    content:''; position:absolute; left:50%; top:26px; bottom:26px;
    width:2px; margin-left:-1px; background: var(--rule-2); border-radius:1px;
    /* the diagram draws its own spine when the sheet opens: the rule is the
       line, so the line is what moves */
    transform-origin: 50% 0;
    animation: stitch .6s var(--ease-out) .28s both;
  }
  .dw {
    position:relative; z-index:1;
    font-family:var(--font-brand); font-variation-settings:'opsz' 28,'wght' 600;
    font-size:15px; letter-spacing:.05em; text-transform:uppercase;
    background:var(--plate); border:1px solid var(--rule-2); border-radius:6px;
    padding:4px 15px; min-width:112px; text-align:center; color:var(--ink);
  }
  .dw.tee { background:transparent; border-style:dashed; color:var(--ink-2); }
  .dw.pinw {
    color:var(--accent-hi); border-color:var(--accent-hi); background:var(--accent-soft);
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .dw.pinw .ms { --ms-size:16px; --ms-fill:1; }
  .dl {
    position:relative; z-index:1; margin:5px 0; padding:1px 8px;
    background: var(--card-2);
    font-family:var(--font-mono); font-size:10px; font-weight:600;
    letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  }
  .dl em { font-style:normal; color:var(--accent-hi); font-weight:800; }
  .demolbl {
    text-align:center; font-size:10px; font-weight:800; letter-spacing:.15em;
    text-transform:uppercase; color:var(--ink-3); margin:9px 0 13px;
  }
  .demolbl b { color:var(--accent-hi); }
  .fineprint {
    margin-top:12px; padding-top:11px; border-top:1px solid var(--rule);
    font-size:12.5px; line-height:1.65; color:var(--ink-2);
  }
  .fineprint b { color:var(--ink); }
  /* what the caddie costs, as two lines you can count rather than a paragraph */
  .cadcost { display:flex; flex-direction:column; gap:10px; margin-top:2px; }
  .cadcost .row {
    display:flex; align-items:flex-start; gap:10px;
    font-size:13.5px; line-height:1.45; color:var(--ink-2);
  }
  .cadcost .row .ms { color:var(--warn-hi); flex:0 0 auto; margin-top:1px; }
  .cadcost .row b { color:var(--ink); font-weight:700; }
  .keymap {
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin-top:13px;
    font-size:10.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .keymap span { white-space:nowrap; }
  .keymap b { color:var(--ink-2); }

  /* the coach mark is the first thing a first-timer ever taps, and the kit
     styles its buttons at 38px — under the brief's floor. Every game in the
     suite raises them here until it can be fixed in shared/kit.css. */
  #tour-layer .bub .btn { min-height: 44px; }

  /* ==================================================================
     REDUCED MOTION
     The kit already collapses every duration to nothing. What that leaves
     behind is the job here: anything whose only job was to be seen moving
     must not survive as a frozen artefact, and anything an animation was
     revealing must already be visible at rest.
     ================================================================== */
  @media (prefers-reduced-motion: reduce) {
    /* the caret is the empty state's whole affordance — it must never depend
       on an animation being allowed to run */
    .caret { animation:none; opacity:1; }
    /* a 13px ball frozen on the fairway is litter, not a golf ball */
    .ball { display:none; }
    /* The kit zeroes durations but not delays, so anything that opens on a
       delayed `both` would hold its invisible first frame for a third of a
       second and read as missing content. These are all pure entrances — the
       resting style underneath each one is already the correct final state. */
    .rung.fresh::before, .rung.fresh .made, .teeup.arrive, .demo::before,
    .node.entry .w i { animation: none; }
    /* the kit opens its coach bubble on a .1s delay that its own reduce block
       does not zero, so the bubble sits invisible and then snaps in */
    #tour-layer .bub { animation: none; }
    /* The kit's .stagger is the same trap one level up: `backwards` fill plus
       a delay of up to .44s means every line of a result sheet holds its
       opacity-0 first frame for its own delay even after the duration has
       been zeroed. The sheet would still assemble itself in front of someone
       who asked for no motion. */
    .stagger > * { animation: none; }
  }

  /* ---------- short phones ---------- */
  @media (max-height: 700px) {
    .node { min-height:46px; padding:9px 44px; }
    .node .w { font-size:19px; }
    .node.tee { min-height:38px; padding:7px 44px; }
    .node.tee .w { font-size:16.5px; }
    .rung { height:26px; flex-basis:26px; }
    .lie { min-height:50px; }
    .tally .n { font-size:26px; }
    .scard-top .rname { display:none; }
    .pin { padding:8px 14px; }
    .pin .word { font-size:20px; }
    .pin .cup { flex-basis:34px; width:34px; height:34px; }
    .pin .cup .ms { --ms-size:21px; }
    .stage { gap:10px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <a class="iconbtn" href="../" aria-label="All games" title="All games">
      <span class="ms" aria-hidden="true">arrow_back</span>
    </a>
    <div class="lockup">
      <h1>Chains</h1>
      <span class="pno" id="pno">No. 1</span>
    </div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Toggle theme"></button>
  </div>

  <div class="scard">
    <button class="scard-top" id="cardBtn" type="button" title="Scorecard and rules" aria-label="Scorecard">
      <span class="rname" id="rname" aria-hidden="true"></span>
      <span class="pips" id="pips" aria-hidden="true"></span>
      <span class="topar" id="toPar" aria-hidden="true">
        <span class="cap">to par</span><span class="fig tick" id="toParFig">E</span>
      </span>
      <span class="ms chev" aria-hidden="true">chevron_right</span>
    </button>
    <div class="lie" id="lie">
      <div class="tally" role="status" aria-live="polite">
        <span class="n" id="strokeN">0</span>
        <span class="meta">
          <span class="lbl" id="strokeL">strokes · par 4</span>
          <span class="warnl" id="strokeW"></span>
        </span>
      </div>
      <span class="helpers" id="helpers">
        <button class="caddie" id="caddieBtn" type="button">
          <span class="ms" id="caddieIcon" aria-hidden="true">front_hand</span>
          <span id="caddieLbl">Caddie</span>
        </button>
        <button class="caddie iconly" id="flagBtn" type="button"
                aria-label="Take a drop or pick up" title="Take a drop or pick up">
          <span class="ms" aria-hidden="true">flag</span>
        </button>
      </span>
    </div>
  </div>

  <div class="stage">
    <div class="course" id="course"><div class="chain" id="chain"></div></div>

    <div class="tothepin" id="toPin" aria-hidden="true"></div>

    <div class="pin" id="pin">
      <span class="cup" aria-hidden="true"><span class="ms" aria-hidden="true">golf_course</span></span>
      <span class="body">
        <span class="lbl" id="pinLbl">The pin</span>
        <span class="word" id="pinWord">WORK</span>
      </span>
    </div>
  </div>

  <div id="kbd"></div>
  <div class="deskhint">Type a word · <b>Enter</b> plays it · <b>Backspace</b> edits</div>
  <p class="sr" id="live" role="status" aria-live="polite"></p>
</div>

<script src="../shared/kit.js"></script>
<script src="puzzles.js"></script>
<script>
(function () {
  'use strict';

  const LINKS  = window.CHAINS_LINKS;
  const ROUNDS = window.CHAINS_ROUNDS;

  /* The day sets the round you open on; signing a card hands you the next one
     rather than a locked door. Kit.puzzleNo is that number — the one printed
     on the masthead, saved under, and shared. */
  const DAY   = Kit.puzzleNo('chains');
  const ROUND = Kit.pick(ROUNDS, 'chains');
  const HOLES = ROUND.holes;

  const save  = Kit.store('chains');
  const stats = Kit.store('chains:stats');

  const CALM = matchMedia('(prefers-reduced-motion: reduce)');
  const calm = () => CALM.matches;
  /* how long a beat is allowed to be. With motion off there are no beats to
     wait for, so every hand-off collapses to the shortest thing that still
     reads as a separate step. */
  const beat = (ms) => calm() ? Math.min(ms, 120) : ms;

  /* Kit.count drives a figure with requestAnimationFrame. If the tab is
     backgrounded (or throttled) mid-count the loop simply stops and the
     player is left looking at a number that is not their score — I hit this
     on a hidden tab, twice. Every count in this file lands on the truth
     whether or not it was watched getting there. */
  function tally(node, to, ms, fmt) {
    if (!node) return;
    Kit.count(node, to, { ms, fmt });
    setTimeout(() => { node.textContent = fmt(to); }, ms + 350);
  }

  /* A haptic vocabulary rather than one buzz for everything. Kit.haptic hands
     its argument straight to navigator.vibrate, which takes a pattern as well
     as a duration — so a rejection can stutter, a hole-out can knock. */
  const BUZZ = {
    tap:    4,               // a key, under the thumb
    played: 12,              // the ball is struck and comes to rest
    duff:   [16, 40, 16],    // a swing at nothing
    lip:    22,              // right pair, wrong way round
    caddie: [8, 40, 8],
    holed:  [14, 55, 46],    // knock · beat · drop
    signed: [26, 60, 26, 60, 70]
  };
  /* bottle green, fairway green, card stock, brass. Chains celebrates like a
     club, not like a party. */
  const PALETTE = ['#1c705a', '#2a7449', '#e5ddcc', '#8a6508', '#c9c0ab'];

  /* ---------- graph helpers ------------------------------------------- */
  const linked = (a, b) => !!(LINKS[a] && LINKS[a].indexOf(b) >= 0);

  function distTo(from, to) {              // strokes still needed, or Infinity
    if (from === to) return 0;
    const seen = new Set([from]);
    let frontier = [from], d = 0;
    while (frontier.length) {
      d++;
      const next = [];
      for (const w of frontier) for (const b of (LINKS[w] || [])) {
        if (b === to) return d;
        if (!seen.has(b)) { seen.add(b); next.push(b); }
      }
      frontier = next;
    }
    return Infinity;
  }

  /* one full shortest line from tee to pin — shown only after a hole is over,
     so it can never help you and can only sting */
  function bestLine(from, to) {
    if (from === to) return [from];
    const prev = new Map([[from, null]]);
    let frontier = [from];
    while (frontier.length) {
      const next = [];
      for (const w of frontier) for (const b of (LINKS[w] || [])) {
        if (prev.has(b)) continue;
        prev.set(b, w);
        if (b === to) {
          const out = [];
          let c = b;
          while (c !== null) { out.unshift(c); c = prev.get(c); }
          return out;
        }
        next.push(b);
      }
      frontier = next;
    }
    return null;
  }

  function stepToward(from, to) {          // first word on a shortest path
    if (linked(from, to)) return to;
    const prev = new Map([[from, null]]);
    let frontier = [from];
    while (frontier.length) {
      const next = [];
      for (const w of frontier) {
        for (const b of (LINKS[w] || [])) {
          if (prev.has(b)) continue;
          prev.set(b, w);
          if (b === to) {
            let cur = b;
            while (prev.get(cur) !== from) cur = prev.get(cur);
            return cur;
          }
          next.push(b);
        }
      }
      frontier = next;
    }
    const any = LINKS[from] || [];
    return any.length ? any[0] : null;
  }

  /* ---------- scoring vocabulary --------------------------------------- */
  function verdict(strokes, par, pickedUp) {
    if (pickedUp) return { name: 'Picked up', short: 'picked up', diff: par + 4 - par, tone: 'blown' };
    const d = strokes - par;
    const tone = d < 0 ? 'under' : d === 0 ? 'even' : d === 1 ? 'over' : 'blown';
    const name =
      d <= -3 ? 'Albatross' : d === -2 ? 'Eagle' : d === -1 ? 'Birdie' :
      d === 0 ? 'Par' : d === 1 ? 'Bogey' : d === 2 ? 'Double bogey' : 'Triple bogey';
    return { name, short: name.toLowerCase(), diff: d, tone };
  }
  const toPar = (d) => d === 0 ? 'E' : d > 0 ? '+' + d : '−' + Math.abs(d);
  const SQ = { under2: '🟦', under: '🟩', even: '🟨', over: '🟧', blown: '🟥', pick: '⬛' };
  function squareFor(v) {
    if (v.tone === 'blown' && v.name === 'Picked up') return SQ.pick;
    if (v.diff <= -2) return SQ.under2;
    if (v.diff === -1) return SQ.under;
    if (v.diff === 0) return SQ.even;
    if (v.diff === 1) return SQ.over;
    return SQ.blown;
  }

  /* ---------- state ---------------------------------------------------- */
  let S = save.get();
  if (!S || S.d !== DAY) {
    S = { d: DAY, hole: 0, chain: [HOLES[0].start.toLowerCase()], strokes: 0,
          caddie: false, caddieAt: -1, caddieHole: -1, caddieWord: null,
          scores: [], done: false };
    save.set(S);
  }
  let typed = '';
  let busy  = false;
  /* Presentation bookkeeping only — none of this is persisted and none of it
     changes what is legal. It exists so a render can tell what CHANGED and
     animate only that: a number that went up, a pip that was just marked, a
     warning that was just said. */
  let holeAnim  = false;   // the ball is in the air; hold the pin's payoff
  let lastN     = null;    // last stroke count painted
  let lastPips  = -1;      // holes scored at last paint
  let lastWarn  = '';      // last tension line said
  let lastLevel = null;    // 0 fine · 1 warn · 2 alarm, at the last paint
  let lastPinCap = null;   // last rangefinder reading painted on the pin
  let drift     = false;   // the last stroke moved AWAY from the pin
  let scrollHome = null;   // the timer that makes sure the course got there

  const hole = () => HOLES[S.hole];
  const head = () => S.chain[S.chain.length - 1];
  const maxStrokes = () => hole().par + 3;

  /* ---------- DOM ------------------------------------------------------ */
  const el = (id) => document.getElementById(id);
  const chainEl = el('chain'), courseEl = el('course'), pinEl = el('pin');
  const appEl = document.querySelector('.app');

  el('pno').textContent = 'No. ' + DAY;
  el('rname').textContent = ROUND.name;

  /* running total against the holes actually finished — the figure a golfer
     glances at between shots */
  function throughPar() {
    const shot = S.scores.reduce((a, s) => a + s.strokes, 0);
    const par  = S.scores.reduce((a, s) => a + s.par, 0);
    return shot - par;
  }

  function renderCardStrip() {
    /* a pip is only ever stamped once — the one the round just earned */
    const justScored = lastPips >= 0 && S.scores.length > lastPips ? S.scores.length - 1 : -1;
    lastPips = S.scores.length;
    let pips = '';
    HOLES.forEach((h, i) => {
      const sc = S.scores[i];
      let cls = 'pip', fig = '—';
      if (sc) {
        const v = verdict(sc.pickedUp ? sc.par + 4 : sc.strokes, sc.par, sc.pickedUp);
        cls += ' ' + v.tone;
        fig = sc.pickedUp ? 'X' : toPar(v.diff);
      } else if (i === S.hole && !S.done) {
        cls += ' now';
      }
      if (i === justScored) cls += ' stamp';
      pips += `<span class="${cls}"><i>${i + 1}</i><b>${fig}</b></span>`;
    });
    el('pips').innerHTML = pips;

    const d = throughPar();
    const fig = el('toParFig');
    /* the running total is tallied, not swapped */
    if (justScored >= 0 && !calm()) {
      Kit.count(fig, d, { from: +(fig.dataset.v || 0), ms: 480, fmt: toPar });
      setTimeout(() => { fig.textContent = S.scores.length ? toPar(d) : 'E'; }, 830);
    } else {
      fig.textContent = S.scores.length ? toPar(d) : 'E';
    }
    fig.dataset.v = S.scores.length ? d : 0;
    const t = el('toPar');
    t.className = 'topar ' + (!S.scores.length || d === 0 ? '' : d < 0 ? 'under' : d <= 2 ? 'over' : 'blown');
    el('cardBtn').setAttribute('aria-label',
      S.scores.length ? `Scorecard and rules — through ${S.scores.length}, ${toPar(d)} to par`
                      : 'Scorecard and rules — not started');
  }

  function renderHeader() {
    const h = hole();
    el('pinWord').textContent = h.target;
    renderCardStrip();

    /* once the round is signed the caddie has nothing left to do — the button
       becomes the way back into your card, so the last screen is never a wall */
    const cad = el('caddieBtn');
    if (S.done) {
      el('caddieIcon').textContent = 'sports_score';
      el('caddieLbl').textContent = 'Card';
      cad.disabled = false;
      cad.className = 'caddie signed';
    } else {
      el('caddieIcon').textContent = 'front_hand';
      el('caddieLbl').textContent = S.caddie ? 'Used' : 'Caddie';
      cad.disabled = S.caddie;
      cad.className = 'caddie' + (S.caddie ? ' spent' : '');
    }
    /* a signed round has nothing left to surrender */
    el('flagBtn').hidden = !!S.done;

    /* holeAnim is set for exactly as long as the ball is rolling: the pin
       must not have already turned green when it gets there. */
    const holed = (S.done || head() === h.target.toLowerCase()) && !holeAnim;
    pinEl.classList.toggle('done', holed);
    el('toPin').classList.toggle('holed', holed);
    appEl.classList.toggle('done', !!S.done);
    /* THE RANGEFINDER. The pin always reads the true distance, so a player
       knows after every stroke whether they walked toward the hole or away
       from it — recovery stops being a guess. It reveals nothing par hasn't
       already said (par = best + 1 is printed on the card). */
    let pinCap = holed ? 'Holed out' : 'The pin';
    if (!holed && !S.done && head() !== h.target.toLowerCase()) {
      const need = distTo(head(), h.target.toLowerCase());
      pinCap = need === Infinity ? 'The pin · no way home'
             : `The pin · ${need} link${need === 1 ? '' : 's'} out`;
    }
    el('pinLbl').textContent = pinCap;
    if (lastPinCap !== null && pinCap !== lastPinCap && !holed) Kit.flash(el('pinLbl'), 'said');
    lastPinCap = pinCap;
  }

  function renderScore() {
    const h = hole(), left = maxStrokes() - S.strokes;
    const need = S.done ? 0 : distTo(head(), h.target.toLowerCase());
    const n = el('strokeN');
    n.textContent = S.strokes;
    /* the stroke lands on the card rather than replacing the last one */
    if (lastN !== null && S.strokes > lastN) Kit.flash(n, 'struck');
    lastN = S.strokes;
    el('strokeL').textContent = `${S.strokes === 1 ? 'stroke' : 'strokes'} · par ${h.par}`;
    let tail = '';
    if (!S.done) {
      if (need === Infinity) tail = 'No way home — take a drop';
      else if (left === 1) tail = 'Last swing';
      else if (need === left) tail = 'Needs a perfect line';
      else if (drift) tail = 'Further from the pin';
      else if (left === 2) tail = 'Two swings left';
    }
    const w = el('strokeW');
    w.textContent = tail;
    /* said once, when it becomes true — not re-announced on every repaint */
    if (tail && tail !== lastWarn) Kit.flash(w, 'said');
    lastWarn = tail;
    const bar = el('lie');
    const alarm = !S.done && (left <= 1 || need === left || need === Infinity);
    bar.classList.toggle('alarm', alarm);
    bar.classList.toggle('warn', !S.done && !alarm && left === 2);
    /* the lie getting worse is news, and news arrives — once, on the change,
       never on a repaint and never on the first load of a resumed hole */
    const level = alarm ? 2 : bar.classList.contains('warn') ? 1 : 0;
    if (lastLevel !== null && level > lastLevel) {
      Kit.flash(bar.parentNode, 'jolt');
      Kit.haptic(level === 2 ? BUZZ.lip : BUZZ.tap);
    }
    lastLevel = level;
  }

  function renderChain(fresh) {
    chainEl.innerHTML = '';
    S.chain.forEach((w, i) => {
      if (i > 0) {
        const r = document.createElement('div');
        r.className = 'rung' + (fresh && i === S.chain.length - 1 ? ' fresh' : '');
        r.innerHTML = `<span class="made">${Kit.esc(S.chain[i - 1])}<em>·</em>${Kit.esc(w)}</span>`;
        chainEl.appendChild(r);
      }
      const n = document.createElement('div');
      n.className = 'node' + (i === 0 ? ' tee' : '') +
                    (fresh && i === S.chain.length - 1 ? ' snap' : '') +
                    (S.caddieAt === i ? ' caddied' : '');
      n.innerHTML = (i === 0 ? '<span class="tag">tee</span>' : '') +
                    `<span class="w">${Kit.esc(w)}</span>` +
                    (S.caddieAt === i ? Kit.icon('front_hand', { size: 15, fill: 1, cls: 'glove' }) : '');
      chainEl.appendChild(n);
    });

    if (!S.done) {
      /* The empty state is the lesson: the spine already carries HEAD·? , so
         the board itself says "your word has to follow that one" before any
         rule sheet does. It fills in live as you type.
         Wrapped so the tour can spotlight the join and the plate together
         without swallowing the whole course. */
      const up = document.createElement('div');
      up.className = 'teeup' + (fresh ? ' arrive' : '');
      up.id = 'teeup';
      const r = document.createElement('div');
      r.className = 'rung pending';
      /* the join carries whatever is on the plate — including a word the
         caddie put there, which render() sets without going through onKey */
      r.innerHTML = `<span class="made ghost">${Kit.esc(head())}<em>·</em>` +
                    `<span id="pendW">${typed ? Kit.esc(typed) : '?'}</span></span>`;
      up.appendChild(r);
      const e = document.createElement('div');
      e.className = 'node entry' + (typed ? '' : ' empty');
      e.id = 'entry';
      e.innerHTML = `<span class="w" id="entryW">${typed ? Kit.esc(typed) : 'your word'}</span>` +
                    '<span class="caret"></span>';
      up.appendChild(e);
      chainEl.appendChild(up);
    }
    /* The course is ALWAYS at its end — the plate you type into is the last
       thing in it. On a fresh stroke it walks there rather than jumping, but
       a smooth scroll is a request, not a guarantee: it is cancelled by any
       layout change underneath it (the lie row growing a warning line will do
       it), and a cancelled one strands the entry plate off-screen with no way
       to know the game is waiting for you. So it is always followed home. */
    const toEnd = () => { courseEl.scrollTop = courseEl.scrollHeight; };
    if (fresh && !calm() && typeof courseEl.scrollTo === 'function') {
      courseEl.scrollTo({ top: courseEl.scrollHeight, behavior: 'smooth' });
      clearTimeout(scrollHome);
      scrollHome = setTimeout(toEnd, 620);
    } else {
      toEnd();
    }
  }

  /* typing must not rebuild the chain — that would cut the compound flash short */
  function renderEntry(placed) {
    const e = el('entry');
    if (!e) return;
    e.classList.remove('given');    // the moment you edit it, it's yours
    e.classList.toggle('empty', !typed);
    const w = el('entryW');
    if (!typed) {
      w.textContent = 'your word';
    } else if (placed) {
      /* only the newest letter is animated: setting textContent would restart
         every letter's entrance on every keystroke */
      w.textContent = typed.slice(0, -1);
      const i = document.createElement('i');
      i.textContent = typed.slice(-1);
      w.appendChild(i);
    } else {
      w.textContent = typed;
    }
    el('pendW').textContent = typed || '?';
    /* a real text field's caret is solid while you are typing into it */
    const c = e.querySelector('.caret');
    if (c && !calm()) { c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; }
  }

  function render(fresh) { renderHeader(); renderScore(); renderChain(fresh); }

  /* ---------- play ----------------------------------------------------- */
  function onKey(k) {
    /* a sheet is open — the physical keyboard belongs to the sheet, not the
       board behind it, or typing during the help screen silently loads a word */
    if (document.querySelector('.scrim') || document.getElementById('tour-layer')) return;
    if (busy || S.done) return;
    if (k === 'BACK') { typed = typed.slice(0, -1); renderEntry(false); return; }
    if (k === 'ENTER') { submit(); return; }
    if (/^[A-Z]$/.test(k) && typed.length < 12) { typed += k.toLowerCase(); renderEntry(true); }
  }

  /* Touch is acknowledged before anything else happens. The on-screen keys get
     a tick under the thumb; a physical keyboard doesn't (nothing is being
     touched), which is why this hangs off the pad and not off onKey. */
  el('kbd').addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('.key')) Kit.haptic(BUZZ.tap);
  }, { passive: true });

  let misses = 0;   // rejections on this hole — enough of them and we point
                    // at the caddie, because silent frustration is how a
                    // player decides the dictionary is the enemy
  /* Three rejections, three different feelings. `how` picks the animation and
     the buzz: a duff is heavy and red, a lip-out is brass and rocks, and a
     word that is simply too short barely registers. */
  function bounce(msg, how) {
    Kit.toast(msg, 2600);
    Kit.haptic(BUZZ[how] || BUZZ.duff);
    const e = el('entry');
    if (e) Kit.flash(e, how === 'lip' ? 'lip' : 'duff');
    el('live').textContent = msg;
    /* nothing linking is exactly when a player decides the dictionary is the
       enemy — point at the caddie first, and at the flag once she's spent
       (or once they've bounced long enough that she clearly wasn't enough) */
    if ((++misses === 3 || misses === 6) && !S.done) {
      const m = misses;
      setTimeout(() => {
        if (S.done || document.querySelector('.scrim')) return;
        if (m === 3 && !S.caddie) Kit.toast('Stuck? The caddie is one tap away', 2600);
        else Kit.toast('Nothing linking? The flag can drop you back or pick up', 2800);
      }, 2400);
    }
  }

  function submit() {
    const w = typed.trim().toLowerCase();
    const from = head();
    if (!w) return;
    if (w.length < 2) { bounce('A little longer than that', 'lip'); return; }
    if (!linked(from, w)) {
      /* The near-miss the dictionary can actually prove: you had the right
         pair and played it backwards. Naming it is the difference between
         "the game is being awkward" and "oh — of course". It reveals nothing
         playable: a word that links TO your head is not a move FROM it. */
      if (linked(w, from)) {
        bounce(`${w.toUpperCase()}${from.toUpperCase()} — not the other way round`, 'lip');
        return;
      }
      bounce(`${from.toUpperCase()} · ${w.toUpperCase()} isn't in today's dictionary`, 'duff');
      return;
    }
    commit(w);
  }

  function commit(w) {
    busy = true;
    /* measured against where you stood, before the stroke is on the card —
       this is what feeds the "Further from the pin" line */
    const t = hole().target.toLowerCase();
    drift = distTo(w, t) > distTo(head(), t);
    typed = '';
    S.chain.push(w);
    S.strokes++;
    /* Hold the pin. If this stroke holed out, the flag must not already be
       filled and green by the time the ball gets there — settle() releases
       this the moment the ball drops in. */
    if (w === hole().target.toLowerCase()) holeAnim = true;
    /* mark the node the caddie actually handed you — not just the hole she was
       spent on, so the card shows where the help landed */
    if (S.caddieHole === S.hole && w === S.caddieWord && S.caddieAt < 0) {
      S.caddieAt = S.chain.length - 1;
    }
    save.set(S);
    Kit.haptic(BUZZ.played);
    el('live').textContent =
      `${S.chain[S.chain.length - 2]} ${w} — stroke ${S.strokes} of ${maxStrokes()}.`;
    render(true);
    if (!settle()) busy = false;
  }

  /* Kit.flash clears at 600ms; the pin's payoff runs 720. Its own timer. */
  function payOff() {
    pinEl.classList.remove('holed');
    void pinEl.offsetWidth;
    pinEl.classList.add('holed');
    setTimeout(() => pinEl.classList.remove('holed'), 900);
  }

  /* The hole has ended. Whatever the reason, the plate you were going to type
     into is no longer a thing you can do, and it must not sit there live for
     the second the ending takes. */
  function closeLie() {
    const t = el('teeup');
    if (!t) return;
    t.classList.add('leaving');
    /* and then out of the flow, so the fairway it was standing on becomes one
       unbroken run from the last plate to the pin */
    setTimeout(() => t.remove(), calm() ? 0 : 200);
  }

  /* ---------- THE SIGNATURE MOMENT -------------------------------------
     Holing out. The fairway that has been shortening all hole finally runs
     out: the lie clears, a ball rolls the last of it while the line closes
     solid behind it, it breaks left into the cup — and the pin converts:
     flag filled by the FILL axis, one ring off the rim, the plate taking the
     weight of it. Everything after this is a scorecard; this is the two
     seconds. `then` is called once the board has finished being looked at. */
  function holeOut(then) {
    closeLie();
    const land = () => {
      holeAnim = false;
      renderHeader();                 // the pin converts as the ball arrives
      Kit.haptic(BUZZ.holed);
      payOff();
      el('live').textContent = 'Holed out.';
    };
    if (calm()) { land(); setTimeout(then, 300); return; }

    /* the last plate is allowed to land first — struck, then rolling. The
       geometry is measured inside the lead, after the lie has left the flow,
       or the ball would be aimed at where the pin used to be. */
    setTimeout(() => {
      const stage = document.querySelector('.stage');
      const plates = chainEl.querySelectorAll('.node:not(.entry)');
      const from = plates[plates.length - 1];
      if (!from) { land(); setTimeout(then, 420); return; }

      const sr = stage.getBoundingClientRect();
      const fr = from.getBoundingClientRect();
      const pr = pinEl.getBoundingClientRect();
      const cr = pinEl.querySelector('.cup').getBoundingClientRect();
      const x0 = sr.width / 2;                          // the spine
      const y0 = fr.bottom - sr.top + 4;
      const y2 = cr.top + cr.height / 2 - sr.top - y0;  // all the way to the cup
      const x2 = cr.left + cr.width / 2 - sr.left - x0;
      const y1 = Math.max(8, pr.top - sr.top - y0 - 1);
      const roll = Math.max(460, Math.min(900, Math.abs(y2) * 3 + 320));

      const line = document.createElement('i');
      line.className = 'closeline';
      line.style.left = x0 + 'px';
      line.style.top = y0 + 'px';
      line.style.height = y1 + 'px';
      line.style.setProperty('--close', Math.round(roll * 0.68) + 'ms');
      stage.appendChild(line);

      const ball = document.createElement('i');
      ball.className = 'ball';
      ball.style.left = x0 + 'px';
      ball.style.top  = y0 + 'px';
      ball.style.setProperty('--roll', roll + 'ms');
      ball.style.setProperty('--y1', y1 + 'px');
      ball.style.setProperty('--y2', y2 + 'px');
      ball.style.setProperty('--x2', x2 + 'px');
      stage.appendChild(ball);

      setTimeout(() => { ball.remove(); line.remove(); land(); }, roll);
      setTimeout(then, roll + 840);
    }, 230);
  }

  /* After every stroke: holed out, out of swings, or mathematically dead.
     A player is never left flailing at a position the pin can't be reached
     from — the hole ends there, or it offers the way back. */
  function settle() {
    const h = hole(), t = h.target.toLowerCase();
    if (head() === t) { holeOut(() => finishHole(false)); return true; }
    holeAnim = false;
    const left = maxStrokes() - S.strokes;
    const need = distTo(head(), t);
    /* A hole that ends badly still ends: the last plate is allowed to land
       and be read before the card comes over it. */
    const wait = beat(760);
    const dead = (why, n) => { closeLie(); setTimeout(() => finishHole(true, why, n), wait); return true; };
    if (left <= 0)        return dead('swings');
    if (need === Infinity) {
      /* A cul-de-sac is no longer an instant funeral. If walking back one
         word leaves a live line, the player chooses: take the drop or pick
         up. (Only strandings can ever be rescued this way — a position that
         is merely too far stays too far after a drop, because one link can
         only change the distance by one while the penalty eats a swing.) */
      if (canDrop()) {
        setTimeout(() => {
          if (S.done || document.querySelector('.scrim')) return;
          troubleSheet();
        }, wait);
        return false;
      }
      return dead('nowhere');
    }
    if (need > left)       return dead('short', need);
    return false;
  }

  /* ---------- trouble: the drop and the pick-up ------------------------
     Golf's own escape hatches. A drop is one penalty stroke to stand back
     on the previous word — never a bargain, but always a way to keep
     playing when the word you're on has you beat. Picking up is allowed at
     any time, not just when the swings run out: par + 4 and walk. */
  function canDrop() {
    if (S.chain.length < 2) return false;
    const t = hole().target.toLowerCase();
    const back = distTo(S.chain[S.chain.length - 2], t);
    return back <= maxStrokes() - S.strokes - 1;   // still alive after the penalty
  }

  function doDrop() {
    const prev = S.chain[S.chain.length - 2];
    S.chain.pop();
    S.strokes++;                                   // the penalty stroke
    if (S.caddieAt >= S.chain.length) S.caddieAt = -1;
    typed = '';
    drift = false;
    misses = 0;
    save.set(S);
    Kit.haptic(BUZZ.lip);
    Kit.toast(`Back on ${prev.toUpperCase()} — one penalty stroke`, 2600);
    el('live').textContent =
      `Drop taken. Back on ${prev}, stroke ${S.strokes} of ${maxStrokes()}.`;
    render(false);
    if (!settle()) busy = false;
  }

  function troubleSheet() {
    const h = hole(), t = h.target.toLowerCase();
    const left = maxStrokes() - S.strokes;
    const need = distTo(head(), t);
    const prev = S.chain.length > 1 ? S.chain[S.chain.length - 2] : null;
    const drop = canDrop();
    const stranded = need === Infinity;
    const title = stranded ? 'Stranded' : 'In trouble?';
    const status = stranded
      ? `There is no line from <b>${Kit.esc(head().toUpperCase())}</b> back to
         <b>${Kit.esc(h.target)}</b> — not in one more link, not in a hundred.
         But you can go back the way you came.`
      : `<b>${Kit.esc(head().toUpperCase())}</b> is ${need} link${need === 1 ? '' : 's'} from
         <b>${Kit.esc(h.target)}</b>, with ${left} swing${left === 1 ? '' : 's'} in hand.`;
    const dropRow = drop
      ? `<b>Take a drop</b> — one penalty stroke, back to <b>${Kit.esc(prev.toUpperCase())}</b>`
      : !prev ? `<b>No drop here</b> — you are still on the tee`
      : `<b>A drop can't save this one</b> — not enough swings left from <b>${Kit.esc(prev.toUpperCase())}</b>`;
    Kit.sheet(`
      <div class="stagger">
        <h2>${title}</h2>
        <p class="sub">${status}</p>
        <div class="cadcost">
          <span class="row">${Kit.icon('undo', { size: 18 })}<span>${dropRow}</span></span>
          <span class="row">${Kit.icon('flag', { size: 18 })}<span><b>Pick up</b> — take the
            ${h.par + 4} and walk to the next tee</span></span>
        </div>
        ${drop ? `<button class="btn primary wide" id="dropGo" style="margin-top:18px">
          ${Kit.icon('undo', { size: 19 })}Take a drop</button>` : ''}
        <button class="btn ${drop ? 'tonal' : 'primary'} wide" id="pickGo"
                style="margin-top:${drop ? 8 : 18}px">
          ${Kit.icon('flag', { size: 19 })}Pick up the ball</button>
        <button class="btn ghost wide" data-close style="margin-top:8px">${
          stranded ? 'Look at the board' : 'Keep playing'}</button>
      </div>
    `, { onOpen(root, close) {
      root.setAttribute('aria-label', `${title} — take a drop or pick up`);
      const d = root.querySelector('#dropGo');
      if (d) d.addEventListener('click', () => { close(); doDrop(); });
      root.querySelector('#pickGo').addEventListener('click', () => {
        close();
        Kit.haptic(BUZZ.lip);
        busy = true;
        closeLie();
        el('live').textContent = 'Picked up.';
        setTimeout(() => finishHole(true, 'quit'), beat(300));
      });
    }});
  }

  el('flagBtn').addEventListener('click', () => {
    Kit.haptic(BUZZ.tap);
    if (S.done || busy) return;
    troubleSheet();
  });

  /* ---------- caddie --------------------------------------------------- */
  el('caddieBtn').addEventListener('click', () => {
    Kit.haptic(BUZZ.tap);
    if (S.done) { resultSheet(false); return; }
    if (S.caddie || busy) return;
    const h = hole();
    const t = h.target.toLowerCase();
    const needNow = distTo(head(), t);
    if (needNow >= maxStrokes() - S.strokes) {
      Kit.toast(needNow === Infinity
        ? "Even the caddie can't get home from here — try the flag"
        : 'No time for a caddie — you need every swing', 2400);
      Kit.haptic(BUZZ.lip);
      return;
    }
    Kit.sheet(`
      <div class="stagger">
        <h2>Call the caddie?</h2>
        <p class="sub">One word that keeps you alive from <b>${Kit.esc(head().toUpperCase())}</b>.</p>
        <div class="cadcost">
          <span class="row">${Kit.icon('add_link', { size: 18 })}<span><b>One stroke</b>, added right now</span></span>
          <span class="row">${Kit.icon('front_hand', { size: 18, fill: 1 })}<span><b>One caddie a round</b>${
            S.hole < HOLES.length - 1
              ? ` — ${HOLES.length - S.hole - 1} more hole${HOLES.length - S.hole - 1 === 1 ? '' : 's'} on your own`
              : ' — and this is the last hole'}</span></span>
        </div>
        <button class="btn primary wide" id="cadYes" style="margin-top:18px">
          ${Kit.icon('front_hand', { size: 19, fill: 1 })}Take the penalty
        </button>
        <button class="btn ghost wide" data-close style="margin-top:8px">Play it myself</button>
      </div>
    `, { onOpen(root, close) {
      /* Kit.sheet marks the dialog but cannot name it — a dialog with no
         accessible name is announced as bare "dialog". Every sheet in this
         file names itself here. */
      root.setAttribute('aria-label', 'Call the caddie');
      root.querySelector('#cadYes').addEventListener('click', () => {
        close();
        Kit.haptic(BUZZ.caddie);
        S.caddie = true;
        S.caddieHole = S.hole;
        S.strokes++;                       // the penalty stroke
