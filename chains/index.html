        const next = stepToward(head(), t);
        S.caddieWord = next;
        save.set(S);
        if (!next) { render(false); Kit.toast('Even the caddie is stumped', 2400); settle(); return; }
        Kit.toast(`Caddie says: ${next.toUpperCase()}`, 3200);
        typed = next;
        render(false);
        /* the word is handed to you, not typed by you — the plate says so
           until you play it */
        const e = el('entry');
        if (e) { e.classList.add('given'); Kit.flash(e, 'handed'); }
        settle();
      });
    }});
  });

  /* ---------- hole / round end ----------------------------------------- */
  function finishHole(pickedUp, why, need) {
    const h = hole();
    const v = verdict(S.strokes, h.par, pickedUp);
    const score = pickedUp ? h.par + 4 : S.strokes;
    S.scores.push({ strokes: score, swings: S.strokes, par: h.par, pickedUp,
                    caddie: S.caddieHole === S.hole, chain: S.chain.slice() });
    const last = S.hole >= HOLES.length - 1;
    save.set(S);
    renderCardStrip();
    holeSheet(v, pickedUp, last, why, need);
  }

  /* A line of play, printed. `against` turns it into a comparison: the words
     you also found go quiet and the first word where you turned off the
     tightest route is the only lit one on the card. */
  function lineHTML(words, against) {
    let turned = false;
    return words.map((w, i) => {
      let cls = '';
      if (against) {
        if (!turned && against[i] === w) cls = ' class="same"';
        else if (!turned) { turned = true; cls = ' class="turn"'; }
      }
      return `<i${cls}>${Kit.esc(w.toUpperCase())}</i>`;
      /* the joint travels with the word BEFORE it — a nbsp on its left. A
         plain space there lets a long line wrap onto a row that opens with a
         stranded "·", which reads as a typo on the panel people screenshot. */
    }).join('&nbsp;<em>·</em> ');
  }

  function holeSheet(v, pickedUp, last, why, need) {
    const h = hole();
    let title = v.name, body;
    if (pickedUp) {
      if (why === 'nowhere') {
        title = 'Stranded';
        body = `<p class="sub">There is no line from <b>${Kit.esc(head().toUpperCase())}</b> back to
                <b>${Kit.esc(h.target)}</b> — not in one more link, not in a hundred.
                Pick up: ${h.par + 4}.</p>`;
      } else if (why === 'short') {
        title = 'Unplayable';
        body = `<p class="sub">${need} more links to the pin and only ${maxStrokes() - S.strokes}
                swing${maxStrokes() - S.strokes === 1 ? '' : 's'} left. You can't get there from
                <b>${Kit.esc(head().toUpperCase())}</b>. Pick up: ${h.par + 4}.</p>`;
      } else if (why === 'quit') {
        title = 'Picked up';
        body = `<p class="sub">You called it from <b>${Kit.esc(head().toUpperCase())}</b> and
                walked in — sometimes the hole wins. Take the ${h.par + 4} and a fresh tee.</p>`;
      } else {
        title = 'Picked up';
        body = `<p class="sub">Out of swings, still short of <b>${Kit.esc(h.target)}</b>.
                Take the ${h.par + 4} and walk to the next tee.</p>`;
      }
    } else {
      body = `<p class="sub">${S.strokes} stroke${S.strokes === 1 ? '' : 's'} on a par ${h.par}.</p>`;
    }
    Kit.sheet(`
      <div class="stagger">
        <h2>${title}</h2>
        ${body}
        <div class="bigscore sm ${v.tone}" id="holeFig">
          <span class="fig tick">${pickedUp ? 'X' : toPar(v.diff)}</span>
          <span class="cap">${pickedUp ? 'no return · scored ' + (h.par + 4) : 'to par on hole ' + (S.hole + 1)}</span>
        </div>
        <div class="lineout">
          <span class="cap">${Kit.icon('polyline')}${
            pickedUp ? (why === 'quit' ? 'you picked up at' : 'your line ran out at') : 'your line'}</span>
          <b>${lineHTML(S.chain)}${pickedUp ? ' …' : ''}</b>
        </div>
        ${missedHTML(pickedUp) || foundHTML(pickedUp)}
        ${cardHTML(true)}
        <button class="btn primary wide" id="nextBtn" style="margin-top:16px">
          ${last ? Kit.icon('sports_score', { size: 19, fill: 1 }) + 'Sign the card'
                 : 'Next hole' + Kit.icon('arrow_forward', { size: 19 })}
        </button>
      </div>
    `, { sticky: true, onOpen(root, close) {
      root.setAttribute('aria-label', `Hole ${S.hole + 1} result — ${title}`);
      /* the figure is tallied onto the sheet, from level par to what it cost */
      if (!pickedUp) tally(root.querySelector('#holeFig .fig'), v.diff, 560, toPar);
      root.querySelector('#nextBtn').addEventListener('click', () => {
        close();
        if (last) { endRound(); return; }
        S.hole++;
        S.chain = [HOLES[S.hole].start.toLowerCase()];
        S.strokes = 0;
        S.caddieAt = -1;
        typed = '';
        busy = false;
        misses = 0;
        drift = false;
        save.set(S);
        render(false);
      });
    }});
  }

  /* The hole is over — now show what was there. Not when they already found a
     tightest line (nothing to teach, and it would flatten the win), only when
     they didn't. This is where the day's "oh, COME ON" lives, and it's also how
     a player learns the dictionary without ever being helped mid-hole. */
  function missedHTML(pickedUp) {
    const h = hole();
    if (!pickedUp && S.strokes <= h.best) return '';
    const bl = bestLine(h.start.toLowerCase(), h.target.toLowerCase());
    if (!bl) return '';
    /* Don't hand a player their own line back as the one they missed. It
       happens whenever the caddie's penalty stroke pushes the score past
       h.best on a route that was, in fact, perfect. */
    if (bl.join(' ') === S.chain.join(' ')) return '';
    const short = bl.length - 1;
    const kind = h.long ? 'eagle' : 'birdie';
    /* the sting scales: one stroke off is the whole pitch of this game, and it
       is worded as a loss rather than as a lesson */
    const gap = S.strokes - short;
    const cap = pickedUp ? `there was a ${short}-stroke line — ${kind}`
      : gap === 1 ? `one stroke off · a ${short}-stroke ${kind} was there`
      : `there was a ${short}-stroke line — ${kind}`;
    return `<div class="lineout missed">
      <span class="cap">${Kit.icon('alt_route')}${cap}</span>
      <b>${lineHTML(bl, S.chain)}</b></div>`;
  }

  /* The other half of the brief: when there was no better line, say so. A hole
     that simply ends with a score tells you nothing about whether you were
     clever — this is the sentence that does. */
  function foundHTML(pickedUp) {
    if (pickedUp || S.strokes > hole().best) return '';
    return `<p class="nearline good">${Kit.icon('military_tech')}<b>The tightest line
      on the hole.</b> There was no shorter way round.</p>`;
  }

  function cardHTML(partial) {
    const arrow = Kit.icon('east', { size: 13 });
    const glove = Kit.icon('front_hand', { size: 13, fill: 1, cls: 'glove' });
    let rows = '', total = 0, parTotal = 0;
    HOLES.forEach((h, i) => {
      const sc = S.scores[i];
      parTotal += h.par;
      if (!sc) {
        rows += `<tr class="pending"><td class="hole">${i + 1}</td>
                 <td class="leg">${Kit.esc(h.start)}${arrow}${Kit.esc(h.target)}</td>
                 <td class="num">${h.par}</td><td class="num">—</td><td class="res num"></td></tr>`;
        return;
      }
      total += sc.strokes;
      const v = verdict(sc.pickedUp ? sc.par + 4 : sc.strokes, sc.par, sc.pickedUp);
      rows += `<tr><td class="hole">${i + 1}</td>
               <td class="leg">${Kit.esc(h.start)}${arrow}${Kit.esc(h.target)}${sc.caddie ? glove : ''}</td>
               <td class="num">${sc.par}</td><td class="num">${sc.strokes}</td>
               <td class="res num ${v.tone}">${sc.pickedUp ? 'X' : toPar(v.diff)}</td></tr>`;
    });
    const played = S.scores.length;
    const parSoFar = S.scores.reduce((a, s) => a + s.par, 0);
    const d = total - (partial ? parSoFar : parTotal);
    const tone = d < 0 ? 'under' : d === 0 ? 'even' : d <= 2 ? 'over' : 'blown';
    rows += `<tr class="tot"><td></td><td class="leg">${played < HOLES.length ? 'Through ' + played : 'Round'}</td>
             <td class="num">${partial ? parSoFar : parTotal}</td><td class="num">${total}</td>
             <td class="res num ${tone}">${toPar(d)}</td></tr>`;
    return `<div class="cardwrap"><table class="card">
            <thead><tr><th></th><th>Hole</th><th class="num">Par</th>
            <th class="num">Sc</th><th class="res num">+/−</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`;
  }

  /* ---------- share ---------------------------------------------------- */
  function shareText() {
    const total = S.scores.reduce((a, s) => a + s.strokes, 0);
    const par   = HOLES.reduce((a, h) => a + h.par, 0);
    const d     = total - par;
    const lines = S.scores.map((sc) => {
      const v = verdict(sc.pickedUp ? sc.par + 4 : sc.strokes, sc.par, sc.pickedUp);
      const n = Math.max(1, sc.swings != null ? sc.swings : sc.strokes);
      return `⛳ ${squareFor(v).repeat(n)} ${sc.pickedUp ? 'picked up' : v.short}${sc.caddie ? ' 🧤' : ''}`;
    });
    /* headline first, the way a golfer reads a card: the number to par, then
       the strokes. Kept short enough to render on a 390px phone unwrapped. */
    return [`CHAINS #${DAY} · ${toPar(d)} (${total} strokes)`]
      .concat(lines)
      .concat(['sfun.games/chains'])
      .join('\n');
  }

  function endRound() {
    S.done = true;
    save.set(S);
    bumpStats();
    render(false);
    /* the clubhouse view is composed before the card lands on top of it */
    setTimeout(() => resultSheet(true), beat(320));
  }

  function bumpStats() {
    if (S.counted) return;
    const st = stats.get() || { rounds: 0, toPar: 0, best: null, birdies: 0, eagles: 0 };
    const total = S.scores.reduce((a, s) => a + s.strokes, 0);
    const par   = HOLES.reduce((a, h) => a + h.par, 0);
    st.rounds++;
    st.toPar += (total - par);
    st.best = st.best === null ? (total - par) : Math.min(st.best, total - par);
    S.scores.forEach(sc => {
      if (sc.pickedUp) return;
      const d = sc.strokes - sc.par;
      if (d === -1) st.birdies++;
      if (d <= -2) st.eagles++;
    });
    stats.set(st);
    S.counted = true;
    save.set(S);
  }

  /* The one line that makes a round worth posting. Every card has one of the
     brief's two stories in it somewhere — either you found a line nobody
     expects you to find, or you missed one by a single stroke — and this digs
     that story out of the figures the card already holds. */
  function storyLine() {
    let perfect = 0, oneOff = 0, lost = 0;
    S.scores.forEach((sc, i) => {
      if (sc.pickedUp) { lost++; return; }
      const gap = sc.strokes - HOLES[i].best;
      if (gap <= 0) perfect++;
      else if (gap === 1) oneOff++;
    });
    if (perfect === HOLES.length) {
      return { cls: ' good', icon: 'military_tech',
        html: `The tightest line on <b>every hole</b>. There was nothing left out there.` };
    }
    if (oneOff) {
      return { cls: '', icon: 'alt_route',
        html: oneOff === 1 ? `One hole lost by <b>a single stroke</b>.`
                           : `<b>${oneOff} holes</b> lost by a single stroke.` };
    }
    if (perfect) {
      return { cls: ' good', icon: 'polyline',
        html: perfect === 1 ? `You found the tightest line on <b>one hole</b>.`
                            : `You found the tightest line on <b>${perfect} holes</b>.` };
    }
    if (lost) {
      return { cls: '', icon: 'sentiment_dissatisfied',
        html: lost === 1 ? `One hole you never got back from.`
                         : `<b>${lost} holes</b> you never got back from.` };
    }
    return null;
  }

  function resultSheet(fresh) {
    const total = S.scores.reduce((a, s) => a + s.strokes, 0);
    const par   = HOLES.reduce((a, h) => a + h.par, 0);
    const d     = total - par;
    const tone  = d < 0 ? 'under' : d === 0 ? 'even' : d <= 2 ? 'over' : 'blown';
    const st    = stats.get() || { rounds: 0, toPar: 0, best: null, birdies: 0, eagles: 0 };
    const headline =
      d <= -2 ? 'A card to frame' : d === -1 ? 'Under par' : d === 0 ? 'Level par' :
      d <= 2 ? 'One over here or there' : 'Rough day on the course';
    const story = storyLine();
    Kit.sheet(`
      <div class="stagger">
        <h2>${headline}</h2>
        <p class="sub caps">${Kit.esc(ROUND.name)} · ${Kit.dateLabel()}</p>
        <div class="bigscore ${tone}" id="roundFig">
          <span class="fig tick">${toPar(d)}</span>
          <span class="cap">to par · ${total} strokes</span>
        </div>
        ${story ? `<p class="nearline${story.cls}">${Kit.icon(story.icon)}${story.html}</p>` : ''}
        ${cardHTML(false)}
        <div class="statrow">
          <div class="stat"><span class="n">${st.rounds}</span><span class="l">rounds</span></div>
          <div class="stat"><span class="n">${st.rounds ? toPar(Math.round(st.toPar / st.rounds)) : '—'}</span><span class="l">average</span></div>
          <div class="stat"><span class="n">${st.best === null ? '—' : toPar(st.best)}</span><span class="l">best</span></div>
          <div class="stat"><span class="n">${st.birdies + st.eagles}</span><span class="l">birdie+</span></div>
        </div>
        <div class="sharegrid" id="sg">${Kit.esc(shareText())}</div>
        <button class="btn primary wide" id="shareBtn">
          ${Kit.icon('share', { size: 19 })}Share the scorecard
        </button>
        <div class="teebox">
          ${Kit.nextButton('chains', 'Next round')}
          <div class="teerow">
            <button class="btn ghost" data-close>Back to the card</button>
            <button class="btn ghost" data-help>How to play</button>
          </div>
        </div>
      </div>
    `, { onOpen(root, close) {
      root.setAttribute('aria-label', `Round signed — ${toPar(d)} to par`);
      /* the round is tallied up in front of you rather than handed over */
      tally(root.querySelector('#roundFig .fig'), d, 820, toPar);

      /* Confetti is a club blazer, not a party hat: only a round actually
         under par gets it, and only the first time it is signed. */
      if (fresh && d < 0) {
        setTimeout(() => {
          const r = root.querySelector('#roundFig').getBoundingClientRect();
          Kit.burst({ x: r.left + r.width / 2, y: r.top + r.height / 2,
                      n: d <= -2 ? 54 : 38, colors: PALETTE });
          Kit.haptic(BUZZ.signed);
        }, 760);
      }

      /* The button is handed over. Kit.share restores it through innerHTML, so
         the symbol survives, and it paints the outcome it actually got — an OS
         share sheet, a clipboard write, or a select-and-copy fallback — rather
         than this file guessing "Copied" on click and being wrong whenever the
         clipboard was blocked.
         The next tee needs no wiring at all: Kit.nextButton is delegated at
         the document, so it only has to be rendered. */
      const sb = root.querySelector('#shareBtn');
      sb.addEventListener('click', () => {
        Kit.haptic(BUZZ.played);
        Kit.share(shareText(), sb);
      });

      /* the rules are one tap from the last screen of the round too — the bar
         carries the theme switch alone so the wordmark can hold the centre */
      wireHelp(root, close);
    }});
  }

  /* ---------- help ------------------------------------------------------
     One sentence, then a picture of the board itself. Everything after the
     diagram is fine print — a first-timer should be able to close this after
     four seconds and still know what to do.

     The worked example is AIR → SILL and it is chosen, not decorative. The
     one it replaced was FIRE → CAR in four, which is the closing hole of the
     Opening Round, tightest line and all: opening the rules on that day
     handed you an eagle. Neither AIR nor SILL is the start or the target of
     any hole in puzzles.js, so this line cannot be anyone's answer — while
     every link in it is real, so the diagram never lies about the game. */
  const HELP = `
    <p class="sub">Every word you play has to make a compound with the word above it.</p>
    <div class="demo" aria-hidden="true">
      <span class="dw tee">AIR</span>
      <span class="dl">air<em>·</em>craft</span>
      <span class="dw">CRAFT</span>
      <span class="dl">craft<em>·</em>shop</span>
      <span class="dw">SHOP</span>
      <span class="dl">shop<em>·</em>window</span>
      <span class="dw">WINDOW</span>
      <span class="dl">window<em>·</em>sill</span>
      <span class="dw pinw">SILL ${Kit.icon('golf_course', { size: 16, fill: 1 })}</span>
    </div>
    <p class="demolbl">Air to sill in <b>four strokes</b></p>
    <ul class="rules">
      <li><b>No free undo.</b> A word that doesn't link bounces. A word that links is
          played, and you carry on from there — or take a drop: one penalty stroke
          to step back a word.</li>
      <li><b>Par</b> is one over the tightest line there is, so a perfect route is a
          birdie — an eagle on the long hole.</li>
      <li>Three holes, then you sign the card.</li>
    </ul>
    <div class="fineprint">
      <b>The pin reads the distance</b> — after every stroke you know how many
      links home you are. <b>One caddie a round</b> names a word that keeps you
      alive, for a stroke. <b>In trouble?</b> The flag takes a drop — one
      penalty stroke, back one word — or picks up for par + 4, any time.
    </div>
    <div class="keymap">
      <span><b>Type</b> a word</span><span><b>Enter</b> plays it</span><span><b>Backspace</b> edits</span>
    </div>`;

  const openHelp = () => Kit.sheet(
    `<div class="stagger"><h2>Compound-word golf</h2>${HELP}
     <button class="btn primary wide" data-close style="margin-top:18px">Got it</button></div>`,
    { onOpen(root) { root.setAttribute('aria-label', 'How to play'); } });

  /* The rules live behind the card now, not behind a third button in the bar —
     one utility a side is what lets the wordmark hold the true centre of the
     masthead at 320px. Both sheets a player can reach from the board carry the
     way in, and the sheet they are standing in gets out of the way first
     rather than stacking a dialog on a dialog. */
  function wireHelp(root, close) {
    const b = root.querySelector('[data-help]');
    if (!b) return;
    b.addEventListener('click', () => {
      Kit.haptic(BUZZ.tap);
      close();
      setTimeout(openHelp, beat(220));
    });
  }

  el('cardBtn').addEventListener('click', () => {
    Kit.haptic(BUZZ.tap);
    if (S.done) { resultSheet(false); return; }
    /* Same gate as the caddie, and for the same reason: `busy` is the window
       where the hole has already resolved and the board is still playing it
       out. Opening the card in that window put a "Through 0 · 0 · 0 · E" sheet
       over a round that had already moved on — the kit's sheet singleton now
       evicts it when the hole sheet arrives, but the card should never have
       been openable while the ball was rolling in the first place. */
    if (busy) return;
    Kit.sheet(`<div class="stagger"><h2>Your card</h2>
      <p class="sub caps">${Kit.esc(ROUND.name)} · ${Kit.dateLabel()}</p>
      ${cardHTML(true)}
      <div class="teerow" style="margin-top:18px">
        <button class="btn ghost" data-help>How to play</button>
        <button class="btn primary" data-close>Back to the tee</button>
      </div></div>`,
      { onOpen(root, close) {
        root.setAttribute('aria-label', 'Your scorecard');
        wireHelp(root, close);
      } });
  });
  Kit.themeToggle(el('themeBtn'));

  /* ---------- onboarding ------------------------------------------------
     Nobody reads a rules wall. Three spotlights, one sentence each, ending on
     the spine — where the tee word, the joint and the empty plate already say
     the rule between them. The full rules stay behind the ?. */
  function runTour() {
    Kit.tour([
      { sel: '#pin', place: 'above',
        text: `Three holes of golf. This one ends at <b>${Kit.esc(hole().target)}</b> — the pin.` },
      { sel: '#helpers', place: 'below',
        text: 'Stuck later? The caddie names a word, once a round, for a stroke — and the flag can drop you back a word or pick up.' },
      /* the last mark is tight on the join and the plate under it, because
         those two already carry the rule: HEAD · ? , and somewhere to type */
      { sel: '#teeup', place: 'below', pad: 6,
        text: `Fill the blank on the line: any word that makes a compound with <b>${Kit.esc(head().toUpperCase())}</b>.` }
    ], { doneLabel: 'Tee off' });
  }

  /* ---------- boot ------------------------------------------------------ */
  /* The kit's global key handler calls preventDefault() on ENTER so a word can
     be played with nothing focused. preventDefault() on an ENTER keydown is
     also exactly what cancels a focused control's activation — so with the kit
     handler mounted, NOTHING on this page could be activated with ENTER: not
     the card header, not the back link, not a button inside an open sheet.
     Kit.keyboard hands back destroy() for precisely this; the replacement is
     the kit's own mapping with two rules added — a sheet or a coach mark owns
     the keyboard while it is up, and a focused control owns ENTER. Every
     render leaves focus on <body>, so type-then-ENTER on the board is
     unchanged, and the on-screen keys are exempt because ENTER on the pad
     still means "play it". */
  const kb = Kit.keyboard(el('kbd'), onKey, { enterLabel: 'PLAY' });
  kb.destroy();
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (document.querySelector('.scrim') || document.getElementById('tour-layer')) return;
    if (e.key === 'Enter') {
      // A control owns ENTER only while the word buffer is EMPTY. Once the
      // player has typed a letter, the board owns their keystrokes until they
      // play or clear them — otherwise a button still holding focus (the
      // caddie they backed out of, a Call it they peeked at) silently eats
      // every ENTER, and on desktop, where the on-screen keys are hidden and
      // typing is the only input path, the game is simply stuck.
      if (!typed.length && Kit.ownsKey(e)) return;
      onKey('ENTER'); e.preventDefault();
    } else if (e.key === 'Backspace') { onKey('BACK'); e.preventDefault(); }
    else if (/^[a-zA-Z]$/.test(e.key)) { onKey(e.key.toUpperCase()); e.preventDefault(); }
  });

  /* Two different unfinished states can be on disk, and they need opposite
     treatment. `carded` is a hole that HAS been scored but whose sheet was
     never dismissed — S.hole only moves on when you press Next hole, so a
     reload while that sheet was up leaves the card written and the board
     still standing on the finished hole. It must NOT be scored again: a
     second push would shunt every later hole's figures one row down the
     card and credit a hole nobody played. Put the sheet back instead.
     The other state is a hole resolved a beat before it was scored — the
     ball was still rolling — where the saved chain is already at the pin
     (or already dead) with no card written. That one is finished on load,
     and settle() is a no-op on any position that can still be played. */
  const carded   = !S.done && S.scores.length > S.hole;
  const stranded = !S.done && !carded && head() === hole().target.toLowerCase();
  if (stranded) holeAnim = true;
  render(false);

  if (S.done) {
    setTimeout(() => resultSheet(false), 260);
  } else if (carded) {
    busy = true;
    setTimeout(() => {
      const sc = S.scores[S.hole], h = hole();
      /* `why`/`need` are presentation-only and were never persisted, so a
         resumed pick-up falls back to the plain "out of swings" wording. */
      holeSheet(verdict(S.strokes, h.par, sc.pickedUp), sc.pickedUp,
                S.hole >= HOLES.length - 1);
    }, 260);
  } else if (settle()) {
    busy = true;
  } else if (Kit.once('chains:tour')) {
    setTimeout(runTour, 420);
  }
})();
</script>
</body>
</html>
